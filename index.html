U({
id:6, lvl:'B1 → B2', band:1,
title:'Relative clauses: joining ideas like a native',
sub:'who, which, that, whose, where · The guy I was talking to · Long sentences in novels',
focus:'defining and non-defining relative clauses, who/which/that/whose/where/when, omitting the relative pronoun, prepositions at the end (the person I work with), which referring to a whole clause, commas',
lesson:`
<p class="lead">Frases longas de romance e de textos de prova se apoiam nas relativas. O inglês tem duas novidades para nós: pode <b>omitir</b> o pronome e coloca a preposição <b>no fim</b>.</p>
<h3>Os pronomes</h3>
<div class="tw"><table class="tbl">
<tr><th>pronome</th><th>para</th><th>exemplo</th></tr>
<tr><td><b>who</b> / that</td><td>pessoas</td><td>The woman <b>who</b> called was my aunt.</td></tr>
<tr><td><b>which</b> / that</td><td>coisas</td><td>The book <b>which</b> I'm reading is great.</td></tr>
<tr><td><b>whose</b></td><td>posse (cujo)</td><td>The man <b>whose</b> car was stolen called the police.</td></tr>
<tr><td><b>where</b></td><td>lugar</td><td>The café <b>where</b> we met has closed.</td></tr>
<tr><td><b>when</b></td><td>tempo</td><td>I remember the day <b>when</b> I arrived.</td></tr>
</table></div>
<h3>Definidoras × explicativas</h3>
<p><b>Definidoras</b> identificam (sem vírgulas, aceitam <i>that</i>): <i>The students <b>who passed</b> got a certificate</i> (só esses). <b>Explicativas</b> acrescentam informação (com vírgulas, <b>nunca that</b>): <i>My brother, <b>who lives in Recife</b>, is a doctor.</i></p>
<h3>Omitir o pronome</h3>
<p>Quando o pronome é <b>objeto</b> da relativa, ele some, e isso é o mais comum na fala: <i>The film (that) <b>we saw</b> was boring. The person (who) <b>I spoke to</b> was very helpful.</i> Se é sujeito, fica: <i>The person <b>who called</b>…</i></p>
<h3>Preposição no fim</h3>
<div class="chips">a pessoa <b>com quem</b> trabalho → the person I work <b>with</b> · a cidade <b>de onde</b> venho → the city I come <b>from</b> · o que você está procurando? → what are you looking <b>for</b>?</div>
<p>A versão formal existe (<i>the person with whom I work</i>), mas é rara fora da escrita acadêmica.</p>
<div class="trap"><span class="pen">Cuidado!</span> «O que» no meio da frase é <b>what</b>: <i>I don't understand <b>what</b> you mean</i> (não <s>that you mean</s>). E «o que» comentando a frase anterior é <b>which</b>: <i>He passed the exam, <b>which</b> surprised everyone.</i></div>
<div class="trap"><span class="pen">Cuidado!</span> Não repita o objeto: <s>The book that I bought <b>it</b></s> → <i>The book that I bought</i>.</div>
`,

focus:'verb + -ing (enjoy, avoid, mind, finish, suggest, consider, keep, can\'t stand), verb + to (decide, hope, manage, refuse, afford, seem), verbs that change meaning (stop, remember, forget, try, regret, go on), preposition + -ing, adjective + to, make/let + bare infinitive',
lesson:`
<p class="lead">Em português, depois de um verbo vem sempre o infinitivo: «gosto de ler», «decidi sair». Em inglês, cada verbo escolhe: <b>-ing</b> ou <b>to</b>. É uma das áreas mais cobradas nas provas B2 e C1, e uma das que mais denunciam o falante latino.</p>
<h3>Verbos + -ing</h3>
<div class="chips">enjoy · avoid · mind · finish · suggest · consider · keep · miss · imagine · practise · risk · deny · admit · can't stand · can't help · it's worth · feel like · give up · look forward to</div>
<p><i>I <b>enjoy cooking</b>. Would you <b>mind closing</b> the door? I <b>can't help laughing</b>. It's <b>worth seeing</b>.</i></p>
<h3>Verbos + to</h3>
<div class="chips">decide · hope · want · plan · manage · refuse · afford · agree · promise · offer · seem · tend · learn · expect · pretend · deserve · threaten</div>
<p><i>We <b>managed to finish</b>. I can't <b>afford to buy</b> it. She <b>pretended to be</b> asleep.</i></p>
<h3>Os que mudam de sentido</h3>
<div class="tw"><table class="tbl">
<tr><th>verbo</th><th>+ -ing</th><th>+ to</th></tr>
<tr><td>stop</td><td>I <b>stopped smoking</b>. (parei de fumar)</td><td>I <b>stopped to smoke</b>. (parei para fumar)</td></tr>
<tr><td>remember</td><td>I <b>remember locking</b> the door. (lembro de ter trancado)</td><td><b>Remember to lock</b> the door. (lembre-se de trancar)</td></tr>
<tr><td>forget</td><td>I'll never <b>forget meeting</b> you. (memória)</td><td>Don't <b>forget to call</b>. (tarefa)</td></tr>
<tr><td>try</td><td><b>Try restarting</b> it. (experimente, como teste)</td><td>I <b>tried to open</b> it. (esforço)</td></tr>
<tr><td>regret</td><td>I <b>regret saying</b> that. (me arrependo de ter dito)</td><td>We <b>regret to inform</b> you… (lamentamos informar)</td></tr>
</table></div>
<h3>Depois de preposição: sempre -ing</h3>
<p><i>I'm interested <b>in learning</b>. Thanks <b>for coming</b>. She left <b>without saying</b> goodbye. <b>Instead of complaining</b>, do something. I'm good <b>at remembering</b> names.</i></p>
<div class="trap"><span class="pen">Cuidado!</span> Quando <b>to</b> é preposição, também vem -ing: <i>look forward <b>to seeing</b></i>, <i>be used <b>to working</b></i>, <i>object <b>to paying</b></i>, <i>when it comes <b>to cooking</b></i>.</div>
<h3>make, let, help</h3>
<p><b>make</b> e <b>let</b> + infinitivo sem to: <i>She <b>made me laugh</b>. My parents <b>let me go</b>.</i> (não <s>made me to laugh</s>). <b>help</b> aceita os dois: <i>help me (to) move</i>.</p>
<div class="trap"><span class="pen">Cuidado!</span> <i>suggest</i> nunca leva to: <i>I suggest <b>leaving</b> early</i> ou <i>I suggest <b>(that) we leave</b> early</i>. E <i>recommend</i> também: <i>I recommend <b>reading</b> it.</i></div>
`,

title:'Why I Stopped Trying to Be Productive',
text:`<p>For years I tried to do everything. I'd wake up at five to meditate, I avoided eating sugar, and I kept [[track|registro]] of every minute in a colourful app. I couldn't stand wasting time, and I felt guilty whenever I wasn't working on something.</p>
<p>Then, one evening, I stopped to look at my calendar and realised I hadn't seen my best friend in four months. I remembered promising to visit her in spring. It was October.</p>
<p>That was the moment I decided to change. I didn't give up planning completely, but I started asking myself a different question: instead of "How can I do more?", I asked "What is actually worth doing?"</p>
<p>The first thing I did was delete half of my apps. Then I tried saying no to meetings without a clear purpose. At first it felt [[rude|grosseiro]], but most people didn't seem to mind. Some even thanked me.</p>
<p>I still enjoy being organised. I still forget to drink water. But I've learned to let myself rest without apologising for it, and I'm much better at noticing when I'm tired. My friend, by the way, made me promise to come back in December. I'm really looking forward to seeing her.</p>`,

U({
id:8, lvl:'B2 → C1', band:2,
title:'Past modals: must have, should have, could have',
sub:'Deduction, regret and criticism · The grammar of every crime series',
focus:'modals of deduction in the present (must, might, can\'t be) and past (must have, might/may/could have, can\'t/couldn\'t have), past criticism and regret (should have, shouldn\'t have, could have), needn\'t have vs didn\'t need to, contracted pronunciation (must\'ve, should\'ve, could\'ve)',
lesson:`
<p class="lead">Séries policiais, dramas e discussões de casal vivem de deduções e arrependimentos: <i>He <b>must have</b> known. You <b>should have</b> told me! It <b>can't have</b> been her.</i> Na fala, tudo isso vira «must-uv», «shoulda», «coulda».</p>
<h3>Dedução: presente e passado</h3>
<div class="tw"><table class="tbl">
<tr><th>certeza</th><th>presente</th><th>passado</th></tr>
<tr><td>quase certo que sim</td><td>She <b>must be</b> tired.</td><td>She <b>must have been</b> tired. (ela deve ter ficado)</td></tr>
<tr><td>talvez</td><td>He <b>might / may / could be</b> at home.</td><td>He <b>might / may / could have left</b>. (pode ter saído)</td></tr>
<tr><td>quase certo que não</td><td>It <b>can't be</b> true.</td><td>It <b>can't / couldn't have been</b> him. (não pode ter sido)</td></tr>
</table></div>
<div class="trap"><span class="pen">Cuidado!</span> O contrário de <i>must</i> na dedução é <b>can't</b>, não <s>mustn't</s>: <i>He <b>can't be</b> at work, it's Sunday.</i></div>
<h3>Crítica e arrependimento</h3>
<div class="chips">You <b>should have</b> called me. (devia ter ligado) · I <b>shouldn't have</b> eaten so much. (não devia ter comido) · You <b>could have</b> told me! (podia ter me dito) · We <b>could have</b> won. (poderíamos ter ganhado)</div>
<h3>needn't have × didn't need to</h3>
<p><i>I <b>needn't have</b> brought an umbrella</i> = trouxe, mas não era necessário. <i>I <b>didn't need to</b> bring an umbrella</i> = não era necessário (provavelmente não trouxe).</p>
<h3>Como soa</h3>
<p>O <i>have</i> quase desaparece: <i>must've</i> /mʌstəv/, <i>should've</i> /ʃʊdəv/, <i>could've</i>, <i>might've</i>. Em legendas e em mensagens informais aparece até <i>shoulda, coulda, woulda</i>.</p>
<div class="trap"><span class="pen">Cuidado na escrita</span> Como soa igual, muitos nativos escrevem <s>should of</s>. Está errado: é sempre <b>should have</b> / <b>should've</b>.</div>
<div class="plus"><span class="pen">Para quem fala espanhol</span> <i>Debe de haber sido</i> (dedução) = <i>must have been</i>; <i>Debería haberlo dicho</i> (crítica) = <i>should have said it</i>. Em português, «deve ter» e «devia ter» fazem a mesma distinção.</div>
`,

text:`<p>Detective Morgan stood in the doorway and looked around. The flat was spotless: no dishes in the sink, no clothes on the chairs, not even dust on the shelves.</p>
<p>"She must have left in a hurry," said Officer Diaz.</p>
<p>"I don't think so," Morgan replied. "Look at this place. Someone who leaves in a hurry doesn't clean the kitchen first. She must have planned it for weeks."</p>
<p>"But her neighbour said she was here on Friday night. She can't have gone far."</p>
<p>"The neighbour might have been wrong. Or she might have seen someone else." Morgan opened the [[wardrobe|guarda-roupa]]. It was empty except for one coat. "She could have taken a train, a bus, a plane… And we wasted the whole weekend. We should have come here on Friday, as soon as her sister called."</p>
<p>Diaz looked [[embarrassed|constrangido]]. "I'm sorry. I shouldn't have told the sister to wait until Monday."</p>
<p>Morgan picked up a small piece of paper from the floor. It was a [[receipt|recibo]] from a café near the station, dated Saturday, 7:42 a.m. "Well," he said quietly, "she didn't need to hide this. She wanted us to find it."</p>`,

U({
id:9, lvl:'B2 → C1', band:2,
title:'Wishes, regrets and imaginary situations',
sub:'I wish I knew · If only I hadn\'t… · I\'d rather you didn\'t · It\'s time we left',
focus:'wish/if only + past simple (present), + past perfect (past), + would (annoyance); mixed conditionals; I\'d rather + past; it\'s (high) time + past; as if / as though',
lesson:`
<p class="lead">Depois de <i>wish</i>, o inglês usa um tempo «para trás», como no condicional tipo 2 e 3. O português usa o subjuntivo: «quem me dera que eu <b>soubesse</b>» → <i>I wish I <b>knew</b></i>.</p>
<h3>As três formas de wish</h3>
<div class="tw"><table class="tbl">
<tr><th>desejo sobre…</th><th>estrutura</th><th>exemplo</th></tr>
<tr><td>o presente</td><td>wish + past simple</td><td>I wish I <b>spoke</b> better English. I wish I <b>were</b> taller.</td></tr>
<tr><td>o passado (arrependimento)</td><td>wish + past perfect</td><td>I wish I <b>had studied</b> harder. I wish I <b>hadn't said</b> that.</td></tr>
<tr><td>o comportamento de outra pessoa (irritação)</td><td>wish + would</td><td>I wish you <b>would stop</b> interrupting me!</td></tr>
</table></div>
<p><b>If only</b> é a versão mais intensa: <i>If only I <b>had</b> more time! If only she <b>had called</b>!</i></p>
<div class="trap"><span class="pen">Cuidado!</span> Não se usa <i>wish + would</i> para você mesma: <s>I wish I would have more money</s> → <i>I wish I <b>had</b> more money</i>. Para um desejo de futuro simples, use <b>hope</b>: <i>I <b>hope</b> you pass</i> (não <s>I wish you pass</s>).</div>
<h3>Condicionais mistos</h3>
<p>Misturam o tipo 2 e o 3 quando o tempo da condição e do resultado são diferentes:</p>
<div class="chips">passado → presente: If I <b>had taken</b> that job, I <b>would be</b> rich now. · presente → passado: If I <b>weren't</b> so shy, I <b>would have spoken</b> to him.</div>
<h3>I'd rather, it's time, as if</h3>
<div class="chips">I'd rather <b>stay</b> home. (eu) · I'd rather <b>you didn't</b> smoke here. (outra pessoa: passado) · It's (high) time we <b>left</b>. (já passou da hora) · He talks as if he <b>knew</b> everything.</div>
<div class="plus"><span class="pen">Nos filmes</span> <i>I wish I could…</i> é uma das frases mais comuns em diálogos emotivos: <i>I wish I could stay. I wish I could take it back.</i></div>
`,

title:'Letter to My Younger Self',
text:`<p>Dear Fifteen-Year-Old Me,</p>
<p>I know you're sitting at the back of the class, hoping nobody asks you a question in English. I wish I could tell you that it's going to be easy. It isn't. But it's going to be worth it.</p>
<p>Right now you think speaking a language means never making mistakes. If only someone had told me earlier that this isn't true! If I had understood that at your age, I would be much more confident today. I spent years knowing the grammar perfectly and saying almost nothing, which is a bit like learning to swim on dry land.</p>
<p>I wish you would stop comparing yourself to the girl in the front row whose father is American. She isn't better than you; she just had more practice. And I'd rather you spent your money on books and films than on the expensive course that Mum's friend [[recommended|recomendou]]. You'll learn more from one series you love than from a hundred [[worksheets|fichas de exercícios]].</p>
<p>It's high time you stopped being afraid of sounding stupid. Nobody is listening as carefully as you think. People are too busy worrying about their own accents.</p>
<p>Love,<br>Thirty-Something You</p>`,

model:`Dear Twenty-Year-Old Me,

I wish I could sit next to you for an hour, in that tiny room in Curitiba, and tell you to relax a little. You think you have to decide your whole life this year. You don't.

I wish you had taken that semester in Dublin. You said no because you were afraid of not understanding anything. If you had gone, you would speak English without fear today, and you wouldn't need to start again at thirty-five. If only someone had told you that fear is normal and goes away with practice!

I also wish you would stop apologising for everything. People like you more than you think.

If I could start again, I would read more, travel more and worry less about other people's opinions. But I'd rather you didn't change too much: some of your mistakes brought me to a life I really like.

It's time you stopped waiting to feel ready. Nobody ever does.

Love,
Your future self`

U({

title:'Real spoken English: what films actually sound like',
sub:'gonna, wanna, kinda · contractions · question tags · «Want some?» · fillers',
focus:'contractions and weak forms, gonna/wanna/gotta/hafta/kinda/lemme/dunno/gimme, question tags (isn\'t it? didn\'t you?), ellipsis in speech (Want some? You okay? Sounds good), fillers and discourse markers (like, you know, I mean, actually, anyway, so), so/such',
lesson:`
<p class="lead">Você entende a frase escrita e não a reconhece falada. Isso não é falta de vocabulário: é que o inglês falado <b>junta, encurta e engole</b> palavras. Esta unidade mostra o que o ouvido precisa esperar.</p>
<h3>Reduções que você vai ouvir em todo filme</h3>
<div class="tw"><table class="tbl">
<tr><th>escrito</th><th>falado</th><th>escrito</th><th>falado</th></tr>
<tr><td>going to</td><td><b>gonna</b></td><td>want to / wants to</td><td><b>wanna</b> / wansta</td></tr>
<tr><td>have got to</td><td><b>gotta</b></td><td>have to / has to</td><td><b>hafta</b> / hasta</td></tr>
<tr><td>kind of / sort of</td><td><b>kinda / sorta</b></td><td>let me</td><td><b>lemme</b></td></tr>
<tr><td>give me</td><td><b>gimme</b></td><td>I don't know</td><td><b>dunno</b> / I dunno</td></tr>
<tr><td>what do you / what are you</td><td><b>whaddaya</b></td><td>did you / would you</td><td><b>didja / wouldja</b></td></tr>
<tr><td>don't you</td><td><b>doncha</b></td><td>got you</td><td><b>gotcha</b></td></tr>
<tr><td>out of</td><td><b>outta</b></td><td>a lot of</td><td><b>a lotta</b></td></tr>
</table></div>
<p>Use essas formas para <b>entender</b>; na escrita formal e nas provas, escreva a forma completa.</p>
<h3>Palavras fracas</h3>
<p>Preposições, artigos e auxiliares quase somem: <i>a cup <b>of</b> tea</i> soa «a cuppa tea»; <i>Where <b>have you</b> been?</i> soa «where-v-ya-been». O acento cai nas palavras de conteúdo: <i>I'm <b>GO</b>nna <b>CALL</b> her to<b>MOR</b>row.</i></p>
<h3>Question tags</h3>
<p>O «né?» do inglês. Afirmativa → tag negativa; negativa → tag afirmativa, com o mesmo auxiliar:</p>
<div class="chips">It's cold, <b>isn't it</b>? · You saw it, <b>didn't you</b>? · She can't swim, <b>can she</b>? · You've been there, <b>haven't you</b>? · I'm late, <b>aren't I</b>? · Let's go, <b>shall we</b>?</div>
<h3>Frases cortadas (ellipsis)</h3>
<p>Na conversa, o sujeito e o auxiliar caem: <i>(Do you) Want some? (Are) You okay? (It) Sounds good. (Have you) Seen my keys? (I) Told you so.</i></p>
<h3>Fillers e marcadores</h3>
<div class="chips"><b>like</b> (tipo) · <b>you know</b> · <b>I mean</b> (quer dizer) · <b>actually</b> (na verdade) · <b>anyway</b> (enfim) · <b>so</b> (então) · <b>well</b> · <b>kind of</b> (meio que) · <b>I guess</b> (acho que) · <b>to be honest</b></div>
<p>Eles também servem para <b>você</b>: ganham tempo enquanto pensa, e soam muito mais naturais que um silêncio ou um «éééé».</p>
<div class="trap"><span class="pen">Falso amigo!</span> <b>actually</b> = na verdade, «na real». Não é «atualmente» (= <i>currently, nowadays</i>).</div>
`,

lesson:`
<p class="lead">No nível C1, o que separa «correto» de «natural» é o vocabulário idiomático. Esta unidade reúne os phrasal verbs de três partes e as expressões que aparecem em todo diálogo de série.</p>
<h3>Phrasal verbs de três partes (inseparáveis)</h3>
<div class="tw"><table class="tbl">
<tr><th>verbo</th><th>sentido</th><th>exemplo</th></tr>
<tr><td>come up with</td><td>ter (uma ideia), inventar</td><td>She <b>came up with</b> a brilliant plan.</td></tr>
<tr><td>put up with</td><td>aguentar, tolerar</td><td>I can't <b>put up with</b> the noise anymore.</td></tr>
<tr><td>get away with</td><td>sair impune</td><td>He lied and <b>got away with</b> it.</td></tr>
<tr><td>look down on / look up to</td><td>desprezar / admirar</td><td>I've always <b>looked up to</b> my aunt.</td></tr>
<tr><td>catch up with / keep up with</td><td>alcançar / acompanhar</td><td>I can't <b>keep up with</b> the news.</td></tr>
<tr><td>cut down on</td><td>reduzir</td><td>I'm <b>cutting down on</b> sugar.</td></tr>
<tr><td>get on with</td><td>dar-se bem; continuar</td><td>Let's <b>get on with</b> the meeting.</td></tr>
<tr><td>run out of / fall out with</td><td>ficar sem / brigar com</td><td>She <b>fell out with</b> her sister.</td></tr>
</table></div>
<h3>Mais seis indispensáveis</h3>
<div class="chips"><b>bring up</b> (criar filhos; mencionar) · <b>turn out</b> (revelar-se: it turned out that…) · <b>end up</b> (acabar, ir parar) · <b>point out</b> (salientar) · <b>rule out</b> (descartar) · <b>sort out</b> (resolver)</div>
<h3>Expressões idiomáticas de todo dia</h3>
<div class="tw"><table class="tbl">
<tr><th>idiom</th><th>sentido</th><th>idiom</th><th>sentido</th></tr>
<tr><td>a piece of cake</td><td>moleza</td><td>break the ice</td><td>quebrar o gelo</td></tr>
<tr><td>the last straw</td><td>a gota d'água</td><td>under the weather</td><td>meio doente</td></tr>
<tr><td>hit the sack / hit the hay</td><td>ir dormir</td><td>spill the beans</td><td>contar o segredo</td></tr>
<tr><td>cost an arm and a leg</td><td>custar os olhos da cara</td><td>once in a blue moon</td><td>muito raramente</td></tr>
<tr><td>on the fence</td><td>em cima do muro</td><td>get cold feet</td><td>amarelar</td></tr>
<tr><td>call it a day</td><td>encerrar o dia</td><td>beat around the bush</td><td>enrolar</td></tr>
<tr><td>a blessing in disguise</td><td>há males que vêm para bem</td><td>no big deal</td><td>nada de mais</td></tr>
<tr><td>to be on the same page</td><td>estar alinhados</td><td>it's not rocket science</td><td>não é nenhum bicho de sete cabeças</td></tr>
</table></div>
<div class="plus"><span class="pen">Coincidências</span> Algumas são iguais ao português: <i>break the ice</i>, <i>on the fence</i> («em cima do muro»), <i>cost an arm and a leg</i> (parecido com «os olhos da cara»). Use essas pontes para memorizar.</div>
<div class="trap"><span class="pen">Cuidado!</span> Idioms são informais: ótimos na fala e em e-mails amigáveis, mas evite-os num ensaio acadêmico da prova.</div>
`,
reading:{
title:'How We Ended Up Running a Bakery',
text:`<p>Five years ago, my partner and I were both working in tech, earning good money and hating every minute. Our boss took the credit for everything we came up with, and we'd been putting up with it for far too long.</p>
<p>The last straw was a Friday evening when he cancelled our holiday, again, because of a "critical" project that turned out to be a client's typo. That night, over a bottle of wine, Leo pointed out that I'd been baking bread every weekend for ten years. "You're good at it," he said. "Why don't we sell it?"</p>
<p>At first I was on the fence. Bakeries cost an arm and a leg to open, and neither of us knew anything about business. But we did our [[homework|lição de casa (pesquisa)]], cut down on everything we could and started selling at a Saturday market.</p>
<p>It wasn't a piece of cake. We got up at four, we fell out with each other at least once a week, and we nearly got cold feet before signing the [[lease|contrato de aluguel]] on the shop. But losing those jobs was a blessing in disguise.</p>
<p>Today we have six employees and a queue outside every morning. Once in a blue moon, I miss the [[steady salary|salário fixo]]. Then I smell the first loaf coming out of the oven, and I get on with my day.</p>`,

U({
id:12, lvl:'B2 → C1', band:2,
title:'Writing for exams: linking, inversion and emphasis',
sub:'However, although, despite · Not only… but also · Never have I… · What I need is…',
focus:'contrast linkers (however, although, even though, despite/in spite of + -ing or noun, whereas, nevertheless), addition and result (moreover, furthermore, therefore, as a result), inversion after negative adverbials (not only, rarely, never, little, no sooner, only when), cleft sentences (What I need is…, It was X who…), formal register and essay structure',
lesson:`
<p class="lead">Nas provas B2 First, C1 Advanced e IELTS, o texto ganha pontos pela <b>organização</b>: como as ideias se ligam e como você enfatiza. Esta unidade é a caixa de ferramentas do ensaio.</p>
<h3>Contraste: o grupo que mais confunde</h3>
<div class="tw"><table class="tbl">
<tr><th>conector</th><th>depois vem…</th><th>exemplo</th></tr>
<tr><td><b>although / even though</b></td><td>frase completa</td><td><b>Although</b> it was raining, we went out.</td></tr>
<tr><td><b>despite / in spite of</b></td><td>substantivo ou -ing</td><td><b>Despite</b> the rain / <b>Despite being</b> tired, …</td></tr>
<tr><td><b>however / nevertheless</b></td><td>nova frase, com vírgula</td><td>It was raining. <b>However,</b> we went out.</td></tr>
<tr><td><b>whereas / while</b></td><td>comparação de duas frases</td><td>I love cities, <b>whereas</b> my husband prefers the countryside.</td></tr>
</table></div>
<div class="trap"><span class="pen">Cuidado!</span> <s>Despite it was raining</s> → <i>Despite <b>the rain</b></i> ou <i>Despite <b>the fact that</b> it was raining</i>. E nunca <s>despite of</s>: é <i>despite</i> ou <i>in spite of</i>.</div>
<h3>Adição e consequência</h3>
<div class="chips"><b>Moreover / Furthermore / In addition,</b> … · <b>Therefore / As a result / Consequently,</b> … · <b>On the one hand</b> … <b>on the other hand</b> … · <b>In conclusion / To sum up,</b> …</div>
<h3>Inversão: ênfase de nível C1</h3>
<p>Depois de uma expressão negativa ou restritiva no início, a ordem vira de pergunta:</p>
<div class="chips"><b>Not only</b> is it cheaper, <b>but</b> it is also faster. · <b>Never have I</b> seen such a mess. · <b>Rarely do</b> we get this opportunity. · <b>Little did she know</b> that… · <b>No sooner had</b> I arrived <b>than</b> it started to rain. · <b>Only when</b> I moved abroad <b>did I</b> understand…</div>
<h3>Cleft sentences: destacar uma parte</h3>
<p><i>I need a holiday</i> → <b>What I need is</b> a holiday. <i>Maria found the error</i> → <b>It was Maria who</b> found the error. <i>The price worries me</i> → <b>What worries me is</b> the price.</p>
<h3>Estrutura de um ensaio de prova</h3>
<ol class="dots"><li><b>Introdução</b>: reformule o tema e diga o que vai discutir (sem opinião forte ainda).</li><li><b>Parágrafo 1</b>: primeiro argumento + exemplo.</li><li><b>Parágrafo 2</b>: segundo argumento ou o outro lado (<i>On the other hand…</i>).</li><li><b>Conclusão</b>: sua opinião, apoiada no que disse.</li></ol>
<div class="plus"><span class="pen">Registro formal</span> No ensaio: sem contrações (<i>do not</i>, não <i>don't</i>), sem phrasal verbs muito informais (<i>increase</i> em vez de <i>go up</i>), e com sujeitos impessoais (<i>It could be argued that…</i>).</div>

title:'Should Films Be Watched with Subtitles?',
text:`<p>Few questions divide language learners as much as this one. While some teachers argue that subtitles are a crutch, others claim they are one of the most effective learning tools available. Both views, however, may be partly right.</p>
<p>On the one hand, subtitles in the learner's own language can clearly be [[counterproductive|contraproducentes]]. Not only do they shift attention away from the sound, but they also encourage the brain to rely on translation. As a result, viewers may finish a whole series without improving their listening at all.</p>
<p>On the other hand, subtitles in the target language seem to offer real benefits. Research suggests that reading and hearing the same words at the same time helps learners to [[segment|segmentar]] fast speech into recognisable words. What makes this so useful is precisely the gap between how English is written and how it is spoken. Rarely do textbooks prepare students for the speed of a real conversation.</p>
<p>Despite these advantages, there is a risk: some learners never move beyond the subtitles. Only when they are switched off does the ear have to work on its own.</p>
<p>It would therefore seem that the key is gradual progress: native-language subtitles never, target-language subtitles at first, and none at all as soon as possible.</p>`,

model:`It is often claimed that films and series are a more effective way to learn a foreign language than traditional classes. While this view has some merit, I would argue that the two approaches work best together.

On the one hand, audiovisual material offers something that classrooms rarely provide: authentic language at natural speed. Not only do learners hear real accents and idiomatic expressions, but they also see how language is used in context. Moreover, because series are enjoyable, learners tend to spend many more hours on them than on textbooks.

On the other hand, entertainment alone has clear limitations. Despite its benefits, it does not explain why a structure is used, and it seldom forces learners to produce language themselves. As a result, many people understand a great deal but are unable to speak or write accurately. What classes provide is precisely this: feedback, structure and the opportunity to practise.

In conclusion, it is not a question of choosing one method over the other. In my view, learners should use classes to build a solid foundation and series to develop listening skills and vocabulary. Rarely does a single method produce fluent speakers; it is the combination that makes the difference.`
}

reading:{title:'The Neighbour Who Never Spoke',
text:`<p>When I moved into my flat in Manchester, I didn't know anybody in the building. Every morning I saw the same old man on the stairs. He always wore a grey hat, and he never said a word. I said "Good morning" every day for two months, but he just nodded.</p>
<p>One evening in December, there was a power cut. The whole street was dark and very cold. I was looking for candles when somebody knocked on my door. It was the old man, with a torch and a flask of hot soup. "You're the girl who always says good morning," he said. "I thought you might be cold."</p>
<p>His name was Arthur. He was eighty-four, and he had been a jazz pianist for forty years. He explained that he didn't talk much because he was nearly deaf. We sat on the stairs and drank the soup while he told me stories about clubs in London in the 1960s.</p>

reading:{title:'The Translator\'s Notebook',
text:`<p>For twenty years, Helen Marsh translated Brazilian novels into English, and for twenty years she kept a small black notebook that nobody was allowed to see. After her death last spring, her nephew found it in a drawer and, after some hesitation, decided to publish it.</p>
<p>The notebook turned out to be neither a diary nor a collection of secrets. It was a list of words: Portuguese words that Helen had never managed to translate. Next to each one she had written the dates of her attempts and, occasionally, a short comment. Beside <i>saudade</i> she had simply written "Gave up. Again."</p>
<p>Critics who had expected a scandal were disappointed. Readers, however, were fascinated. The book has been reprinted four times, and it is said that several universities are now using it to teach translation. What makes it so popular, according to its editor, is that it shows the work that normally remains invisible: the hours spent on a single word, the doubts, the small defeats.</p>
<p>Helen's nephew admits that he hesitated before publishing it. "She would have hated the attention," he says. "But I think she would have liked the idea that people finally saw how hard she had worked."</p>`,

reading:{title:'In Defence of Boredom',
text:`<p>Few people today would admit to being bored. We carry devices that promise endless entertainment, and the moment our attention drifts, a screen is there to rescue us. Yet a growing number of psychologists argue that this rescue comes at a price.</p>
<p>Boredom, they suggest, is not simply an unpleasant state to be avoided. It functions as a signal: a sign that our current activity is not meeting our needs and that something should change. Researchers at a British university found that participants who had first completed a deliberately tedious task went on to produce more creative ideas than those who had not. Little did the volunteers suspect, while copying numbers from a phone book, that they were preparing their minds for invention.</p>
<p>The problem, according to these researchers, is not that we feel bored, but that we no longer allow the feeling to last long enough to be useful. Had we tolerated a few more minutes of emptiness, we might have reached the point where the mind begins to wander and connect unrelated ideas.</p>
<p>None of this means that we should throw away our phones. What it does suggest is that occasional moments of doing nothing may be worth protecting, not least because, as one researcher puts it, "a mind that is never bored is a mind that is never really free."</p>`,

]},

{t:'British or American?', pt:'As diferenças que você vai ouvir nas séries', tag:'Language',
p:[
["British and American English are the same language, but you will notice differences in [[vocabulary|vocabulário]], spelling and pronunciation. In London you live in a <i>flat</i>, take the <i>underground</i> and put your rubbish in the <i>bin</i>. In New York you live in an <i>apartment</i>, take the <i>subway</i> and put your <i>trash</i> in the <i>garbage can</i>.","O inglês britânico e o americano são a mesma língua, mas você vai notar diferenças de vocabulário, ortografia e pronúncia. Em Londres você mora num flat, pega o underground e põe o lixo no bin. Em Nova York mora num apartment, pega o subway e põe o trash no garbage can."],
["Spelling changes too: British <i>colour, centre, travelled, organise</i>; American <i>color, center, traveled, organize</i>. Both are correct. In an exam, the only rule is to be [[consistent|coerente]]: choose one and keep it.","A ortografia também muda: britânico colour, centre, travelled, organise; americano color, center, traveled, organize. As duas estão certas. Numa prova, a única regra é ser coerente: escolha uma e mantenha."],
["The biggest difference for your ear is the letter R. Most Americans pronounce it everywhere (<i>car, water, hard</i>), while in southern England it [[disappears|desaparece]] after a vowel: «cah», «wah-tuh». Americans also turn the T between vowels into a quick D: <i>water</i> sounds like «wadder», <i>better</i> like «bedder».","A maior diferença para o seu ouvido é a letra R. A maioria dos americanos a pronuncia sempre (car, water, hard), enquanto no sul da Inglaterra ela desaparece depois de vogal: «cah», «wah-tuh». Os americanos também transformam o T entre vogais num D rápido: water soa como «wadder», better como «bedder»."]
],
curio:["«Pants» means trousers in the US but underwear in the UK, so be careful in London.","In the UK the ground floor is floor 0 and the first floor is upstairs; in the US the ground floor is the first floor.","A «chips» in London is a «fries» in New York; American «chips» are British «crisps»."],

{t:'Accents you will hear in films', pt:'Um mapa dos sotaques mais comuns', tag:'Accents',
p:[
["Hollywood films mostly use «General American», a neutral accent from no particular place. But as soon as you watch series, the accents multiply. Southern Americans, from Texas or Georgia, speak more slowly and stretch the vowels: «I» can sound like «ah». New Yorkers speak fast and sometimes drop the R.","Os filmes de Hollywood usam sobretudo o «General American», um sotaque neutro de lugar nenhum. Mas nas séries os sotaques se multiplicam. Os americanos do sul, do Texas ou da Geórgia, falam mais devagar e esticam as vogais: «I» pode soar como «ah». Os nova-iorquinos falam rápido e às vezes engolem o R."],
["In Britain, the accent of the BBC and of period dramas is called RP, Received Pronunciation, though very few people actually speak it. London has Cockney, where the T in the middle of words becomes a little stop in the throat: <i>water</i> sounds like «wa'er». Scottish and Irish accents roll the R and have their own [[rhythm|ritmo]] and [[vocabulary|vocabulário]]: in Ireland, <i>grand</i> means «fine».","Na Grã-Bretanha, o sotaque da BBC e dos dramas de época se chama RP, Received Pronunciation, embora pouquíssimas pessoas o falem de verdade. Londres tem o Cockney, em que o T no meio das palavras vira uma pequena parada na garganta: water soa como «wa'er». Os sotaques escocês e irlandês vibram o R e têm ritmo e vocabulário próprios: na Irlanda, grand quer dizer «tudo bem»."],
["Don't try to understand every accent from the start. Begin with General American and RP, then add one new accent at a time. Australian English, for example, is easier than it seems once you get used to its [[rising intonation|entonação que sobe]] at the end of sentences.","Não tente entender todos os sotaques desde o início. Comece pelo General American e pelo RP, depois acrescente um sotaque novo de cada vez. O inglês australiano, por exemplo, é mais fácil do que parece quando você se acostuma com a entonação que sobe no fim das frases."]
],
curio:["Many British actors use an American accent in Hollywood: Hugh Laurie in House is a famous example.","In the series Derry Girls, even British viewers sometimes turn on the subtitles.","Some linguists say there are more than 30 distinct accents in the UK, a country smaller than the state of São Paulo."],
w:[["accent","sotaque"],["to drop a letter","engolir uma letra"],["neutral","neutro"],["to roll the R","vibrar o R"],["Cockney","sotaque popular de Londres"],["grand (Irish)","tudo bem, ótimo"]],
q:[["Which accent do most Hollywood films use?",["Cockney","General American","RP","Southern American"],1],["In Cockney, «water» sounds like…",["wadder","wa'er","wah-tuh","wo-ter"],1],["What does the text recommend?",["Learn all accents at once","Start with two main accents and add others gradually","Avoid British films","Only watch Australian series"],1]]},
{t:'What the British say and what they mean', pt:'Educação, ironia e eufemismos', tag:'Everyday life',
p:[
["British people are famous for being polite, but their politeness often hides the real message. «That's an interesting idea» may mean «I don't like it». «I'll bear it in mind» can mean «I'll forget it immediately». And «Quite good» is usually less [[enthusiastic|entusiasmado]] than it sounds.","Os britânicos são famosos pela educação, mas ela muitas vezes esconde a mensagem real. «That's an interesting idea» pode querer dizer «não gostei». «I'll bear it in mind» pode significar «vou esquecer na hora». E «quite good» costuma ser menos entusiasmado do que parece."],
["[[Understatement|Atenuação]] is another national habit. A terrible storm is «a bit windy»; a disaster is «not ideal». This is also the source of a lot of British humour, which is often dry: people say serious things with a straight face, and you have to guess whether they are joking.","A atenuação é outro hábito nacional. Uma tempestade terrível é «a bit windy»; um desastre é «not ideal». Isso também está na origem de muito do humor britânico, que costuma ser seco: as pessoas dizem coisas sérias sem mudar a expressão, e você tem de adivinhar se estão brincando."],
["Finally, the word «sorry». The British say it constantly: when they bump into you, when you bump into them, and even to ask you to repeat something. For a Brazilian, it can feel cold at first. In reality, it is a way of keeping things smooth between [[strangers|desconhecidos]].","Por fim, a palavra «sorry». Os britânicos a dizem o tempo todo: quando esbarram em você, quando você esbarra neles e até para pedir que você repita algo. Para uma brasileira, pode parecer frio no começo. Na verdade, é um jeito de manter a convivência tranquila entre desconhecidos."]
],
curio:["«With the greatest respect…» often means «I think you are completely wrong».","The British queue even for buses that are almost empty.","«You must come round for dinner sometime» is often just a friendly phrase, not a real invitation."],
w:[["to bear in mind","levar em conta"],["understatement","atenuação, eufemismo"],["dry humour","humor seco"],["a straight face","cara séria"],["to bump into","esbarrar em"],["polite","educado"]],
q:[["«That's an interesting idea» may really mean…",["I love it","I don't like it","Tell me more","I'll do it"],1],["What is understatement?",["Exaggerating","Making things sound less serious","Speaking quietly","Using slang"],1],["Why do the British say «sorry» so often?",["They are always guilty","To keep things smooth between people","Because they are sad","It's the law"],1]]},
{t:'American small talk', pt:'Conversa fiada, entusiasmo e gorjetas', tag:'Everyday life',
p:[
["In the United States, strangers talk to each other a lot: in queues, in lifts, at the supermarket. «How are you doing?» is a greeting, not a real question. The [[expected|esperada]] answer is short: «Good, thanks! You?» Starting a long description of your week can surprise people.","Nos Estados Unidos, desconhecidos conversam muito: em filas, elevadores, no supermercado. «How are you doing?» é um cumprimento, não uma pergunta de verdade. A resposta esperada é curta: «Good, thanks! You?» Começar a descrever sua semana pode surpreender as pessoas."],
["Americans also use enthusiastic words easily: «amazing», «awesome», «I love it!». This doesn't always mean deep emotion. It's simply the normal [[tone|tom]] of friendly conversation, especially in service jobs and at work.","Os americanos também usam palavras entusiasmadas com facilidade: «amazing», «awesome», «I love it!». Isso nem sempre indica uma emoção profunda. É simplesmente o tom normal de uma conversa amigável, sobretudo no atendimento e no trabalho."],
["One thing you shouldn't forget is tipping. In restaurants, a tip of 18 to 22 percent is normal, because waiters' salaries are low. Not leaving a tip is seen as a serious [[complaint|reclamação]], not as saving money.","Uma coisa que você não deve esquecer é a gorjeta. Nos restaurantes, uma gorjeta de 18 a 22 por cento é normal, porque o salário dos garçons é baixo. Não deixar gorjeta é visto como uma reclamação séria, não como economia."]
],
curio:["Safe small-talk topics: the weather, sport, weekend plans, food. Avoid salary, religion and politics with strangers.","«Let's grab coffee sometime» is friendly, but not always a real plan; propose a day if you mean it.","In American offices, first names are used with almost everyone, including the boss."],
w:[["small talk","conversa fiada"],["to tip","dar gorjeta"],["a greeting","um cumprimento"],["awesome","incrível"],["to grab coffee","tomar um café rápido"],["a stranger","um desconhecido"]],
q:[["How should you answer «How are you doing?»",["With a long description of your week","Briefly: «Good, thanks! You?»","Say nothing","«I'm doing a course»"],1],["Why are tips important in the US?",["Waiters' salaries are low","It's a tax","It's optional and rare","Only tourists tip"],0],["Which topic is safe with a stranger?",["Salary","The weather","Religion","Politics"],1]]},
{t:'Shakespeare in everyday English', pt:'Expressões que você usa sem saber', tag:'Literature',
p:[
["William Shakespeare wrote at the end of the sixteenth century, but many of his [[phrases|expressões]] are still used every day. When someone says that something «vanished into thin air», that a rule is «too much of a good thing», or that they «haven't slept a wink», they are quoting him, often without knowing it.","William Shakespeare escreveu no fim do século XVI, mas muitas de suas expressões ainda são usadas todo dia. Quando alguém diz que algo «vanished into thin air» (sumiu no ar), que algo é «too much of a good thing» ou que não pregou o olho, está citando-o, muitas vezes sem saber."],
["He also invented or popularised hundreds of words, such as «lonely», «bedroom», «fashionable» and «eyeball». Some of them were new combinations, others were nouns he turned into verbs. His language was the [[slang|gíria]] and creativity of his time.","Ele também inventou ou popularizou centenas de palavras, como «lonely», «bedroom», «fashionable» e «eyeball». Algumas eram combinações novas, outras eram substantivos que ele transformou em verbos. Sua língua era a gíria e a criatividade da época."],
["Reading Shakespeare in the original is hard even for native speakers. A good way to start is to watch a modern film version and then read a short scene with notes. You will be surprised by how many lines you already know.","Ler Shakespeare no original é difícil até para nativos. Uma boa forma de começar é assistir a uma versão moderna em filme e depois ler uma cena curta com notas. Você vai se surpreender com quantas falas já conhece."]
],
curio:["«Break the ice» appears in The Taming of the Shrew.","«Wild-goose chase» (a busca inútil) comes from Romeo and Juliet.","The teen film «10 Things I Hate About You» is a modern version of The Taming of the Shrew."],

q:[["When did Shakespeare write?",["In the 1960s","At the end of the 16th century","In the Middle Ages","In the 19th century"],1],["Which word did Shakespeare popularise?",["computer","lonely","weekend","email"],1],["What does the text suggest to start reading him?",["Read everything in the original","Watch a modern film version first","Learn Old English","Avoid him"],1]]},
{t:'Tea, pubs and the British table', pt:'Comida, bebida e hábitos', tag:'Everyday life',
p:[
["For the British, tea is more than a drink: it's the answer to almost every situation. Bad news? «I'll put the kettle on.» It is usually drunk with milk, and asking «How do you take your tea?» is a normal question. In the north of England, «tea» can also mean the evening meal.","Para os britânicos, o chá é mais que uma bebida: é a resposta para quase toda situação. Má notícia? «I'll put the kettle on» (vou pôr a chaleira no fogo). Normalmente é bebido com leite, e «How do you take your tea?» é uma pergunta comum. No norte da Inglaterra, «tea» também pode ser o jantar."],
["The pub, short for «public house», is the centre of social life in many towns. There is often no table service: you order and pay at the bar, and in a group people take turns buying a «round» of drinks for everyone. Missing your round is a small social [[crime|crime]].","O pub, abreviação de «public house», é o centro da vida social em muitas cidades. Muitas vezes não há serviço de mesa: você pede e paga no balcão, e em grupo as pessoas se revezam para pagar uma «rodada» para todos. Furar a sua rodada é um pequeno crime social."],
["British food has a bad reputation, but [[traditional|tradicionais]] dishes like fish and chips, a Sunday roast or a full English breakfast are part of the culture you see in every series. And «pudding» often means any dessert, not just a pudding.","A comida britânica tem má fama, mas pratos tradicionais como fish and chips, o assado de domingo ou o café da manhã inglês completo fazem parte da cultura que você vê em toda série. E «pudding» costuma significar qualquer sobremesa, não só pudim."]
],
curio:["«Cheers» means «thank you» and «bye» as well as a toast.","A «cuppa» is a cup of tea.","In a British pub, calling the bartender with your fingers or by shouting is considered rude: just wait at the bar."],

q:[["What does «I'll put the kettle on» suggest?",["I'll make tea","I'll go out","I'll cook dinner","I'll turn on the TV"],0],["In a British pub you usually…",["wait for a waiter","order and pay at the bar","pay at the end","book a table"],1],["What is a «round»?",["A type of beer","Drinks one person buys for the group","A table","A song"],1]]},
{t:'Sports words in American English', pt:'Metáforas do beisebol e do futebol americano', tag:'Language',
p:[
["Americans use sports [[metaphors|metáforas]] everywhere, especially at work. Many come from baseball, a sport most Brazilians have never played. If something is «a ballpark figure», it's a rough estimate. If a question «comes out of left field», it's completely unexpected.","Os americanos usam metáforas esportivas em toda parte, sobretudo no trabalho. Muitas vêm do beisebol, um esporte que a maioria dos brasileiros nunca jogou. Se algo é «a ballpark figure», é uma estimativa aproximada. Se uma pergunta «comes out of left field», é totalmente inesperada."],
["«Touch base» means to contact someone briefly; «a home run» is a great success; and if you «strike out», you fail. From American football come «to drop the ball» (to make a mistake by not doing something) and «to tackle a problem».","«Touch base» significa contatar alguém rapidamente; «a home run» é um grande sucesso; e se você «strike out», você fracassa. Do futebol americano vêm «to drop the ball» (errar por não fazer algo) e «to tackle a problem»."],
["You don't need to understand the rules of the game to use these expressions, but knowing where they come from makes them easier to remember, and much easier to [[recognise|reconhecer]] in a meeting or a film.","Você não precisa entender as regras do jogo para usar essas expressões, mas saber de onde vêm as torna mais fáceis de lembrar e muito mais fáceis de reconhecer numa reunião ou num filme."]
],
curio:["«Monday-morning quarterback» is someone who criticises a decision after it has gone wrong.","«To call the shots» means to be the one who makes decisions.","In Britain, many work metaphors come from cricket instead: «to be on a sticky wicket» means to be in a difficult situation."],
w:[["a ballpark figure","uma estimativa aproximada"],["to touch base","fazer um contato rápido"],["a home run","um grande sucesso"],["to drop the ball","pisar na bola"],["out of left field","do nada, inesperado"],["to call the shots","dar as cartas"]],
q:[["«Give me a ballpark figure» means…",["an exact number","a rough estimate","a sports score","a price list"],1],["«I dropped the ball» means…",["I succeeded","I made a mistake by not doing something","I played football","I was tired"],1],["«Let's touch base next week» means…",["Let's have a short catch-up","Let's play baseball","Let's end the project","Let's meet at the stadium"],0]]}
];

{t:'Learning to Speak Again', lvl:'B1', text:`For years I could read English quite well, but I never spoke it. In meetings I understood almost everything, and still I said nothing. I was afraid of making mistakes in front of people who spoke perfectly.

Then a colleague from Ireland told me something that changed my mind. "Nobody is listening to your grammar," she said. "They're listening to your ideas."

So I started small. I ordered coffee in English, I asked questions in meetings, and I recorded myself reading aloud. At first I hated my voice. Now I just notice the mistakes, correct them, and carry on. It isn't perfect, but it's mine.`,

{t:'The Café on the Corner', lvl:'B1', text:`There's a café on the corner of my street that has been there for forty years. The owner, Mr Patel, knows everyone by name. He remembers how you like your coffee, which football team you support and whether your mother is feeling better.

When the big coffee chain opened across the road, everyone thought he would close within a year. Instead, the opposite happened. People kept coming back, not for the coffee, which is honestly just average, but for the conversation.

Last month he turned seventy. The whole street organised a surprise party, and for once, Mr Patel didn't know what to say.`,
pron:['COR-ner (com R americano)','AV-er-age: «ÉV-ridj»','HON-est-ly (o h é mudo)','sur-PRISE','OR-ga-nised'],
ask:['Is there a place in your neighbourhood like this café?','Do you prefer small local shops or big chains? Why?','Describe someone in your area that everyone knows.']},
{t:'Why We Love Stories', lvl:'B2', text:`Every culture we know of tells stories. Long before writing existed, people gathered around fires to hear about heroes, monsters and journeys. Some scientists believe that stories helped our ancestors survive: by listening to someone else's experience, you could learn about danger without facing it yourself.

Today, our stories come through screens rather than fires, but the effect on the brain seems surprisingly similar. When we follow a [[gripping|eletrizante]] plot, our heart rate changes, our attention narrows and, for a while, we forget where we are.

Perhaps that is why a good series can feel like a friendship. We spend hours with its characters, we worry about them, and when it ends, we miss them.`,
pron:['AN-ces-tors','sur-VIVE','sur-PRI-sing-ly','CHAR-ac-ters: «KÉ-rec-ters»','THROUGH: «thru»'],
ask:['Which series or film character do you miss?','Why do you think humans need stories?','Tell me a story your grandparents used to tell.']},
{t:'Working From Anywhere', lvl:'B2', text:`When the company announced that we could work from anywhere, half the office booked flights within a week. Some went home to their families; others went to beaches they had only seen in photos.

The first months felt like a holiday that never ended. But slowly, the problems appeared. Time zones made meetings impossible, the Wi-Fi in paradise was terrible, and some of us realised we actually missed the office: the small talk, the shared lunches, even the bad coffee.

Now most of my team works in a hybrid way. We come in twice a week, mainly to see each other. It turns out that freedom is wonderful, but people still need people.`,
pron:['an-NOUNCED: «a-NAUNST»','PA-ra-dise','HY-brid: «HAI-brid»','RE-a-lised: «RI-a-laizd»','WON-der-ful: «UÂN-der-ful»'],
ask:['Would you like to work from anywhere? Where?','What are the advantages and disadvantages of remote work?','What do you miss about working in an office, or what would you miss?']},
{t:'The Last Bookshop', lvl:'C1', text:`The bookshop had survived two wars, a flood and the arrival of the internet, but it was not expected to survive the new rent. When the owner announced its closure, nobody imagined what would happen next.

Within days, readers began to arrive with offers of help. A retired accountant reorganised the finances; a group of students redesigned the website; a famous novelist, who had written her first chapters at a table in the back, gave a reading that sold out in an hour.

By the end of the year, the shop had not only paid its debts but opened a small café. Its owner still finds it difficult to explain. "Perhaps," she says, "people simply weren't ready to lose a place where nobody hurries you."`,

ask:['Why do you think the readers helped the bookshop?','Is there a place in your life where «nobody hurries you»?','Should cities protect independent shops? How?']},
{t:'On Fear of Failure', lvl:'C1', text:`We tend to imagine that confident people simply feel less fear. More often, they have learned to act before the fear goes away. The difference is not in the feeling but in what they do with it.

Psychologists sometimes describe this as building tolerance rather than eliminating discomfort. Each time we speak in a meeting despite our nerves, or send the email we have rewritten five times, the brain registers that nothing terrible happened. Gradually, the alarm becomes quieter.

It follows that waiting until we feel ready is, paradoxically, the surest way never to feel ready at all. Readiness is not a condition we achieve before acting; it is, more often than not, the result of having acted.`,
pron:['CON-fi-dent','TOL-er-ance','dis-COM-fort: «dis-CÂM-fort»','PA-ra-dox-i-cal-ly','READ-i-ness: «RÉ-di-nis»'],
ask:['Do you agree that confidence comes after action? Give an example.','What is something you did before you felt ready?','How could you build tolerance to speaking English in public?']}
];

{id:'p5-b2', type:'mc', lvl:'B2', minutes:18, title:'The Accidental Polyglot',
text:`<p>When Marta Ruiz arrived in Edinburgh at the age of twenty-six, she had studied English for twelve years and could not order a sandwich without rehearsing the sentence in her head. "I knew every rule," she says, "and I could do the exercises in my sleep. What I couldn't do was understand a single word the woman at the bakery said to me."</p>
<p>Today Marta works as a subtitler for a streaming company and speaks four languages, none of which, she insists, she learned "properly". Her method, if it can be called that, began almost by accident. Lonely and too embarrassed to speak, she started spending her evenings watching detective series with English subtitles. "At first it was just company," she admits. "I wasn't studying. But after a few months I noticed that I could follow the jokes, and the jokes are always the last thing you understand."</p>
<p>What surprised her most was that it wasn't the vocabulary that changed first, but her ear. Words she already knew on paper suddenly became recognisable in speech. "In class, English was a list of separate words. In the series, it was a river. I had to learn where one word ended and the next one began."</p>
<p>Marta is careful not to present her story as a recipe. Watching series, she believes, works only if you already have a foundation, and only if you are genuinely interested in what you are watching. "People ask me which series is best for learning. That's the wrong question. The best series is the one you would watch anyway, even in your own language."</p>
<p>She is equally cautious about the idea that you can learn without effort. Her evenings in front of the screen were relaxing, she says, but the moment that changed everything was far from comfortable. A colleague invited her to a pub quiz, and she spent three hours terrified that someone would ask her a question. Someone did. She answered, the team won, and nobody commented on her accent. "That night I understood that nobody was waiting for me to fail. I was the only one keeping score."</p>
<p>These days, when she trains new subtitlers, she gives them a piece of advice that has nothing to do with grammar. "Listen to how people actually talk, not how you think they should. Real people interrupt each other, leave sentences unfinished and use the same three words for everything. If your subtitles are too perfect, they're wrong."</p>`,

{id:'p5-c1', type:'mc', lvl:'C1', minutes:18, title:'Do We Still Need to Learn Languages?',
text:`<p>Every few years a new device promises to make language learning obsolete. The latest generation of translation earbuds can render a conversation in Japanese into passable English with barely a second's delay, and it is tempting to conclude, as several technology commentators already have, that the long, frustrating business of memorising verb tables is about to join handwriting and mental arithmetic in the museum of skills we no longer need.</p>
<p>The argument has a certain appeal, not least to anyone who has struggled through a grammar course. Yet it rests on a rather narrow view of what language is for. If the purpose of speaking another language were merely to exchange information, a sufficiently accurate machine would indeed make human effort redundant. But very little of what we value in conversation is information in that sense. We joke, we hesitate, we choose one word rather than another because of who we are talking to. A translation, however fluent, flattens these choices into something serviceable but anonymous.</p>
<p>There is also the question of what learning a language does to the learner. Researchers have long noted that bilingual speakers report feeling, and sometimes behaving, slightly differently in each of their languages. Whether this amounts to having two personalities is debatable, and the evidence is less dramatic than popular articles suggest. What is harder to dispute is that the effort of learning forces us to notice things we would otherwise take for granted: that our own language divides the world in particular ways, and that other divisions are possible.</p>
<p>None of this is to deny that the machines are useful. For a tourist ordering dinner or a doctor treating a patient with whom she shares no language, they may be transformative. The danger lies elsewhere: in the assumption that because something can be done for us, it is no longer worth doing ourselves. We did not stop running when cars were invented; we simply stopped needing to run in order to arrive.</p>
<p>Perhaps that is the most useful way to think about the future of language learning. It is likely to become less a matter of necessity and more a matter of choice, pursued not because we cannot manage without it, but because of what it gives us that a device cannot: the experience of being understood, imperfectly, in someone else's words.</p>`,

parts:[
`<p>Two years ago, at forty-one, I was a secondary school history teacher with no technical background whatsoever. Today I work as a junior web developer. People often assume I must have had some secret talent for computers. The truth is much less exciting.</p>`,
`<p>So I started with a free online course in the evenings, after marking homework. Progress was painfully slow. Some nights I spent two hours trying to understand why a single line of code refused to work, only to discover I had forgotten a comma.</p>`,
`<p>She was right. Within a month I was spending my lunch breaks reading forums and my weekends building tiny websites for friends: a page for my cousin's bakery, a quiz for my students, a map of my village's old buildings.</p>`,
`<p>That realisation changed the way I studied. Instead of trying to finish courses, I chose small projects and learned whatever I needed to complete them.</p>`,
`<p>Not everyone was supportive. Some colleagues thought I was having a midlife crisis, and my mother asked several times whether teaching was really so bad.</p>`,
`<p>Eventually I applied for a junior position at a small company that builds software for museums. In the interview, they asked fewer questions about code than about the history projects I had made.</p>`,
`<p>If I have one piece of advice for anyone thinking of a similar change, it is this: don't wait until you feel ready. I never did.</p>`

{id:'p6-c1', type:'gapped', lvl:'C1', minutes:14, title:'The Quiet Return of the Letter',
parts:[
`<p>Not long ago, a stationery shop in central London reported that sales of writing paper had risen for the third year in a row. In an age of instant messaging, this seems almost perverse. Who, after all, still writes letters?</p>`,
`<p>For some, the appeal is precisely the slowness that once made letters seem obsolete. A message that takes four days to arrive cannot be answered in four seconds, and that delay changes what people are willing to say.</p>`,
`<p>This is not merely nostalgia, although nostalgia certainly plays a part. Psychologists who study communication point out that the medium shapes the message in ways we rarely notice.</p>`,
`<p>Handwriting, by contrast, resists such shortcuts. Crossing out a word leaves a visible trace, and many letter writers say they find these traces oddly moving when they reread old correspondence.</p>`,
`<p>Of course, the revival should not be exaggerated. The number of personal letters sent each year remains a fraction of what it was even twenty years ago, and much of the growth comes from a relatively small group of enthusiasts.</p>`,
`<p>Even so, their numbers appear to be growing, and they are noticeably younger than one might expect.</p>`,
`<p>Perhaps, then, the letter is not returning so much as changing its role. No longer the ordinary way of keeping in touch, it has become something closer to a gift: an object that says, before a single word is read, that someone set aside time for you.</p>`
],

{id:'p7-b2', type:'match', lvl:'B2', minutes:15, title:'How I Learned English From Screens',
sections:[
["A","Daniela, 34, nurse",`<p>I grew up in a small town where nobody spoke English, so cartoons were my first teachers. I didn't understand much, but I loved the sound of it. As an adult I took classes for years and still felt blocked, until I started watching medical dramas. Because I knew the hospital world, I could guess almost everything from context. Now I sometimes catch myself correcting the medical vocabulary in the subtitles, which my husband finds very annoying.</p>`],
["B","Kenji, 27, game designer",`<p>Honestly, it was video games more than films. Games make you read instructions and dialogue because you need them to win. I learned a lot of strange words that way, like «potion» and «ammunition», long before I knew how to ask for directions. Films came later, and at first they were frustrating: actors speak much faster than game characters. I still turn on English subtitles for anything British.</p>`],
["C","Laura, 41, lawyer",`<p>I was sceptical. I thought watching series was a nice excuse for being lazy. Then I spent a year in Canada for work and realised that my perfect textbook English made me sound like a robot. A colleague suggested I watch one comedy series and nothing else for three months. I did, and I picked up so many expressions that people started asking if I'd lived abroad before. The funny thing is, I still don't really like the series.</p>`],
["D","Tom, 22, student",`<p>My parents are Brazilian, but I was born in Ireland, so English is the language I think in. What I learned from screens was actually Portuguese! I watched Brazilian soap operas with my grandmother every evening. She would explain the jokes I didn't get, and I would explain the internet to her. It's the reason I can now talk to my cousins without switching to English every two minutes.</p>`]
],

{id:'p7-c1', type:'match', lvl:'C1', minutes:15, title:'Four Translators on Their Craft',
sections:[
["A","The literary translator",`<p>People imagine that the hardest things to translate are technical terms. In fiction, it's the opposite: technical terms usually have an equivalent, whereas the rhythm of a sentence almost never does. I once spent an entire afternoon on a three-word line of dialogue because the original sounded casual and slightly cruel at the same time, and every version I tried was either one or the other. I don't think readers notice when you get it right, which is exactly how it should be.</p>`],
["B","The subtitler",`<p>My work is shaped by constraints that book translators never face. I have about forty characters per line and a couple of seconds before the image changes, so I'm constantly deciding what to leave out. Viewers sometimes complain that subtitles «don't say what the actor said», and they're right; they can't. What I aim for is that the audience laughs at the same moment as the original audience would have laughed. If that happens, I've done my job.</p>`],
["C","The interpreter",`<p>Unlike translators, I have no time to look anything up, and there's no second draft. That sounds terrifying, and the first year genuinely was. What people don't realise is how much preparation goes on beforehand: for a medical conference I might read for a week. During the session itself, the real skill is not knowing every word but staying calm when you don't, finding a way round the gap so smoothly that nobody notices it.</p>`],
["D","The localiser",`<p>I adapt video games and apps for the Brazilian market, and I'd argue that «translation» is too modest a word for what we do. A joke about American baseball means nothing to a teenager in Recife, so I replace it with something that works locally, even if the words have nothing in common with the original. Some purists find this shocking. My answer is that fidelity to the experience matters more than fidelity to the text.</p>`]
],
q:[

{id:'tf-1', type:'tfng', lvl:'B2', minutes:15, title:'The Rise of the Paperback',
text:`<p>For most of the history of printing, books were expensive objects. Bound in leather or cloth, they were bought by libraries and wealthy collectors, and ordinary readers depended on lending libraries, which charged a fee to borrow each volume.</p>
<p>This began to change in the nineteenth century, when cheaper paper and faster printing presses made it possible to produce books with soft covers at a fraction of the cost. Railway stations became important places to sell them, since travellers wanted something light to read on long journeys.</p>
<p>The real revolution, however, came in 1935, when a British publisher launched a series of good-quality paperbacks priced at sixpence, the same as a packet of cigarettes. Many booksellers were sceptical, believing that cheap books would damage the market for expensive ones. The first ten titles, which included novels and a biography, sold far better than expected, and within a year the company had sold around three million copies.</p>
<p>The success was copied across the world. In the United States, paperbacks were distributed to soldiers during the Second World War, introducing millions of young men to reading for pleasure. After the war, many of them continued to buy books, and publishers adapted by printing more popular fiction.</p>
<p>Today, despite the growth of e-books, paperbacks remain the most widely sold format in many countries. Some critics argue that this is partly because readers enjoy the physical object; others point simply to price.</p>`,
q:[
["Before the nineteenth century, most ordinary readers could not afford to buy books.","T","O texto diz que os livros eram caros e que leitores comuns dependiam de bibliotecas pagas."],
["Lending libraries offered books free of charge.","F","«which charged a fee to borrow each volume» : o contrário."],
["Railway stations were useful places to sell soft-cover books.","T","«Railway stations became important places to sell them.»"],
["The 1935 paperbacks cost the same as a packet of cigarettes.","T","«priced at sixpence, the same as a packet of cigarettes»."],
["All booksellers welcomed the cheap series.","F","«Many booksellers were sceptical» : então nem todos receberam bem."],
["The first ten titles were all novels.","F","Incluíam também uma biografia."],
["The British publisher later opened offices in the United States.","NG","O texto fala de paperbacks nos EUA, mas não diz nada sobre escritórios da editora."],
["Paperbacks given to soldiers encouraged a habit of reading.","T","«introducing millions of young men to reading for pleasure… many continued to buy books»."],
["E-books now sell more than paperbacks in most countries.","F","«paperbacks remain the most widely sold format in many countries»."],
["Most critics agree that price is the only reason for the paperback's success.","NG","Há críticos com duas opiniões; o texto não diz qual é a maioria nem que preço seja a única razão."]
]},

{id:'tf-2', type:'tfng', lvl:'C1', minutes:15, title:'Sleep and the Learning Brain',
text:`<p>It has long been known that people who are deprived of sleep perform poorly on tests of attention. More surprising is the growing body of evidence that sleep does not merely restore our ability to learn, but actively contributes to the learning process itself.</p>
<p>In a frequently cited experiment, volunteers were taught a list of word pairs in the evening and tested the following morning. Those who had slept normally remembered significantly more than a group who had been kept awake, even when the second group was allowed to recover with a full night's sleep before the test. The researchers concluded that the first night after learning plays a particular role in stabilising new memories.</p>
<p>Brain recordings suggest a possible mechanism. During certain stages of deep sleep, patterns of activity observed while participants were learning appear to be replayed, as though the brain were rehearsing the day's material. Some scientists believe this replay helps transfer information from short-term storage to more permanent networks, although the details remain disputed.</p>
<p>Interestingly, the benefits seem to extend beyond simple memorisation. In one study, participants who slept after struggling with a puzzle were more than twice as likely to discover a hidden shortcut the next day as those who had stayed awake for the same length of time. Sleep, it seems, may help the brain to reorganise information as well as to store it.</p>
<p>For language learners, the practical implications are modest but clear: reviewing new vocabulary shortly before sleep may be more effective than cramming in the early afternoon, and sacrificing sleep to study longer is likely to be counterproductive.</p>`,
q:[
["The effect of sleep deprivation on attention is a recent discovery.","F","«It has long been known» : não é recente."],
["In the word-pair experiment, the volunteers learned the words in the evening.","T","«taught a list of word pairs in the evening»."],
["The group kept awake remembered as much as the others after one night of recovery sleep.","F","Mesmo com a noite de recuperação, lembraram menos."],
["The experiment was carried out with university students.","NG","O texto diz «volunteers», sem especificar quem eram."],
["Scientists fully agree on how memories are transferred during sleep.","F","«the details remain disputed»."],
["Brain activity during learning appears to be repeated during deep sleep.","T","«patterns of activity… appear to be replayed»."],
["In the puzzle study, sleepers were over twice as likely to find a shortcut.","T","«more than twice as likely to discover a hidden shortcut»."],
["Sleep after learning helps people solve puzzles faster in every case.","NG","O texto dá um estudo e uma probabilidade; não fala de velocidade nem de «todos os casos»."],
["The writer suggests reviewing vocabulary before going to bed.","T","«reviewing new vocabulary shortly before sleep may be more effective»."],
["The writer recommends studying late into the night before an exam.","F","«sacrificing sleep to study longer is likely to be counterproductive»."]
]}
];
