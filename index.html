<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#163C2F"><meta name="apple-mobile-web-app-title" content="English"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>English Notebook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Caveat:wght@500;700&family=Libre+Franklin:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: English exercise book — ruled paper, index on the left, page on the right; dark library-green index, brass details, corrections in orange pen; upright book serif (the Italian notebook is blue, red and italic). Caslon-era book serif for titles, Literata (an e-reader face) for reading. */
:root{
  --paper:#EEF2EC; --grid:#D6E0D3; --card:#FFFFFF; --ink:#16251E; --muted:#55655C; --line:#C9D6CB;
  --blu:#1E5A43; --blu-soft:#DCECE2; --rosso:#C2410C; --rosso-soft:#FCEADB; --verde:#1C7A4A; --verde-soft:#DDF0E3;
  --side:#163C2F; --side-hi:#25574A; --side-ink:#E7F0EA; --side-muted:#A3BDB0; --brass:#D9A441;
  --ambra:#8F6400; --ambra-soft:#FAF0D6; --shadow:0 1px 2px rgba(23,33,58,.06),0 6px 24px -12px rgba(23,33,58,.18);
  --f-display:'EB Garamond','Garamond','Iowan Old Style',Georgia,serif;
  --f-read:'Literata','Iowan Old Style',Georgia,serif;
  --f-ui:'Libre Franklin',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-pen:'Caveat','Bradley Hand','Segoe Print',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1411; --grid:#16211C; --card:#131F1A; --ink:#E4ECE7; --muted:#93A79C; --line:#25352D;
  --blu:#7FD1AE; --blu-soft:#173328; --rosso:#FF9B5E; --rosso-soft:#3A2414; --verde:#5ACB92; --verde-soft:#14301F;
  --side:#0A1712; --side-hi:#1D3D31; --side-ink:#E4ECE7; --side-muted:#8FA99C; --brass:#E2B45C;
  --ambra:#E7B95A; --ambra-soft:#33290F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1411; --grid:#16211C; --card:#131F1A; --ink:#E4ECE7; --muted:#93A79C; --line:#25352D;
  --blu:#7FD1AE; --blu-soft:#173328; --rosso:#FF9B5E; --rosso-soft:#3A2414; --verde:#5ACB92; --verde-soft:#14301F;
  --side:#0A1712; --side-hi:#1D3D31; --side-ink:#E4ECE7; --side-muted:#8FA99C; --brass:#E2B45C;
  --ambra:#E7B95A; --ambra-soft:#33290F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15.5px;line-height:1.55;
  background-image:linear-gradient(transparent 27px,var(--grid) 27px);
  background-size:100% 28px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blu);outline-offset:2px;border-radius:4px}
a{color:var(--blu)}
i,em{font-style:italic}

.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);
  padding-block:22px 28px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:18px}
.brand{display:block;text-decoration:none;color:var(--ink)}
.brand b{display:block;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:30px;line-height:1;letter-spacing:-.01em}
.brand span{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.navgroup h4{margin:0 0 6px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.navgroup ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.navlink{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:center;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink)}
.navlink:hover{background:var(--blu-soft)}
.navlink[aria-current="page"]{background:var(--blu-soft);color:var(--blu)}
.navlink .n{font-family:var(--f-display);font-size:19px;font-weight:600;text-align:center;font-variant-numeric:lining-nums}
.navlink .t{font-size:13.5px;line-height:1.3;min-width:0}
.navlink .bar{display:block;height:3px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
.navlink .bar i{display:block;height:100%;background:var(--verde);width:0}
.navlink.tool .n{font-family:var(--f-pen);font-size:22px;color:var(--rosso)}

.topbar{display:none}
.scrim{display:none}
main{min-width:0;padding-block:34px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:860px;margin:0 auto;position:relative}

/* tipografia */
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--rosso)}
h1.title{font-family:var(--f-display);font-weight:600;font-style:italic;font-size:clamp(34px,5.4vw,54px);line-height:1.02;letter-spacing:-.015em;margin:8px 0 10px;text-wrap:balance}
.subtitle{font-size:17px;color:var(--muted);margin:0;max-width:60ch}
h2.sec{font-family:var(--f-display);font-weight:600;font-size:28px;margin:0 0 12px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:22px;margin:28px 0 8px;text-wrap:balance}
p{margin:0 0 12px}
.lead{font-family:var(--f-read);font-size:19px;line-height:1.55;max-width:62ch}
.pen{font-family:var(--f-pen);font-weight:700;color:var(--rosso);font-size:1.35em;line-height:1}

/* cabeçalho de unidade */
.uhead{padding-bottom:18px;margin-bottom:6px}
.uprog{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.uprog .track{flex:0 1 220px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.uprog .track i{display:block;height:100%;background:var(--verde)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 26px;overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5}
.tabs button{border:0;background:none;padding:12px 14px 11px;font-size:14.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--blu);border-bottom-color:var(--blu)}
.tabs .tick{font-family:var(--f-pen);color:var(--verde);font-size:20px;line-height:0}

/* lição */
.lesson{font-size:16px}
.lesson p,.lesson li{max-width:68ch}
.tw{overflow-x:auto;margin:10px 0 16px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.tbl{border-collapse:collapse;width:100%;font-size:14.5px}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl tr:last-child th,.tbl tr:last-child td{border-bottom:0}
.tbl th{font-weight:600;color:var(--muted);font-size:12.5px;letter-spacing:.02em;white-space:nowrap}
.tbl td{font-family:var(--f-read)}
.tbl.c td{text-align:center}
ul.dots{padding-left:20px;margin:0 0 12px}
ul.dots li{margin:4px 0}
.chips{font-family:var(--f-read);font-style:italic;background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin:8px 0 14px;line-height:1.8}
.trap,.plus{border-radius:10px;padding:14px 16px 12px;margin:16px 0;max-width:72ch}
.trap{background:var(--rosso-soft)}
.plus{background:var(--verde-soft)}
.plus .pen{color:var(--verde)}
.trap .pen,.plus .pen{display:block;margin-bottom:4px;transform:rotate(-1.5deg);transform-origin:left}
.done-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px dashed var(--line)}

/* botões */
.btn{border:1px solid var(--line);background:var(--card);padding:9px 15px;border-radius:999px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--blu);color:var(--blu)}
.btn.primary{background:var(--blu);border-color:var(--blu);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1513}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1513}}
.btn.red{color:var(--rosso);border-color:var(--rosso)}
.btn.red:hover{background:var(--rosso-soft);color:var(--rosso)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{border-color:transparent;background:none;padding-inline:8px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* cartão de exercício */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;margin:0 0 22px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.card-h h3{margin:0;font-size:21px}
.card-h .lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.score{font-family:var(--f-pen);font-size:28px;color:var(--rosso);line-height:1;font-variant-numeric:tabular-nums}
.score.good{color:var(--verde)}
.items{list-style:none;margin:0 0 16px;padding:0;counter-reset:it}
.items>li{counter-increment:it;display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;padding:11px 0;border-bottom:1px dashed var(--line)}
.items>li:last-child{border-bottom:0}
.items>li::before{content:counter(it);font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:16px;padding-top:1px}
.sent{font-family:var(--f-read);font-size:17px;line-height:1.9}
.sent .hint{font-family:var(--f-ui);font-size:13px;color:var(--muted);margin-left:4px}
.blank{font:inherit;font-family:var(--f-read);font-size:17px;color:var(--blu);background:transparent;border:0;border-bottom:2px dashed var(--blu);padding:0 4px;margin:0 3px;min-width:4ch;max-width:100%;border-radius:0}
.blank:focus{outline:none;background:var(--blu-soft)}
.blank.ok{border-bottom:2px solid var(--verde);color:var(--verde)}
.blank.acc{border-bottom:2px solid var(--ambra);color:var(--ambra)}
.blank.no{border-bottom:2px solid var(--rosso);color:var(--rosso);text-decoration:line-through;text-decoration-thickness:1.5px}
.mark{font-family:var(--f-pen);font-size:22px;font-weight:700;margin-left:4px;white-space:nowrap}
.mark.ok{color:var(--verde)}
.mark.no{color:var(--rosso)}
.mark.acc{color:var(--ambra)}
.expl{font-size:13.5px;color:var(--muted);margin-top:2px}
.err{text-decoration:underline wavy var(--rosso);text-decoration-thickness:1.5px;text-underline-offset:4px}
.fixline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:14px;color:var(--muted)}
.fixline .blank{min-width:12ch}
.corrected{font-family:var(--f-read);font-size:15px;margin-top:4px;color:var(--verde)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.opt{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-family:var(--f-read);font-size:16px;text-align:left}
.opt:hover:not([disabled]){border-color:var(--blu)}
.opt.ok{border-color:var(--verde);background:var(--verde-soft);color:var(--verde)}
.opt.no{border-color:var(--rosso);background:var(--rosso-soft);color:var(--rosso);text-decoration:line-through}
.opt[disabled]{cursor:default}
.q{font-family:var(--f-read);font-size:17px}

/* leitura */
.reading{font-family:var(--f-read);font-size:18.5px;line-height:1.7;max-width:64ch}
.reading p{margin:0 0 14px}
.reading h2{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:32px;margin:0 0 14px;line-height:1.1}
.g{border-bottom:1.5px dotted var(--blu);cursor:help;position:relative}
.g:hover::after,.g:focus::after{content:attr(data-t);position:absolute;left:0;top:100%;margin-top:6px;z-index:20;background:var(--ink);color:var(--paper);font-family:var(--f-ui);font-size:13px;line-height:1.3;padding:6px 9px;border-radius:6px;white-space:nowrap;box-shadow:var(--shadow)}
.note{font-size:13.5px;color:var(--muted)}

/* escrita */
.task{font-family:var(--f-read);font-size:18px;max-width:64ch}
.write-grid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:18px;align-items:start}
textarea.paper{width:100%;min-height:320px;resize:vertical;font-family:var(--f-read);font-size:17px;line-height:30px;color:var(--ink);
  background-color:var(--card);background-image:linear-gradient(transparent 29px,var(--grid) 29px);background-size:100% 30px;background-attachment:local;
  border:1px solid var(--line);border-radius:12px;padding:8px 16px;box-shadow:var(--shadow)}
textarea.paper:focus{outline:2px solid var(--blu);outline-offset:1px}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13.5px}
.checklist li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:6px;align-items:start}
.checklist .bx{font-family:var(--f-pen);font-size:22px;line-height:.9;color:var(--muted);text-align:center}
.checklist li.on .bx{color:var(--verde)}
.checklist label{cursor:pointer}
.wc{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);margin:8px 0 0}
.wc b{color:var(--ink)}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.side h4{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ai-out{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-top:18px;box-shadow:var(--shadow)}
.ai-out h4{font-family:var(--f-display);font-size:20px;margin:16px 0 6px}
.ai-out h4:first-child{margin-top:0}
.ai-out ul,.ai-out ol{padding-left:20px;margin:0 0 10px}
.ai-out li{margin:4px 0}
.ai-out del{color:var(--rosso);text-decoration-thickness:1.5px}
.ai-out .stamp{font-family:var(--f-pen);color:var(--rosso);font-size:22px}
.model{font-family:var(--f-read);font-size:17px;line-height:1.7;white-space:pre-wrap;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px 18px;margin-top:14px}
.fallback textarea{width:100%;min-height:140px;font-family:var(--f-ui);font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:10px;margin-top:8px}

/* home */
.hero{padding:6px 0 26px;border-bottom:1px solid var(--line);margin-bottom:28px}
.hero h1{font-family:var(--f-display);font-weight:600;font-size:clamp(38px,6.4vw,66px);line-height:.98;letter-spacing:-.02em;margin:10px 0 16px;text-wrap:balance}
.hero h1 em{color:var(--rosso);font-weight:500}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin:22px 0 4px}
.stat b{display:block;font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.stat span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:0 0 30px}
.cols3 .card{margin:0}
.cols3 h3{margin-top:0;font-size:20px}
.plan{counter-reset:none}
.plan td:first-child{font-family:var(--f-display);font-weight:600;white-space:nowrap}
.levelmap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 30px}
.lv{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px}
.lv b{font-family:var(--f-display);font-size:22px}
.lv small{display:block;color:var(--muted);font-size:12.5px}
.lv .units{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lv .units a{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:14px}
.lv .units a.full{border-color:var(--verde);background:var(--verde-soft);color:var(--verde)}
.lv .units a.part{border-color:var(--ambra)}

/* falsi amici */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.flip{perspective:900px;height:150px;border:0;background:none;padding:0;text-align:left}
.flip .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:14px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.flip .f b{font-family:var(--f-display);font-style:italic;font-size:28px;font-weight:600}
.flip .f small{color:var(--muted);font-size:12px}
.flip .b{transform:rotateY(180deg);background:var(--blu-soft)}
.flip .b .m{font-weight:700;font-size:16px}
.flip .b .tr{font-size:12.5px;color:var(--rosso)}
.flip .b .ex{font-family:var(--f-read);font-style:italic;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card);margin-bottom:18px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blu);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0E1513}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0E1513}}

/* coniugatore */
.drill{text-align:center;padding:30px 22px}
.drill .verb{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:clamp(40px,7vw,60px);line-height:1}
.drill .meta{margin:10px 0 18px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.drill .meta b{color:var(--rosso)}
.drill .pers{font-family:var(--f-read);font-size:22px;margin-bottom:6px}
.drill input{font-family:var(--f-read);font-size:24px;text-align:center;width:min(100%,340px);border:0;border-bottom:2px dashed var(--blu);background:transparent;color:var(--blu);padding:6px}
.drill input:focus{outline:none;background:var(--blu-soft)}
.drill .fb{min-height:34px;margin-top:10px}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}
.chipsel button[aria-pressed="true"]{border-color:var(--blu);background:var(--blu-soft);color:var(--blu)}
.conj{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 16px;max-width:520px;margin:16px auto 0;text-align:left;font-family:var(--f-read);font-size:15px}
.conj span{color:var(--muted);font-family:var(--f-ui);font-size:12px;margin-right:6px}

/* monta a frase */
.ordbox{display:grid;gap:10px;width:100%}
.build{min-height:52px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--paper)}
.build.ok{border:1.5px solid var(--verde);background:var(--verde-soft)}
.build.no{border:1.5px solid var(--rosso);background:var(--rosso-soft)}
.build .ph{font-size:13px;color:var(--muted);padding-left:4px}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.tok{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-family:var(--f-read);font-size:17px;line-height:1.2;box-shadow:0 1px 0 var(--line)}
.tok:hover{border-color:var(--blu);color:var(--blu)}
.build .tok{background:var(--blu-soft);border-color:transparent;color:var(--blu)}
.ordbox.big .tok{font-size:19px;padding:8px 12px}
.ordbox .corrected{display:inline}

/* laboratório */
.labq{font-family:var(--f-display);font-size:clamp(24px,3.6vw,32px);font-weight:500;line-height:1.25;margin:4px 0 16px;text-wrap:balance}
.labin{width:100%;font-family:var(--f-read);font-size:19px;line-height:1.5;color:var(--blu);background:var(--paper);border:0;border-bottom:2px dashed var(--blu);border-radius:8px 8px 0 0;padding:10px 12px;resize:vertical}
.labin:focus{outline:none;background:var(--blu-soft)}
.labcard .fb{margin-top:10px}
.sols{margin-top:8px;font-family:var(--f-read);font-size:16px}
.sols ul{margin:4px 0 8px;padding-left:20px}

/* tabela de verbos */
.vsel{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);max-width:100%;flex:1 1 220px}
.vhead{margin:18px 0 16px}
.verbname{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:44px;line-height:1}
.vfacts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-family:var(--f-read);font-size:16px}
.vfacts b{font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.vt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);font-family:var(--f-read);font-size:15px;line-height:1.6}
.vt h4{margin:0 0 4px;font-family:var(--f-ui);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rosso)}
.vt span{display:inline-block;width:52px;color:var(--muted);font-family:var(--f-ui);font-size:12px}


/* ritmo, errori, verifiche, lessico */
.rhythm{display:grid;gap:6px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rhythm.met{border-color:var(--verde);background:var(--verde-soft)}
.rw-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.rw-streak{font-family:var(--f-pen);font-size:18px;line-height:1;color:var(--rosso)}
.rw-bar{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.rw-bar i{display:block;height:100%;background:var(--verde);transition:width .3s}
.topright{display:flex;gap:8px;align-items:center}
.rw-mini{font-size:13px;font-weight:600;text-decoration:none;color:var(--verde);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:999px;padding:6px 10px}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--rosso);color:#fff;font-size:11.5px;font-weight:700;vertical-align:1px;margin-left:4px}
.syncline{font-size:12px;color:var(--muted);margin:auto 0 0;padding-top:8px;border-top:1px dashed var(--line)}
.syncline.ok{color:var(--verde)}
.callout{background:var(--ambra-soft);border-radius:12px;padding:14px 16px;margin-top:26px}
.callout .pen{color:var(--ambra);margin-right:6px}
.rhythm-sec{margin:0 0 30px;display:grid;gap:14px}
.rhythm-sec .card{margin:0}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.rgrid .card{display:grid;gap:8px;align-content:start;margin:0}
.big{font-family:var(--f-display);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.big small{font-size:.45em;color:var(--muted);font-weight:500}
.card.today.met{background:var(--verde-soft);border-color:var(--verde)}
.card.due{border-color:var(--rosso)}
.hmwrap{overflow-x:auto}
.hmgrid,.hmmonths{display:grid;gap:3px;grid-auto-columns:14px}
.hmgrid{grid-template-rows:repeat(7,14px);grid-auto-flow:column}
.hmmonths{font-size:11px;color:var(--muted);margin-bottom:4px;height:14px}
.hmmonths span{white-space:nowrap}
.hm{display:block;width:14px;height:14px;border-radius:3px;background:var(--line)}
.hm.l1{background:color-mix(in srgb,var(--verde) 25%,var(--card))}
.hm.l2{background:color-mix(in srgb,var(--verde) 50%,var(--card))}
.hm.l3{background:color-mix(in srgb,var(--verde) 75%,var(--card))}
.hm.l4{background:var(--verde)}
.hmleg{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);margin-top:10px}
.hmleg span{margin:0 4px}
.testrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.testchip{display:grid;gap:2px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.testchip:hover{border-color:var(--blu)}
.testchip b{font-family:var(--f-display);font-size:19px}
.testchip span{font-size:12.5px;color:var(--muted)}
.testchip em{font-style:normal;font-size:13px;font-weight:600;color:var(--blu)}
.testchip.passed{border-color:var(--verde);background:var(--verde-soft)}
.testchip.passed em{color:var(--verde)}
.testchip.lex em{color:var(--rosso)}
.boxes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 22px}
.box{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px;background:var(--card)}
.box b{font-family:var(--f-display);font-size:26px}
.errlist{list-style:none;margin:0;padding:0}
.errlist li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.errlist li>div{min-width:0}
.el-t{font-family:var(--f-read);font-size:16px}
.due-t{color:var(--rosso)}
.rvsent{font-size:19px;margin-bottom:6px}
.opt.sel{border-color:var(--blu);background:var(--blu-soft);color:var(--blu)}
.timer{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:18px;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.timer b{font-size:20px}
.timer.low b{color:var(--rosso)}
.cloze{line-height:2.3}
.tblank{white-space:nowrap}
.tblank sup{font-family:var(--f-ui);font-size:11px;color:var(--rosso);font-weight:700;margin-right:1px}
.result.pass{border-color:var(--verde)}
.cert{margin:8px 0 22px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.cert-in{border:3px double var(--blu);padding:30px 22px;text-align:center;display:grid;gap:8px;justify-items:center;font-family:var(--f-read);font-size:17px}
.cert-t{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:clamp(40px,7vw,58px);line-height:1;color:var(--blu)}
.cert-name{font-family:var(--f-display);font-style:italic;font-size:30px;text-align:center;border:0;border-bottom:1.5px solid var(--ink);background:transparent;color:var(--ink);width:min(100%,420px);padding:4px}
.cert-name:focus{outline:none;border-bottom-color:var(--blu)}
.cert-foot{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:460px;margin-top:10px;font-size:14px;color:var(--muted)}
.seal{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;border:2px solid var(--rosso);color:var(--rosso);font-family:var(--f-display);font-weight:700;font-size:18px;transform:rotate(-12deg)}
.lexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.lexcard{text-decoration:none;color:var(--ink);display:grid;gap:8px;margin:0}
.lexcard h3{margin:0}
.lexcard:hover{border-color:var(--blu)}
.lextbl td{vertical-align:middle}
.lextbl td.pt{font-family:var(--f-ui);font-size:14px;color:var(--muted)}
.btn.kn{color:var(--verde)}
.lexflip{display:block;width:min(100%,460px);height:220px;margin:0 auto}
.lexflip .f b{font-size:34px}
.lexflip .b .m{font-size:20px}
.lexflip .b .ex{font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;transition:opacity .3s,transform .3s;z-index:60;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);font-size:15px;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .pen{color:var(--ambra);margin-right:4px}
@media (max-width: 700px){ .rgrid{grid-template-columns:minmax(0,1fr)} .boxes{grid-template-columns:repeat(2,minmax(0,1fr))} }


/* A1 e cultura */
.navlink .n.sm{font-size:14px;font-family:var(--f-ui);font-weight:700;letter-spacing:.02em}
.levelmap{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.lv .units a{width:auto;min-width:30px;padding:0 6px;border-radius:999px}
.btn.speak{font-size:13px;padding:6px 12px;margin:0 0 12px}
.btn.speak[aria-pressed="true"]{border-color:var(--rosso);color:var(--rosso)}
.reading.cult{display:grid;gap:4px}
.cpar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:start;padding:6px 0;border-bottom:1px dashed var(--line)}
.cpar>p{margin:0}
.cpar .ptbtn{font-size:12px;padding:4px 8px;color:var(--muted)}
.cpar .pt{grid-column:1 / -1;font-family:var(--f-ui);font-size:14.5px;line-height:1.55;color:var(--muted);background:var(--paper);border-left:3px solid var(--verde);padding:8px 12px;margin:6px 0 4px;border-radius:0 8px 8px 0}
.sapevi{background:var(--ambra-soft);border-color:transparent;box-shadow:none}
.sapevi .pen{color:var(--ambra);font-size:1.5em}
.cultrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.cultchip{display:grid;gap:3px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.cultchip:hover{border-color:var(--blu)}
.cultchip b{font-family:var(--f-display);font-size:17px;line-height:1.2}
.cultchip em{font-style:normal;font-size:12.5px;color:var(--verde);font-weight:600}
.cultchip.done{border-color:var(--verde)}


/* ascolto e parlato */
.rate{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.rate button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.rate button[aria-pressed="true"]{border-color:var(--blu);background:var(--blu-soft);color:var(--blu)}
.ractl{margin-bottom:6px}
.ratext{margin-top:10px}
.snt{cursor:pointer;border-radius:4px;transition:background .15s}
.snt:hover{background:var(--blu-soft)}
.snt.on{background:var(--ambra-soft);box-shadow:0 0 0 2px var(--ambra-soft)}
.snt.you{background:var(--verde-soft);box-shadow:0 0 0 2px var(--verde-soft)}
.ratimer{display:flex;align-items:center;gap:16px;margin:12px 0;padding:12px 14px;border:1px dashed var(--blu);border-radius:12px;background:var(--blu-soft)}
.wpm{font-size:15px;margin:10px 0 0;font-variant-numeric:tabular-nums}
.wpm b{font-family:var(--f-display);font-size:24px;color:var(--verde)}
.phr{list-style:none;margin:0;padding:0}
.phr li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.phr li:last-child{border-bottom:0}
.phr-it{font-family:var(--f-read);font-size:17px}
.btn.play{width:34px;height:34px;padding:0;justify-content:center;border:1px solid var(--line);border-radius:50%;font-size:12px}
.btn.said{font-size:12.5px}
.callout.small{font-size:14px;padding:10px 14px;margin:0 0 14px}
.voicenote{margin:-4px 0 14px;font-size:12.5px}
.dict .peek{font-family:var(--f-read);font-size:18px;padding:8px 12px;background:var(--ambra-soft);border-radius:8px;margin:8px 0}
.dict textarea{margin-top:10px}
.dline{font-family:var(--f-read);font-size:18px;line-height:1.8;margin:8px 0 4px}
.dw.ok{color:var(--verde)}
.dw.acc{color:var(--ambra);text-decoration:underline wavy var(--ambra)}
.dw.no{color:var(--rosso);text-decoration:underline wavy var(--rosso);font-weight:600}
.transcript{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-top:14px;font-size:17px}
.tl{margin:0 0 6px}
.tl-A{color:var(--ink)}
.tl-B{color:var(--blu)}
.tl-N{font-style:italic}
.tl-C{color:var(--rosso)}
.vpair{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px;margin:18px 0 6px}
.vpair label{display:grid;gap:4px;justify-items:center}
.vpair input{width:min(100%,220px)!important;font-size:22px!important}
.cols4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:0 0 30px}
.cols4 .card{margin:0}
.tipcard{background:var(--blu-soft);border-color:transparent;box-shadow:none}
.tipcard .pen{color:var(--blu);display:block;margin-bottom:4px}
button.lexcard{text-align:left;font:inherit;cursor:pointer;width:100%}
.chatbox{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:240px;max-height:56vh;overflow-y:auto}
.bub{max-width:86%;padding:10px 14px;border-radius:14px;font-family:var(--f-read);font-size:17px;line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.bub>div{min-width:0}
.bub.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--blu-soft);color:var(--ink);border-bottom-right-radius:4px;flex-direction:column}
.bub.sys{align-self:center;font-family:var(--f-ui);font-size:13px;color:var(--muted);background:none;padding:4px}
.bub .corr{font-size:15px;color:var(--rosso);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.bub .corr .pen{font-size:20px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0;min-height:4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-family:var(--f-read);font-size:15px;text-align:left}
.chip:hover{border-color:var(--blu);color:var(--blu)}
.chatin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end;margin-top:10px}
label.chk{display:inline-flex;gap:6px;align-items:center}
.oq{font-family:var(--f-read);font-weight:400;font-size:19px;line-height:1.45}
.verb.talk{color:var(--rosso)}
.selfev{display:grid;gap:6px;margin-top:10px;max-width:420px}
.evrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mvform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.mvform input,.mvform select{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);min-width:0}
.drill input#mvin,.drill input#nin{font-family:var(--f-read);font-size:24px;text-align:center;width:min(100%,340px);border:0;border-bottom:2px dashed var(--blu);background:transparent;color:var(--blu);padding:6px}
.vlinks{display:grid;gap:6px;font-size:14px}
@media (max-width: 520px){ .phr li{grid-template-columns:auto minmax(0,1fr)} .phr li .said{grid-column:2} .bub{max-width:94%} }

@media (max-width: 900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:40;transform:translateX(-105%);transition:transform .25s;box-shadow:var(--shadow);height:100%;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .nav.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,14,24,.4);z-index:35}
  .topbar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);
    padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .brand b{font-size:22px}
  .topbar .brand span{display:none}
  main{padding-top:22px}
  .tabs{top:calc(env(safe-area-inset-top,0px) + 53px)}
  .write-grid{grid-template-columns:minmax(0,1fr)}
  .cols3,.levelmap{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 520px){
  .card{padding:16px 14px}
  .conj{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* English identity: library-green index, brass, upright titles */
body::before{background:var(--side)}
.brand b,h1.title,.reading h2,.flip .f b,.drill .verb,.verbname{font-style:normal;letter-spacing:-.005em}
.brand b{font-size:29px}
.nav{background:var(--side);border-right:0;color:var(--side-ink)}
.nav .brand,.nav .navlink{color:var(--side-ink)}
.nav .brand span,.nav .navgroup h4,.nav .note,.nav small{color:var(--side-muted)}
.nav .navlink:hover{background:rgba(255,255,255,.07)}
.nav .navlink[aria-current="page"]{background:var(--side-hi);color:#fff}
.nav .navlink .bar{background:rgba(255,255,255,.14)}
.nav .navlink .bar i{background:var(--brass)}
.nav .navlink.tool .n{color:var(--brass)}
.nav .rhythm{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:var(--side-ink)}
.nav .rhythm.met{background:rgba(217,164,65,.14);border-color:var(--brass)}
.nav .rw-streak{color:var(--brass)}
.nav .rw-bar{background:rgba(255,255,255,.14)}
.nav .rw-bar i{background:var(--brass)}
.nav .syncline{border-top-color:rgba(255,255,255,.16);color:var(--side-muted)}
.nav .syncline.ok{color:#9FDDB8}
.nav :focus-visible{outline-color:var(--brass)}
.topbar{background:var(--side);border-bottom:0}
.topbar .brand{color:var(--side-ink)}
.topbar .btn,.topbar .rw-mini{background:transparent;color:var(--side-ink);border-color:rgba(255,255,255,.3)}
.hero h1 em{font-style:italic}
.lv .units a.full{border-color:var(--brass)}

/* reading exams */
.examcta{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-color:var(--brass);background:linear-gradient(135deg,var(--card),var(--blu-soft))}
.examcta>div{flex:1 1 320px;min-width:0}
.examcta h3{margin:4px 0 6px}
.examcta p{margin:0}
.genform{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:10px 0}
.genform label{display:grid;gap:4px;min-width:0}
.genform .vsel{width:100%}
.gxown{margin-top:6px}
.gxown summary{cursor:pointer;font-weight:600;color:var(--blu);padding:6px 0}
.gxown textarea{margin-top:6px}
.exgrid{display:grid;gap:20px;align-items:start}
.exgrid.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.exgrid.two .exq{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow-y:auto}
.extext{min-width:0}
.exread{font-size:17px;max-width:68ch}
.gapbox{display:flex;align-items:center;gap:10px;margin:6px 0 16px;padding:10px 12px;border:1.5px dashed var(--brass);border-radius:10px;background:var(--card)}

<script>
const UNITS = [], ORDER = {}, USPEAK = {};

/* ───────── W1 ───────── */
U({
id:101, n:'W1', lvl:'A2', band:0,
title:'Present simple or present continuous?',
sub:'What you always do and what is happening now · Rotina × agora',
focus:'present simple vs present continuous, do/does in questions and negatives, third person -s, stative verbs (like, know, want, need, belong), age with be',
lesson:`
<p class="lead">O português tem «eu trabalho» e «eu estou trabalhando», e o inglês também. A diferença é que o inglês é muito mais rígido: rotina e fatos pedem o <b>present simple</b>; algo em andamento ou temporário pede o <b>present continuous</b>.</p>
<h3>As duas formas</h3>
<div class="tw"><table class="tbl">
<tr><th></th><th>present simple</th><th>present continuous</th></tr>
<tr><th>uso</th><td>hábitos, fatos, horários</td><td>agora, este período, mudanças</td></tr>
<tr><th>+</th><td>I work · she work<b>s</b></td><td>I'<b>m</b> working · she'<b>s</b> working</td></tr>
<tr><th>−</th><td>I <b>don't</b> work · she <b>doesn't</b> work</td><td>I'm <b>not</b> working · she <b>isn't</b> working</td></tr>
<tr><th>?</th><td><b>Do</b> you work? · <b>Does</b> she work?</td><td><b>Are</b> you working? · <b>Is</b> she working?</td></tr>
<tr><th>palavras-sinal</th><td>always, usually, often, every day, on Mondays</td><td>now, right now, at the moment, this week, these days</td></tr>
</table></div>
<h3>A terceira pessoa tem -s</h3>
<p>É o erro que mais «denuncia» um falante latino: <i>she work</i>. Com he/she/it: <i>works, watches, goes, does, has, studies</i>. E na negativa e na pergunta o -s vai para o auxiliar: <i>she <b>doesn't</b> work</i> (nunca <s>doesn't works</s>), <i><b>Does</b> he like it?</i></p>
<h3>Verbos de estado não vão para o -ing</h3>
<p>Verbos que descrevem estados, não ações, ficam no simple mesmo «agora»: <i>like, love, hate, want, need, know, understand, believe, mean, belong, seem, own</i>.</p>
<div class="chips">I <b>know</b> (não <s>I'm knowing</s>) · I <b>don't understand</b> · What do you <b>mean</b>? · This bag <b>belongs</b> to me · I <b>need</b> help</div>
<p>Alguns mudam de sentido: <i>I <b>think</b> it's good</i> (opinião) / <i>I'm <b>thinking</b> about it</i> (processo); <i>I <b>have</b> a car</i> (posse) / <i>I'm <b>having</b> lunch</i> (ação).</p>
<div class="trap"><span class="pen">Cuidado!</span> Idade e estados físicos usam <b>be</b>, não «ter»: <i>I'<b>m</b> 30</i> (não <s>I have 30 years</s>), <i>I'm hungry / cold / afraid / right / 25 years old</i>. Em espanhol também é «tener»: a armadilha é dupla.</div>
<div class="trap"><span class="pen">Cuidado!</span> <i>I agree</i> é um verbo: nunca <s>I am agree</s>. E <i>It depends</i>, nunca <s>It's depend</s>.</div>
<div class="plus"><span class="pen">Nos filmes</span> O continuous com <b>always</b> serve para reclamar: <i>You're <b>always</b> leaving the door open!</i> (Você vive deixando a porta aberta!).</div>
`,
reading:{
title:'A Day in the Life of a Remote Developer',
text:`<p>Priya is a software developer from Bangalore, but she [[lives|mora]] in Lisbon. She works for a company in Toronto, so her day [[starts|começa]] late. She usually gets up at nine, has a coffee on her [[balcony|varanda]] and checks her messages. She doesn't like meetings in the morning, and luckily, her team is still asleep.</p>
<p>Most days, she works from a small [[coworking space|espaço de coworking]] near her flat. She likes the people there: a graphic designer from Brazil, two French students and a writer who never stops talking. At lunchtime they often eat together at a cheap restaurant round the corner.</p>
<p>This month, however, things are different. Priya is working from home because the coworking space is closed for repairs. She's also learning Portuguese, so she's spending her evenings with a [[textbook|livro didático]] and Brazilian series. "I understand a lot more than I speak," she says, "but I'm getting better every week."</p>
<p>Right now it's six in the evening. Her team in Toronto is having its daily meeting, and Priya is [[sharing her screen|compartilhando a tela]]. She's explaining a bug she found this morning. Nobody knows how to fix it yet, but she's [[confident|confiante]] they'll solve it before the weekend.</p>`,
q:[
["Why does Priya's day start late?",["She goes to bed late","Her company is in Toronto","She works from home","She doesn't like mornings"],1,"«She works for a company in Toronto, so her day starts late.»"],
["Where does she usually work?",["At home","In Toronto","In a coworking space","In a restaurant"],2,"«Most days, she works from a small coworking space near her flat.»"],
["Why is this month different?",["The coworking space is closed","She is on holiday","She has a new job","She is in Brazil"],0,"«…the coworking space is closed for repairs.»"],
["What is she doing in the evenings this month?",["Fixing bugs","Learning Portuguese","Going out with friends","Watching the news"],1,"Present continuous para algo temporário: «she's spending her evenings with a textbook»."],
["«I'm getting better every week» means…",["Her health is improving","Her Portuguese is improving","She is tired","She works more every week"],1,"Get better = melhorar."]
]},
ex:[
{t:'fill', title:'Simple or continuous?', items:[
["My sister ___ in a bank, but this month she's on holiday. (work)",["works"],"Fato permanente → present simple, 3ª pessoa com -s."],
["Shh! The baby ___. (sleep)",["is sleeping","'s sleeping"],"Agora → continuous."],
["___ you usually take the bus to work? (do)",["do"]],
["He ___ coffee. He prefers tea. (not like)",["doesn't like","does not like"],"Like é verbo de estado e 3ª pessoa: doesn't like."],
["Look! It ___ again. (rain)",["is raining","'s raining"]],
["I ___ what you mean. (not understand)",["don't understand","do not understand"],"Understand é de estado: não vai para o -ing."],
["We ___ a new series at the moment. It's brilliant. (watch)",["are watching","'re watching"]],
["How often ___ your brother call you? (do)",["does"]],
["The film ___ at 8:30, so let's meet at 8. (start)",["starts"],"Horários fixos usam present simple."],
["I ___ 34 and my husband ___ 36. (be, be)",[["am","'m"],["is","'s"]],"Idade com be: I'm 34."],
["This laptop ___ to my company, not to me. (belong)",["belongs"]],
["Why ___ you laughing? (be)",["are"]]
]},
{t:'mc', title:'Choose the right form', items:[
["Which sentence is correct?",["I have 28 years.","I am 28.","I'm having 28 years."],1,"Idade em inglês usa be."],
["She ___ in a hospital. She's a nurse.",["works","is working","work"],0,"Profissão é permanente."],
["Which sentence is correct?",["I am agree with you.","I agree with you.","I'm agreeing with you."],1,"Agree é verbo; não usa am."],
["___ she speak Spanish?",["Do","Does","Is"],1],
["I ___ a lot of books these days because I'm on the bus every morning.",["read","am reading","reads"],1,"These days = período temporário."],
["Which is a complaint?",["He always forgets my birthday.","He's always forgetting my birthday!","Both are complaints."],1,"Always + continuous soa como reclamação."]
]},
{t:'fix', title:'Correct the underlined part', items:[
["My father {work} in an office.",["works"],"My father works in an office."],
["She {don't} like horror films.",["doesn't","does not"],"She doesn't like horror films."],
["I {am knowing} the answer.",["know"],"I know the answer."],
["{Does} they live near you?",["do"],"Do they live near you?"],
["It {depend} on the weather.",["depends"],"It depends on the weather."]
]}
],
write:{
task:'Write an email to a new English-speaking friend. Describe your normal week (job, habits, free time) and what is different in your life at the moment.',
words:[100,140],
targets:[
{l:'5 verbs with -s (he/she/it)', re:'<(works|lives|goes|does|has|likes|loves|watches|studies|says|wants|needs|thinks|makes|takes|gets|starts|finishes|plays|reads|writes|knows|seems|means|helps|calls|comes|leaves|spends|uses)>', n:5},
{l:'3 present continuous (am/is/are + -ing)', re:"(<am|<is|<are|'m|'s|'re)\\s+(not\\s+)?W+ing>", n:3},
{l:'2 negatives with don\'t / doesn\'t', re:"<(don't|doesn't|do not|does not)>", n:2},
{l:'1 frequency adverb (usually, often, never…)', re:'<(always|usually|often|sometimes|rarely|never|hardly ever)>', n:1}
],
model:`Hi Emma,

Thanks for your message! Let me tell you about my week. I'm a programmer and I usually work from home. My husband works in an office, so he leaves early and I have the flat to myself. I often start with a big coffee and my emails. I don't like long meetings, but we have one every Monday.

In my free time I read a lot and I sometimes go for a walk by the river. My sister lives near me, so she comes for dinner on Fridays and always says I work too much.

At the moment, though, things are a bit different. I'm studying English again after ten years, and I'm watching series without Portuguese subtitles. It isn't easy, but I'm enjoying it. My sister doesn't believe it!

Write soon,
Larissa`
}
});
ORDER[101]=[
["She doesn't usually work on Fridays.",["She usually doesn't work on Fridays."]],
["What are you doing at the moment?",[]],
["My brother lives in a small flat near the beach.",[]],
["I don't understand what he means.",[]],
["We're watching a new series this week.",["This week we're watching a new series."]]
];
USPEAK[101]={p:['What do you do, and what does a normal day look like for you?','What are you doing differently these days?','What do you never do at weekends?','Describe someone in your family: what do they do every day?','What series are you watching at the moment?'],v:['present simple vs present continuous','daily routine in English listening']};

/* ───────── W2 ───────── */
U({
id:102, n:'W2', lvl:'A2', band:0,
title:'The past simple: telling what happened',
sub:'Regular -ed, irregular verbs and did · O passado de todo romance',
focus:'past simple of regular and irregular verbs, -ed pronunciation (/t/, /d/, /ɪd/), did/didn\'t in questions and negatives, was/were, ago',
lesson:`
<p class="lead">Quase todo romance e quase todo filme é narrado no <b>past simple</b>. A boa notícia: ele tem uma forma só para todas as pessoas (<i>I went, she went, they went</i>). A má: os verbos mais comuns são irregulares.</p>
<h3>Regulares: -ed (e três pronúncias)</h3>
<div class="tw"><table class="tbl">
<tr><th>som</th><th>quando</th><th>exemplos</th></tr>
<tr><td>/t/</td><td>depois de som surdo (p, k, s, sh, ch, f)</td><td>work<b>ed</b> «workt», stopp<b>ed</b>, watch<b>ed</b>, laugh<b>ed</b></td></tr>
<tr><td>/d/</td><td>depois de som sonoro e vogais</td><td>play<b>ed</b>, call<b>ed</b>, liv<b>ed</b>, open<b>ed</b></td></tr>
<tr><td>/ɪd/</td><td>só depois de t ou d</td><td>want<b>ed</b>, need<b>ed</b>, decid<b>ed</b>, start<b>ed</b></td></tr>
</table></div>
<p>Ou seja: <i>worked</i> tem <b>uma</b> sílaba. Dizer «work-ED» é o sotaque brasileiro clássico.</p>
<h3>Irregulares: os 20 que aparecem em toda página</h3>
<div class="chips">be → was/were · have → had · do → did · go → went · get → got · make → made · say → said · see → saw · come → came · take → took · know → knew · think → thought · tell → told · find → found · give → gave · leave → left · feel → felt · put → put · bring → brought · buy → bought</div>
<p>Treine todos na ferramenta <a href="#verbs">Irregular verbs</a>.</p>
<h3>Negativa e pergunta com did</h3>
<p>O <b>did</b> já carrega o passado, então o verbo principal volta para a forma base:</p>
<div class="chips">She <b>didn't go</b> (não <s>didn't went</s>) · <b>Did</b> you <b>see</b> it? (não <s>Did you saw</s>) · Where <b>did</b> they <b>meet</b>?</div>
<p>Com <b>was/were</b> não se usa did: <i>Were you tired? I wasn't there.</i></p>
<h3>Ago e last</h3>
<p><i>ten years <b>ago</b></i> (há dez anos: o ago vem depois), <i><b>last</b> night / last week / last year</i> (sem «the»), <i><b>yesterday</b> morning</i>.</p>
<div class="trap"><span class="pen">Cuidado!</span> «Há dez anos» é <i>ten years ago</i>, não <s>there are ten years</s> nem <s>has ten years</s>. Em espanhol, «hace diez años»: a ordem é a contrária.</div>
<div class="plus"><span class="pen">Nos livros</span> O past simple é o tempo da narração. Quando ler, repare como o autor alterna verbos curtos e rápidos: <i>She opened the door, looked around and froze.</i></div>
`,
reading:{
title:'The Wrong Train',
text:`<p>Last summer my friend Julia and I decided to visit Edinburgh. We bought our tickets online, packed our bags and got to King's Cross station in London an hour early. We felt very organised.</p>
<p>The station was [[crowded|lotada]] and noisy. Julia went to buy sandwiches while I looked at the [[departure board|painel de partidas]]. I saw "Edinburgh" and a platform number, so we ran to the train and found two empty seats. Ten minutes later, the train left. We ate our sandwiches, laughed a lot and started to plan our first evening.</p>
<p>About an hour later, a [[ticket inspector|fiscal]] came along. He looked at our tickets for a long time and then smiled. "These are fine," he said, "but this train doesn't go to Edinburgh. It goes to Leeds." We didn't believe him at first. Then we understood: the board showed two trains, and we took the wrong one.</p>
<p>We got off at the next station and waited two hours in the rain for another train. We arrived in Edinburgh at midnight, tired and hungry. But the city looked beautiful in the dark, and now it's our favourite travel story. We still tell it at every party.</p>`,

U({
id:103, n:'W3', lvl:'A2', band:0,
title:'Talking about the future',
sub:'Will, going to and the present continuous · Três futuros para três situações',
focus:'will (decisions now, predictions, promises, offers), going to (plans, evidence), present continuous for arrangements, present simple after when/as soon as/until, shall I/we',
lesson:`
<p class="lead">Em português dizemos «vou viajar» para quase tudo. O inglês escolhe a forma pelo <b>momento da decisão</b> e pela <b>certeza</b>. Nos filmes, <i>going to</i> (pronunciado <i>gonna</i>) é de longe o mais ouvido.</p>
<h3>Qual usar</h3>
<div class="tw"><table class="tbl">
<tr><th>forma</th><th>uso</th><th>exemplo</th></tr>
<tr><td><b>will</b></td><td>decisão tomada agora, promessa, oferta, previsão/opinião</td><td>The phone's ringing. I'<b>ll</b> get it! · I'<b>ll</b> call you. · I think it'<b>ll</b> rain.</td></tr>
<tr><td><b>going to</b></td><td>plano já decidido; previsão com evidência</td><td>I'm <b>going to</b> study tonight. · Look at those clouds! It's <b>going to</b> rain.</td></tr>
<tr><td><b>present continuous</b></td><td>compromisso marcado (com hora, lugar, outra pessoa)</td><td>I'm <b>meeting</b> Sam at seven. · We're <b>flying</b> to Rome on Friday.</td></tr>
<tr><td><b>present simple</b></td><td>horários e programas</td><td>The train <b>leaves</b> at 6:15.</td></tr>
</table></div>
<h3>Depois de when, as soon as, until, before, after: presente!</h3>
<p>Como no português («quando eu <b>chegar</b>»), o inglês não usa will depois dessas palavras, mas usa o <b>present simple</b>, não um subjuntivo:</p>
<div class="chips">I'll call you <b>when</b> I <b>arrive</b> (não <s>when I will arrive</s>) · Wait here <b>until</b> I <b>come</b> back · <b>As soon as</b> she <b>finishes</b>, we'll leave</div>
<h3>Shall</h3>
<p>Hoje só é comum em ofertas e sugestões: <i><b>Shall</b> I open the window? <b>Shall</b> we go?</i> (Quer que eu…? / Vamos?)</p>
<div class="trap"><span class="pen">Cuidado!</span> Para um plano decidido, <i>I will travel to Chile in May</i> soa estranho; o natural é <i>I'm going to travel</i> ou <i>I'm travelling</i>. Will para planos é coisa de livro didático.</div>
<div class="plus"><span class="pen">Nos filmes</span> <i>I'm gonna</i> = I'm going to; <i>I'll</i> soa quase como «al»; e <i>won't</i> (will not) soa como «want» com o: <i>I won't tell anyone</i>.</div>
`,

U({
id:104, n:'W4', lvl:'A2', band:0,
title:'Present perfect or past simple?',
sub:'Have you ever…? · I\'ve lived here since… · O tempo que o português não tem',
focus:'present perfect (have/has + past participle) for experience, recent news and unfinished time; ever, never, already, yet, just; for and since; contrast with past simple for finished time',
lesson:`
<p class="lead">O present perfect não tem equivalente direto em português nem em espanhol da América. É o tempo que liga o passado ao <b>agora</b>. Se existe um momento terminado no passado (ontem, em 2019, quando eu era criança), use o <b>past simple</b>. Se não existe, ou se o período continua, use o <b>present perfect</b>.</p>
<h3>Forma</h3>
<p><b>have/has + particípio</b>: <i>I'<b>ve seen</b>, she'<b>s been</b>, we <b>haven't finished</b>, <b>Have</b> you <b>eaten</b>?</i></p>
<h3>Três usos principais</h3>
<div class="tw"><table class="tbl">
<tr><th>uso</th><th>exemplo</th><th>em português</th></tr>
<tr><td>experiência (na vida, sem data)</td><td>I'<b>ve</b> never <b>been</b> to Japan. <b>Have</b> you ever <b>tried</b> sushi?</td><td>Nunca fui / Você já provou…?</td></tr>
<tr><td>novidade, resultado agora</td><td>I'<b>ve lost</b> my keys! She'<b>s just left</b>.</td><td>Perdi minhas chaves! Ela acabou de sair.</td></tr>
<tr><td>situação que começou e continua</td><td>I'<b>ve lived</b> here <b>for</b> five years / <b>since</b> 2020.</td><td>Moro aqui há cinco anos / desde 2020.</td></tr>
</table></div>
<h3>For e since</h3>
<p><b>for</b> + duração (<i>for two hours, for ages, for a long time</i>); <b>since</b> + ponto de partida (<i>since Monday, since 2015, since I was a child</i>).</p>
<div class="trap"><span class="pen">Cuidado!</span> «Moro aqui desde 2015» não é <s>I live here since 2015</s>: é <i>I'<b>ve lived</b> here since 2015</i>. E «há quanto tempo você estuda inglês?» é <i>How long <b>have</b> you <b>been</b> studying English?</i></div>
<h3>Already, yet, just</h3>
<div class="chips">I've <b>already</b> paid (já) · Have you finished <b>yet</b>? (já, na pergunta) · I haven't finished <b>yet</b> (ainda não) · He's <b>just</b> arrived (acabou de)</div>
<h3>Past simple com tempo terminado</h3>
<p>Assim que aparece um quando terminado, volta o past simple: <i>I'<b>ve been</b> to London. I <b>went</b> there <b>in 2018</b>.</i> Nunca <s>I've been there in 2018</s>.</p>
<div class="plus"><span class="pen">Nos filmes</span> No inglês americano falado, muitas vezes se ouve o past simple onde o britânico usaria o perfect: <i>Did you eat yet?</i> Entenda os dois; nas provas, use o perfect.</div>
<div class="plus"><span class="pen">Been ou gone?</span> <i>She's <b>gone</b> to Paris</i> (está lá agora) / <i>She's <b>been</b> to Paris</i> (já foi e voltou).</div>
`,

U({

focus:'a/an/the/zero article, generalisations without the, uncountable nouns (information, advice, news, furniture, money), people/police are, much/many/a lot of, few/a few/little/a little, some/any, too/enough',
lesson:`
<p class="lead">Português e espanhol usam artigo para generalizar («<b>a</b> música é importante», «<b>la</b> vida es dura»). O inglês, não: generalizações vão <b>sem artigo</b>. Esse é o erro mais frequente de brasileiros em textos escritos.</p>
<h3>Quando NÃO usar the</h3>
<div class="chips"><b>Music</b> is important · I love <b>cats</b> · <b>People</b> are strange · <b>Life</b> is short · I study <b>English</b> · <b>Breakfast</b> is at eight · I go to <b>work</b> by <b>bus</b> · <b>Brazil</b> is huge</div>
<p>Use <b>the</b> quando você fala de algo específico: <i><b>The</b> music in this film is amazing</i>, <i><b>The</b> people I met were friendly</i>.</p>
<h3>A / an</h3>
<p>Profissões levam artigo: <i>She's <b>a</b> doctor</i> (não <s>She's doctor</s>). <b>an</b> antes de som de vogal: <i>an hour, an honest man</i>, mas <i>a university, a European city</i> (som de «iu»).</p>
<h3>Incontáveis: sem plural, sem «a»</h3>
<p>Algumas palavras são contáveis em português mas <b>incontáveis</b> em inglês:</p>
<div class="chips">information · advice · news · furniture · luggage · homework · equipment · research · feedback · knowledge · evidence · progress · software</div>
<p><i>Can you give me <b>some advice</b>? / <b>a piece of</b> advice</i> (nunca <s>an advice</s>, <s>advices</s>). <i>The news <b>is</b> bad.</i></p>
<div class="trap"><span class="pen">Cuidado!</span> <b>people</b> e <b>police</b> são plurais: <i>People <b>are</b>…</i> (não <s>people is</s>). E <i>everybody</i> é singular: <i>Everybody <b>knows</b></i>.</div>
<h3>Quantidades</h3>
<div class="tw"><table class="tbl">
<tr><th></th><th>contável (books)</th><th>incontável (time)</th></tr>
<tr><td>muito</td><td><b>many</b> books</td><td><b>much</b> time (sobretudo em perguntas e negativas)</td></tr>
<tr><td>muito (afirmativas)</td><td colspan="2"><b>a lot of</b> books / time</td></tr>
<tr><td>poucos, pouco (negativo)</td><td><b>few</b> friends</td><td><b>little</b> money</td></tr>
<tr><td>alguns, um pouco (positivo)</td><td><b>a few</b> friends</td><td><b>a little</b> money</td></tr>
</table></div>
<p><i>I have <b>a few</b> friends here</i> (tenho alguns: bom) × <i>I have <b>few</b> friends here</i> (tenho poucos: triste).</p>
<div class="plus"><span class="pen">Too e enough</span> <i>too</i> vem antes do adjetivo: <i>It's <b>too</b> expensive</i>. <i>enough</i> vem depois do adjetivo e antes do substantivo: <i>It isn't big <b>enough</b> · I don't have <b>enough</b> time</i>.</div>
`,

text:`<p>Most people take too much luggage on holiday. Experts say that travellers wear only about half of the clothes they pack. So here is some advice from people who travel with just one small bag.</p>
<p>First, choose clothes in two or three colours that go together. A few good T-shirts and one warm jumper are enough for a week, even in the mountains. You don't need many shoes either: one comfortable pair for walking and one light pair for the evening.</p>
<p>Second, think about what you can buy there. The shops in most cities sell [[toiletries|produtos de higiene]], so there's little reason to carry big bottles of shampoo. Hotels usually give you soap and towels, too.</p>
<p>Third, use technology. A phone can be your camera, your map, your [[boarding pass|cartão de embarque]] and your library. Information about museums and transport is all online, so you don't need heavy guidebooks.</p>

U({
id:106, n:'W6', lvl:'A2', band:0,
title:'Modal verbs and asking questions',
sub:'can, must, have to, should · Do you…? Who called? Do you know where…?',
focus:'can/could/be able to, must/have to/don\'t have to/mustn\'t, should, modals without to and without -s, question word order with do/does/did, subject questions (Who called you?), indirect questions (Do you know where the station is?)',
lesson:`
<p class="lead">Os modais (<i>can, could, must, should, will, would, may, might</i>) são simples na forma e traiçoeiros no sentido. E perguntar em inglês exige uma ordem que o português não tem.</p>
<h3>As regras dos modais</h3>
<p>Sem <b>-s</b>, sem <b>to</b> depois, sem <b>do</b>: <i>She <b>can</b> swim</i> (não <s>cans</s>), <i>You <b>should</b> go</i> (não <s>should to go</s>), <i><b>Can</b> you help me?</i> (não <s>Do you can</s>).</p>
<h3>Obrigação: must × have to × don't have to × mustn't</h3>
<div class="tw"><table class="tbl">
<tr><th>forma</th><th>sentido</th><th>exemplo</th></tr>
<tr><td><b>have to</b></td><td>obrigação (regra externa)</td><td>I <b>have to</b> wear a uniform at work.</td></tr>
<tr><td><b>must</b></td><td>obrigação que eu sinto; avisos escritos</td><td>I <b>must</b> call my mum. Passengers <b>must</b> show their tickets.</td></tr>
<tr><td><b>don't have to</b></td><td>não é necessário</td><td>You <b>don't have to</b> come. (não precisa)</td></tr>
<tr><td><b>mustn't</b></td><td>proibido</td><td>You <b>mustn't</b> smoke here. (não pode!)</td></tr>
</table></div>
<div class="trap"><span class="pen">Cuidado!</span> <i>You don't have to pay</i> = não precisa pagar. <i>You mustn't pay</i> = é proibido pagar. Confundir os dois muda tudo.</div>
<h3>Can, could, should</h3>
<p><b>can</b> (pode, sabe: <i>I can drive</i>), <b>could</b> (podia/conseguia: <i>I could read at four</i>; pedido educado: <i>Could you…?</i>), <b>should</b> (deveria, conselho: <i>You should see a doctor</i>). No futuro e no perfect, <i>can</i> vira <b>be able to</b>: <i>I'll be able to help you tomorrow.</i></p>
<h3>Ordem das perguntas: QASI</h3>
<p><b>Q</b>uestion word + <b>A</b>uxiliar + <b>S</b>ujeito + <b>I</b>nfinitivo: <i>Where <b>do</b> you <b>work</b>? What <b>did</b> she <b>say</b>? Why <b>are</b> they <b>laughing</b>?</i></p>
<h3>Perguntas sobre o sujeito: sem do</h3>
<p>Quando <i>who/what</i> é o sujeito, não há auxiliar: <i><b>Who called</b> you?</i> (quem ligou?) × <i>Who <b>did</b> you call?</i> (para quem você ligou?). <i><b>What happened</b>?</i> (nunca <s>What did happen?</s>)</p>
<h3>Perguntas indiretas: ordem normal</h3>
<p>Mais educadas, muito usadas em lojas e no trabalho. Depois de <i>Do you know…? Can you tell me…? I wonder…</i> a ordem volta a ser afirmativa:</p>
<div class="chips">Where <b>is the station</b>? → Do you know where <b>the station is</b>? · What time does it open? → Can you tell me what time <b>it opens</b>?</div>
`,

U({
id:1, lvl:'B1 → B2', band:1,
title:'Narrative tenses: how novels tell stories',
sub:'Past continuous, past perfect, used to and would · Ler um romance sem se perder no tempo',
focus:'past simple vs past continuous (while, when, as), past perfect and past perfect continuous for earlier events, used to and would for past habits, be/get used to contrast',
lesson:`
<p class="lead">Um romance em inglês alterna quatro tempos para organizar o passado. Reconhecê-los é o que permite saber o que aconteceu antes, o que estava em andamento e o que era hábito, sem precisar traduzir.</p>
<h3>O mapa</h3>
<div class="tw"><table class="tbl">
<tr><th>tempo</th><th>função na história</th><th>exemplo</th></tr>
<tr><td><b>past simple</b></td><td>os fatos principais, em sequência</td><td>She <b>opened</b> the letter and <b>sat</b> down.</td></tr>
<tr><td><b>past continuous</b></td><td>o cenário, a ação interrompida</td><td>It <b>was raining</b>. I <b>was cooking</b> when he <b>called</b>.</td></tr>
<tr><td><b>past perfect</b></td><td>o que aconteceu ANTES do momento da história</td><td>When I arrived, the film <b>had</b> already <b>started</b>.</td></tr>
<tr><td><b>past perfect continuous</b></td><td>duração até um ponto do passado</td><td>Her eyes were red. She <b>had been crying</b>.</td></tr>
</table></div>
<h3>Past perfect: o «mais-que-perfeito»</h3>
<p>É o nosso «tinha feito / havia feito». <i>had + particípio</i> para todas as pessoas, e na fala vira <b>'d</b>: <i>I'd forgotten</i>. Compare:</p>
<div class="chips">When I got to the station, the train <b>left</b>. (cheguei, e aí o trem saiu) · When I got to the station, the train <b>had left</b>. (o trem já tinha saído)</div>
<h3>Hábitos do passado: used to e would</h3>
<p><b>used to</b> = «costumava», para hábitos e estados: <i>I <b>used to</b> live in Recife. I <b>didn't use to</b> like coffee.</i> <b>would</b> só para ações repetidas, muito comum em memórias: <i>Every summer we <b>would</b> drive to the coast.</i> Nunca <s>would</s> para estados: <i>I used to have long hair</i> (não <s>I would have long hair</s>).</p>
<div class="trap"><span class="pen">Cuidado!</span> <b>used to do</b> (hábito passado que acabou) ≠ <b>be used to doing</b> (estar acostumada) ≠ <b>get used to doing</b> (acostumar-se). <i>I'm used to <b>working</b> late. I'm getting used to <b>driving</b> on the left.</i></div>
<div class="trap"><span class="pen">Para quem fala espanhol</span> O past continuous parece o imperfeito (<i>llovía</i>), mas não serve para hábitos: <i>Cuando era niña, jugaba</i> → <i>When I was a child, I <b>used to play</b></i> (não <s>I was playing</s>).</div>
<div class="plus"><span class="pen">Lendo romances</span> Quando o narrador passa para o past perfect, é um flashback. Assim que a história «volta», ele retorna ao past simple. Repare nisso no próximo livro.</div>
`,

<p>Nobody knew she was coming. She hadn't told anyone. With [[shaking|trêmulas]] hands, she opened it.</p>`,

U({

title:'Phrasal verbs I: the ones every film uses',
sub:'get, take, put, come, go, look, find out, figure out · O vocabulário que falta nas legendas',
focus:'high-frequency phrasal verbs with get, take, put, come, go, look, turn, find, figure, give, run, work; separable vs inseparable; object pronoun position (turn it off, not turn off it)',
lesson:`
<p class="lead">Nativos quase nunca dizem <i>discover, continue, tolerate, postpone</i> numa conversa. Dizem <b>find out, carry on, put up with, put off</b>. Sem os phrasal verbs, um filme parece rápido demais; com eles, metade da dificuldade desaparece.</p>
<h3>O que são</h3>
<p>Verbo + partícula (<i>up, out, off, on, in, back, down, away, over</i>) com um sentido novo, muitas vezes impossível de adivinhar: <i>give up</i> não é «dar para cima», é desistir.</p>
<h3>30 essenciais</h3>
<div class="tw"><table class="tbl">
<tr><th>phrasal verb</th><th>sentido</th><th>phrasal verb</th><th>sentido</th></tr>
<tr><td>find out</td><td>descobrir (informação)</td><td>figure out</td><td>entender, resolver</td></tr>
<tr><td>give up</td><td>desistir; parar (de fumar)</td><td>carry on / go on</td><td>continuar</td></tr>
<tr><td>get up</td><td>levantar-se</td><td>get on (with)</td><td>dar-se bem (com)</td></tr>
<tr><td>get over</td><td>superar</td><td>get back</td><td>voltar</td></tr>
<tr><td>look for</td><td>procurar</td><td>look after</td><td>cuidar de</td></tr>
<tr><td>look forward to</td><td>aguardar ansiosamente</td><td>look up</td><td>procurar (no dicionário)</td></tr>
<tr><td>put off</td><td>adiar</td><td>put on</td><td>vestir; ligar</td></tr>
<tr><td>take off</td><td>tirar (roupa); decolar</td><td>take up</td><td>começar (hobby)</td></tr>
<tr><td>turn on / off</td><td>ligar / desligar</td><td>turn down</td><td>recusar; abaixar (volume)</td></tr>
<tr><td>come up</td><td>surgir</td><td>come across</td><td>encontrar por acaso</td></tr>
<tr><td>run out of</td><td>ficar sem</td><td>break down</td><td>quebrar (carro); desabar</td></tr>
<tr><td>work out</td><td>malhar; dar certo; calcular</td><td>pick up</td><td>pegar; buscar alguém</td></tr>
<tr><td>show up</td><td>aparecer</td><td>hang out</td><td>sair, passar tempo</td></tr>
<tr><td>calm down</td><td>acalmar-se</td><td>hold on</td><td>espera aí!</td></tr>
<tr><td>make up</td><td>inventar; fazer as pazes</td><td>break up</td><td>terminar (namoro)</td></tr>
</table></div>
<h3>Separáveis e inseparáveis</h3>
<p>Muitos aceitam o objeto no meio: <i>turn <b>the TV</b> off</i> ou <i>turn off <b>the TV</b></i>. Mas com pronome, o pronome <b>tem</b> de ir no meio: <i>turn <b>it</b> off</i> (nunca <s>turn off it</s>), <i>pick <b>me</b> up at eight</i>.</p>
<p>Outros são inseparáveis: <i>look <b>after</b> the kids / look after <b>them</b></i>, <i>get <b>over</b> it</i>, <i>come <b>across</b> it</i>.</p>
<div class="trap"><span class="pen">Cuidado!</span> <i>look forward to</i> termina em preposição: depois vem <b>-ing</b>: <i>I look forward to <b>hearing</b> from you</i> (não <s>to hear</s>).</div>
<div class="plus"><span class="pen">Estratégia</span> Não decore listas soltas: anote cada phrasal verb com a frase do filme onde o ouviu, em «My words». A cena ajuda a memória mais do que a tradução.</div>
`,

sub:'If it rains… If I were you… If I had known… · unless, as long as, in case',

lesson:`
<p class="lead">O inglês organiza as hipóteses em quatro tipos. A regra de ouro, oposta ao que muita gente faz: <b>nunca will nem would na oração com if</b> (salvo raros casos de cortesia).</p>
<h3>Os quatro condicionais</h3>
<div class="tw"><table class="tbl">
<tr><th>tipo</th><th>if…</th><th>resultado</th><th>exemplo</th></tr>
<tr><td>0 · sempre verdade</td><td>present</td><td>present</td><td>If you heat ice, it <b>melts</b>.</td></tr>
<tr><td>1 · possível, futuro real</td><td>present</td><td>will / can / imperativo</td><td>If it <b>rains</b>, we<b>'ll stay</b> home.</td></tr>
<tr><td>2 · imaginário, presente</td><td>past simple</td><td>would / could</td><td>If I <b>had</b> more time, I<b>'d read</b> more.</td></tr>
<tr><td>3 · impossível, passado</td><td>past perfect</td><td>would have + particípio</td><td>If I <b>had known</b>, I <b>would have helped</b>.</td></tr>
</table></div>
<h3>Correspondência com o português</h3>
<p>Tipo 2: «se eu <b>tivesse</b> tempo, eu <b>leria</b>» → <i>If I <b>had</b> time, I <b>would</b> read</i>. Tipo 3: «se eu <b>tivesse sabido</b>, <b>teria ajudado</b>» → <i>If I <b>had known</b>, I <b>would have helped</b></i>. Onde o português usa o subjuntivo, o inglês usa um tempo passado.</p>
<div class="trap"><span class="pen">Cuidado!</span> <s>If I would have time</s> → <i>If I <b>had</b> time</i>. <s>If I will see him</s> → <i>If I <b>see</b> him</i>.</div>
<h3>If I were you</h3>
<p>Para conselhos: <i>If I <b>were</b> you, I'd take the job.</i> Na fala ouve-se <i>If I was</i>, mas em provas use <b>were</b>.</p>
<h3>Outras conjunções</h3>
<div class="chips"><b>unless</b> = if not: I won't go unless you come · <b>as long as / provided that</b> = desde que · <b>in case</b> = caso (prevenção): Take an umbrella in case it rains · <b>otherwise</b> = senão</div>
<div class="plus"><span class="pen">Na fala</span> Nos filmes, o tipo 3 vira quase um sussurro: <i>If I'd known, I would've told you</i> soa «if-aid-nown, ai-wuda-told-ya». Treine o <i>would've / could've / should've</i>.</div>
`,

text:`<p>Three years ago I missed a flight to Lisbon, and it changed my life. If I hadn't stayed in that coffee shop for one more chapter of my book, I would have caught the plane. And if I had caught the plane, I would never have met Tom.</p>

U({
id:4, lvl:'B1 → B2', band:1,
title:'The passive and «have something done»',
sub:'It was built in 1890 · I\'m having my hair cut · It is said that…',
focus:'passive in all main tenses (is made, was built, has been sold, will be announced, is being repaired), by + agent, have/get something done, impersonal passive (it is said that, he is believed to be)',
lesson:`
<p class="lead">Notícias, textos acadêmicos e provas de compreensão estão cheios de voz passiva. O inglês a usa muito mais que o português, que prefere o «se»: <i>vende-se casa</i> → <i>House <b>for sale</b></i>; <i>fala-se inglês</i> → <i>English <b>is spoken</b></i>.</p>
<h3>Forma: be + particípio</h3>
<div class="tw"><table class="tbl">
<tr><th>tempo</th><th>ativa</th><th>passiva</th></tr>
<tr><td>present simple</td><td>They make it in China.</td><td>It <b>is made</b> in China.</td></tr>
<tr><td>present continuous</td><td>They are repairing the road.</td><td>The road <b>is being repaired</b>.</td></tr>
<tr><td>past simple</td><td>They built it in 1890.</td><td>It <b>was built</b> in 1890.</td></tr>
<tr><td>present perfect</td><td>Someone has stolen my bike.</td><td>My bike <b>has been stolen</b>.</td></tr>
<tr><td>future</td><td>They will announce the results.</td><td>The results <b>will be announced</b>.</td></tr>
<tr><td>modal</td><td>You must sign the form.</td><td>The form <b>must be signed</b>.</td></tr>
</table></div>
<p>O agente com <b>by</b> só aparece se for importante: <i>The novel was written <b>by</b> a sixteen-year-old.</i></p>
<h3>Have / get something done: «mandar fazer»</h3>
<p>Para serviços feitos por outra pessoa: <i>I <b>had my hair cut</b></i> (cortei o cabelo, no cabeleireiro), <i>We're <b>having the kitchen painted</b></i>, <i>You should <b>get your eyes tested</b></i>. Também para coisas ruins que «acontecem com você»: <i>She <b>had her phone stolen</b></i>.</p>
<div class="trap"><span class="pen">Cuidado!</span> «Cortei o cabelo» dito em inglês como <i>I cut my hair</i> significa que você mesma pegou a tesoura. No salão: <i>I <b>had</b> my hair <b>cut</b></i> / <i>I <b>got</b> my hair <b>cut</b></i>.</div>
<h3>Passiva impessoal: a linguagem dos jornais</h3>
<div class="chips"><b>It is said that</b> he is very rich · He <b>is said to be</b> very rich · <b>It is believed that</b> the painting is fake · The painting <b>is believed to be</b> fake · She <b>is thought to have left</b> the country</div>

<div class="plus"><span class="pen">Nas provas</span> As transformações da Cambridge adoram passar uma frase para a passiva ou para <i>have something done</i>. Treine no Sentence lab.</div>

lesson:`
<p class="lead">Em romances e séries, metade das conversas chega «contada»: <i>She told me he'd lied</i>. Entender o reported speech é entender quem disse o quê e quando.</p>
<h3>Recuo dos tempos (backshift)</h3>
<div class="tw"><table class="tbl">
<tr><th>discurso direto</th><th>discurso indireto</th></tr>
<tr><td>"I <b>am</b> tired."</td><td>She said she <b>was</b> tired.</td></tr>
<tr><td>"I'<b>m working</b>."</td><td>She said she <b>was working</b>.</td></tr>
<tr><td>"I <b>saw</b> it." / "I'<b>ve seen</b> it."</td><td>She said she <b>had seen</b> it.</td></tr>
<tr><td>"I <b>will</b> call."</td><td>She said she <b>would</b> call.</td></tr>
<tr><td>"I <b>can</b> help."</td><td>She said she <b>could</b> help.</td></tr>
<tr><td>"I <b>must</b> go."</td><td>She said she <b>had to</b> go.</td></tr>
</table></div>
<p>Também mudam as referências: <i>today → that day, tomorrow → the next day, yesterday → the day before, here → there, this → that</i>. Se o fato ainda é verdade, o recuo é opcional: <i>He said he <b>lives</b> in Rome.</i></p>
<h3>Say ou tell?</h3>
<p><b>tell</b> exige a pessoa: <i>She <b>told me</b> the truth</i>. <b>say</b> não leva pessoa direta: <i>She <b>said</b> it was late</i> / <i>She said <b>to me</b>…</i></p>
<div class="trap"><span class="pen">Cuidado!</span> <s>She said me</s> não existe. Nem <s>She told that…</s>: é <i>She <b>told me</b> that…</i> ou <i>She <b>said</b> that…</i>.</div>
<h3>Perguntas: ordem afirmativa, sem do</h3>
<div class="chips">"Where do you live?" → He asked me where <b>I lived</b>. · "Are you ok?" → She asked <b>if/whether</b> I was ok.</div>
<h3>Ordens e pedidos: to + infinitivo</h3>
<p><i>"Sit down." → He <b>told me to sit</b> down. "Please don't shout." → She <b>asked us not to shout</b>.</i></p>
<h3>Verbos que resumem a fala</h3>
<div class="tw"><table class="tbl">
<tr><th>verbo</th><th>estrutura</th><th>exemplo</th></tr>
<tr><td>admit / deny</td><td>+ -ing / that</td><td>He <b>denied taking</b> the money.</td></tr>
<tr><td>suggest</td><td>+ -ing / that someone (should)</td><td>She <b>suggested going</b> by train. (não <s>suggested to go</s>)</td></tr>
<tr><td>promise / refuse / offer / agree</td><td>+ to</td><td>He <b>refused to answer</b>.</td></tr>
<tr><td>warn / remind / advise / persuade</td><td>+ someone + to</td><td>She <b>reminded me to call</b> Mum.</td></tr>
<tr><td>apologise / insist</td><td>+ for -ing / on -ing</td><td>He <b>apologised for being</b> late.</td></tr>
</table></div>
`,
