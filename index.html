{id:'b2-essay', exam:'cam', lvl:'B2', g:'essay', minutes:40, words:[140,190], title:'Screens and children',
 prompt:`<p>In your English class you have been talking about technology and young people. Now your teacher has asked you to write an essay.</p><blockquote><b>Should there be strict limits on how much time children spend in front of screens?</b><br>Notes — write about:<br>1. health<br>2. education<br>3. ……… (your own idea)</blockquote>`,
 model:`Most children today spend several hours a day looking at phones, tablets or televisions. Some people believe that parents and schools should set strict limits, while others think this is unnecessary. In my view, limits are useful, but they should be flexible.

Firstly, there are clear health reasons for limiting screen time. Children who spend too long in front of a screen often sleep worse and do less exercise. As a result, they may have problems with concentration and even with their weight.

On the other hand, screens can be excellent tools for learning. Educational apps and videos can explain difficult topics in an attractive way, and many schools now use tablets in class. Banning them completely would not make sense.

Another point is family life. When everyone is looking at a different screen, families talk less. Simple rules, such as no phones at dinner, can make a real difference.

To sum up, I believe that limits are necessary, but they should focus on how screens are used, not only on how long.`},
{id:'b2-email', exam:'cam', lvl:'B2', g:'email', minutes:40, words:[140,190], title:'Advice for a friend',
 prompt:`<p>You have received this email from your English-speaking friend, Sam.</p><blockquote>I've just been offered a job in Lisbon, but I don't speak any Portuguese! I start in three months. What's the best way to learn quickly? And what should I know about living there? Any other tips? Thanks! Sam</blockquote><p>Write your <b>email</b>.</p>`,
 model:`Hi Sam,

Congratulations on the new job! That's fantastic news, and Lisbon is a wonderful city, so you're going to love it.

Don't worry about the language. Three months is enough to learn the basics if you study a little every day. I'd start with an app for twenty minutes a day, and then find a conversation partner online as soon as possible. Speaking from the beginning is the best way to lose the fear. You should also watch Portuguese series with subtitles; it's a great way to get used to the sound.

As for living there, remember that the city is full of hills, so bring comfortable shoes! Rents in the centre can be expensive, so you might want to look at neighbourhoods a bit further out. People are very friendly, and they really appreciate it when foreigners try to speak Portuguese, even badly.

One last tip: try the custard tarts as soon as you arrive. You won't regret it!

Let me know if you need anything else.

Best wishes,
Larissa`},
{id:'b2-review', exam:'cam', lvl:'B2', g:'review', minutes:40, words:[140,190], title:'A series that made you laugh',
 prompt:`<p>You see this announcement on an English-language website.</p><blockquote><b>Reviews wanted!</b><br>Tell us about a TV series that made you laugh. What is it about? What makes it funny? Would you recommend it to people who are learning English?<br>The best reviews will be published next month.</blockquote><p>Write your <b>review</b>.</p>`,
 model:`Ted Lasso: kindness has never been so funny

If you're looking for a series that will make you smile from the first episode, look no further than Ted Lasso. It tells the story of an American football coach who is hired to manage an English football team, although he knows absolutely nothing about the sport.

What makes it so funny is the contrast between Ted's endless optimism and the cynical people around him. His jokes are often terrible, but his kindness slowly changes everyone, and you find yourself laughing and crying in the same scene.

For English learners, it's a real treasure. You can hear American and several British accents side by side, and the dialogue is full of everyday expressions. The only drawback is that some characters speak very fast, so I'd recommend using English subtitles at first.

All in all, I would highly recommend Ted Lasso to anyone who needs a good laugh and wants to improve their listening at the same time.`},
{id:'b2-report', exam:'cam', lvl:'B2', g:'report', minutes:40, words:[140,190], title:'Studying at the local library',
 prompt:`<p>The director of your local library wants to attract more young adults. He has asked you to write a report explaining what the library offers now, what young people think of it, and what changes you recommend.</p><p>Write your <b>report</b>.</p>`,
 model:`Introduction
The aim of this report is to describe the current facilities of the library, summarise the opinions of young adults and recommend some changes. It is based on a short survey of thirty people aged between 18 and 30.

Current facilities
The library has a large collection of books and a quiet reading room. It is open from 10 a.m. to 6 p.m. on weekdays and closed at weekends.

Opinions of young adults
Most people surveyed said that the building is pleasant, but the opening hours are a problem, as many of them work or study during the day. Several also complained that the Wi-Fi is slow and that there are very few power sockets.

Recommendations
It is recommended that the library should open in the evenings and on Saturday mornings. Improving the Wi-Fi and adding more sockets would make it a popular place to study. Finally, organising monthly book clubs or film nights would help attract new visitors.`},
{id:'c1-essay', exam:'cam', lvl:'C1', g:'essay', minutes:45, words:[220,260], title:'Encouraging people to read',
 prompt:`<p>Your class has attended a panel discussion on how governments could encourage adults to read more. You have made the notes below.</p><blockquote><b>Ways governments could encourage reading:</b><br>• public libraries<br>• lower prices for books<br>• national reading campaigns<br><i>Some opinions expressed in the discussion:</i><br>«Libraries are the heart of a community.»<br>«People would read more if books were cheaper.»<br>«Adverts won't change anyone's habits.»</blockquote><p>Write an <b>essay</b> discussing <b>two</b> of the ways in your notes. You should <b>explain which way you think would be more effective</b>, giving reasons in support of your answer.</p>`,
 model:`Although reading is widely recognised as beneficial, surveys suggest that many adults hardly ever open a book. Governments have several tools at their disposal to change this, and two of the most frequently discussed are investing in public libraries and making books cheaper.

Supporters of lower prices argue that cost is the main barrier. If books were exempt from tax, the reasoning goes, more people would buy them. There is some truth in this, particularly for families on low incomes. However, price alone rarely explains behaviour: many people who could easily afford a novel still choose to spend their free time on their phones. Cheaper books might simply mean that those who already read would buy more.

Public libraries, by contrast, address not only cost but also access and habit. A well-funded library offers books free of charge, but it also offers a quiet place to read, advice from librarians and activities such as book clubs or author talks. Crucially, it reaches people who would never walk into a bookshop, including children, the elderly and newcomers to the country. In this sense, a library does more than supply books: it creates readers.

In conclusion, while reducing prices could be a welcome measure, I believe that investing in libraries would be considerably more effective. Not only do they remove the financial barrier, but they also build the kind of community in which reading becomes a natural part of everyday life.`},
{id:'c1-proposal', exam:'cam', lvl:'C1', g:'proposal', minutes:45, words:[220,260], title:'Wellbeing at work',
 prompt:`<p>The company you work for wants to improve the wellbeing of its employees and has invited staff to submit proposals. You decide to write a proposal describing the main problems that affect staff wellbeing at the moment, suggesting <b>two or three changes</b>, and explaining how these changes would benefit both the staff and the company.</p><p>Write your <b>proposal</b>.</p>`,
 model:`Introduction
The purpose of this proposal is to identify the main factors affecting staff wellbeing in our department and to suggest practical changes that could be introduced in the coming months.

Current situation
At present, many employees report feeling under pressure. Meetings frequently run late, messages arrive at all hours, and there is no clear expectation about when staff may disconnect. In addition, the office has very few quiet spaces, which makes concentrated work difficult.

Suggested changes
Firstly, I would suggest introducing a «no meetings» afternoon each week, allowing everyone to focus on their main tasks without interruption. Secondly, the company could adopt a simple policy stating that emails and chat messages sent after 7 p.m. do not require a reply until the following morning. Finally, one of the smaller meeting rooms could be turned into a quiet room for focused work or short breaks.

Expected benefits
These measures would not only reduce stress but also improve productivity, as staff would be able to concentrate for longer periods. Furthermore, a company that visibly cares about its employees is more likely to retain experienced staff, which would reduce the considerable costs of recruitment and training.

Conclusion
None of these changes would require significant investment. I strongly believe that, taken together, they would make a noticeable difference to the wellbeing of the team and, consequently, to the results of the company.`},
{id:'c1-review', exam:'cam', lvl:'C1', g:'review', minutes:45, words:[220,260], title:'Book or film?',
 prompt:`<p>An international magazine is running a series called <b>«Book or film?»</b>. Readers are invited to send in a review of a novel that has been made into a film, comparing the two and saying which they think is more successful and why.</p><p>Write your <b>review</b>.</p>`,
 model:`The Martian: when the film almost beats the book

Andy Weir's The Martian began life as a self-published online novel before becoming a bestseller and, in 2015, a Hollywood blockbuster. Having enjoyed both, I was surprised to find the comparison far closer than I had expected.

The novel is essentially the diary of Mark Watney, an astronaut left alone on Mars after his crew believe he has died. Its greatest strength is its voice: Watney is sarcastic, nerdy and relentlessly practical, and the technical detail, which might sound tedious, is precisely what makes his survival believable. That said, some passages read more like an engineering manual than a story, and readers without a scientific background may find themselves skimming.

Ridley Scott's film wisely trims most of these explanations. Matt Damon captures Watney's humour remarkably well, and the vast red landscapes give a sense of isolation that the book, told almost entirely from inside his head, cannot quite achieve. What is lost, however, is the satisfaction of following each problem to its solution; on screen, success sometimes arrives a little too easily.

So which is better? For sheer entertainment, the film is hard to beat. Yet for anyone who enjoys watching a clever mind at work, the novel remains the richer experience. My advice would be to read the book first, and then watch the film as a reward.`},
{id:'c1-email', exam:'cam', lvl:'C1', g:'email', minutes:45, words:[220,260], title:'A disappointing online course',
 prompt:`<p>You recently paid for an online language course, but it was very different from what the website promised. Write a <b>formal email</b> to the company explaining what was advertised, what the problems were and what you would like the company to do.</p>`,
 model:`Dear Sir or Madam,

I am writing to express my dissatisfaction with the «Fluent in Twelve Weeks» online course, for which I paid €249 on 2 October.

According to your website, the course included weekly live conversation classes with a qualified teacher, personalised feedback on written work within 48 hours and access to a library of over 200 authentic videos. Unfortunately, my experience has been very different.

Firstly, only two of the six live classes have actually taken place; the others were cancelled without notice, and on both occasions the session was led by a different person who did not appear to be a qualified teacher. Secondly, I have submitted four pieces of written work and have received feedback on just one, almost three weeks after sending it. Finally, the video library contains fewer than fifty videos, several of which do not play at all.

I would also like to point out that I contacted your support team on 20 October and have yet to receive a reply.

Given that the course has clearly not been delivered as advertised, I would be grateful if you could refund the full amount. Alternatively, I would be willing to accept a partial refund together with a guarantee that the remaining classes will take place as scheduled.

I look forward to receiving your reply within the next fourteen days.

Yours faithfully,
Larissa Santos`},

 model:`The bar chart compares the proportion of adults in five age groups who read at least one book a month in 2015 and 2025.

Overall, it is clear that reading declined among younger adults over the decade, while it increased among the older age groups. In both years, people aged 65 and over were the most frequent readers.

In 2015, the youngest group, those aged 18 to 24, had a relatively high reading rate of 58%, but this figure fell sharply to 41% in 2025, the largest drop of any group. A smaller decrease was seen among 25- to 34-year-olds, from 52% to 44%. The figure for people aged 35 to 49 remained almost unchanged, at around 46–47%.

By contrast, the two oldest groups read more in 2025 than ten years earlier. The percentage of 50- to 64-year-olds who read monthly rose from 51% to 55%, while the figure for those aged 65 and over increased from 62% to 68%. As a result, by 2025 the oldest adults were reading at a rate roughly two-thirds higher than the youngest.`},
{id:'ielts-t2', exam:'ielts', lvl:'C1', g:'task2', minutes:40, words:[250,320], title:'Languages and technology',
 prompt:`<p>Write about the following topic:</p><blockquote><b>Some people believe that learning a foreign language at school is no longer necessary because translation technology is improving so quickly. To what extent do you agree or disagree?</b></blockquote><p>Give reasons for your answer and include any relevant examples from your own knowledge or experience. Write at least 250 words.</p>`,
 model:`In recent years, translation apps have become remarkably accurate, and some people now question whether schools should continue to teach foreign languages. While I accept that technology has made basic communication easier, I strongly disagree that language learning has become unnecessary.

The main reason is that a language is far more than a tool for exchanging information. When we speak to someone in their own language, we build trust in a way that no device can replicate. Business negotiations, friendships and even job interviews depend on humour, tone and cultural references that machines still struggle to convey. A doctor who can reassure a patient directly, for example, offers something an app cannot.

Furthermore, learning a language brings cognitive and educational benefits that go beyond communication. Studies have linked bilingualism to better concentration and problem-solving skills, and students who learn a second language often gain a clearer understanding of the grammar of their own. These advantages would be lost if languages were removed from the curriculum.

Admittedly, translation technology is extremely useful for tourists or for reading simple texts, and it would be unrealistic to expect every student to become fluent. However, this is an argument for teaching languages in a more practical and engaging way, not for abandoning them altogether.

In conclusion, although translation tools will continue to improve, I firmly believe that foreign languages should remain a central part of school education, because they offer personal, professional and intellectual benefits that technology cannot replace.`},
{id:'b2-article', exam:'cam', lvl:'B2', g:'article', minutes:40, words:[140,190], title:'The best place to study',
 prompt:`<p>You see this announcement in an English-language magazine for students.</p><blockquote><b>Where do you study best?</b><br>Some people need total silence; others work best in a busy café. Tell us about the place where you study best and explain why it works for you. Is there anything you would change?</blockquote><p>Write your <b>article</b>.</p>`,
 model:`My secret study spot

Have you ever tried to study at home and ended up cleaning the kitchen instead? I know the feeling. That's why, for the last two years, I've done all my studying in a very unusual place: the café at my local train station.

It sounds crazy, I know. It's noisy, people are always rushing past and the coffee is only average. But believe it or not, that's exactly why it works for me. The background noise is constant, so I stop noticing it after a few minutes, and nobody there knows me, so nobody interrupts me. There's also no washing-up waiting for me!

Another advantage is that I can't stay there forever. After an hour or two, I pack up and go home, so I study in short, intense sessions instead of long, unproductive ones.

If I could change one thing, it would be the chairs, which are terribly uncomfortable. But maybe that's part of the secret too: there's no way I could fall asleep!

So next time you can't concentrate, why not try somewhere completely different?`}
];

function mcList(ol,items,onDone,errFn){
  let answered=0,score=0;
  ol.innerHTML=items.map((it,i)=>`<li><div><div class="q">${esc(it[0])}</div><div class="opts">${it[1].map((o,j)=>`<button class="opt" data-i="${i}" data-j="${j}">${esc(o)}</button>`).join('')}</div><div class="expl" hidden></div></div></li>`).join('');
  ol.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i,j=+b.dataset.j,it=items[i];
    const li=ol.children[i];
    li.querySelectorAll('.opt').forEach((x,k)=>{ x.disabled=true; if(k===it[2]) x.classList.add('ok'); });
    if(j!==it[2]){ b.classList.add('no'); if(errFn){ const e=errFn(i); if(e) addErr(...e); } } else score++;
    tick();
    const ex=li.querySelector('.expl');

function addGenSet(u,set,k){

function buildSet(sec,set,letter,key,onSave,src){
  const ekey=i=>(key||('g'+hashStr(set.items[i][0])))+'-'+i;
  const prev=key&&S.ex[key];
  sec.innerHTML=`<div class="card-h"><div><span class="lab">${letter} · ${TYPE_LAB[set.t]}</span><h3>${esc(set.title)}</h3></div><span class="score">${prev?prev.s+'/'+prev.t:''}</span></div><ol class="items"></ol>
   ${set.t!=='mc'?'<div class="btnrow"><button class="btn primary" data-a="check">Check</button><button class="btn" data-a="show">Show answers</button><button class="btn" data-a="reset">Try again</button></div>':'<div class="btnrow"><button class="btn" data-a="reset">Try again</button></div>'}`;
  if(prev) showScore(sec.querySelector('.score'),prev.s,prev.t);
  const ol=sec.querySelector('.items');
  const record=(s,t)=>{ showScore(sec.querySelector('.score'),s,t); if(key){ S.ex[key]={s,t}; save(); onSave&&onSave(); } };
  sec.querySelector('[data-a="reset"]').onclick=()=>buildSet(sec,set,letter,key,onSave,src);
  if(set.t==='mc'){ mcList(ol,set.items,record,i=>{ const it=set.items[i]; return [ekey(i),'mc',{q:it[0],o:it[1],c:it[2],e:it[3]||''},src]; }); return; }
  if(set.t==='order'){ orderList(ol,set.items,sec,record,ekey,src); return; }

  ol.innerHTML=set.items.map((it,i)=>{
    if(set.t==='fill'){
      const multi=Array.isArray(it[1][0]);
      const answers=multi?it[1]:[it[1]];
      let txt=it[0], hint='';
      const m=txt.match(/\s*(\([^()]*\))\s*$/); if(m){ hint=m[1]; txt=txt.slice(0,m.index); }
      let bi=0;
      const html=esc(txt).replace(/___/g,()=>{ const a=answers[bi]||['']; const w=Math.max(4,...a.map(x=>x.length))+2; return `<input class="blank" data-b="${bi++}" style="width:${w}ch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="gap">`; });
      return `<li><div><div class="sent">${html}${hint?`<span class="hint">${esc(hint)}</span>`:''}<span class="fb"></span></div><div class="expl" hidden></div></div></li>`;
    } else {
      const html=esc(it[0]).replace(/\{([^}]*)\}/,'<span class="err">$1</span>');
      const w=Math.max(10,...it[1].map(x=>x.length))+2;
      return `<li><div><div class="sent">${html}</div><div class="fixline">Correction: <input class="blank" data-b="0" style="width:${w}ch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="correction"><span class="fb"></span></div><div class="corrected" hidden></div></div></li>`;
    }
  }).join('');

  const inputs=[...ol.querySelectorAll('.blank')];
  inputs.forEach((inp,k)=>inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){ e.preventDefault(); const li=inp.closest('li'); const idx=[...ol.children].indexOf(li);
      const rowInputs=[...li.querySelectorAll('.blank')];
      if(inp===rowInputs[rowInputs.length-1]) checkRow(idx);
      const nx=inputs[k+1]; if(nx) nx.focus(); }
  }));
  const results=new Array(set.items.length).fill(null);
  function answersOf(i){ const it=set.items[i]; if(set.t==='fix') return [it[1]]; return Array.isArray(it[1][0])?it[1]:[it[1]]; }
  function checkRow(i,reveal){
    const li=ol.children[i], it=set.items[i], ans=answersOf(i);
    let rowOk=true; const notes=[];
    li.querySelectorAll('.blank').forEach(inp=>{
      const b=+inp.dataset.b; const r=judge(inp.value,ans[b]);
      inp.classList.remove('ok','no','acc');
      if(reveal && r!=='ok'){ inp.value=ans[b][0]; inp.classList.add('acc'); rowOk=false; return; }
      inp.classList.add(r);
      if(r!=='ok') rowOk=false;
      if(r==='no') notes.push(ans[b][0]);
      if(r==='acc') notes.push('spelling: '+ans[b][0]);
    });
    const fb=li.querySelector('.fb');
    fb.innerHTML = reveal ? '' : (rowOk?'<span class="mark ok">✓</span>':`<span class="mark ${notes.every(n=>n.startsWith('spelling'))?'acc':'no'}">${esc(notes.join(' · '))}</span>`);
    if(set.t==='fill' && it[2]){ const ex=li.querySelector('.expl'); ex.textContent=it[2]; ex.hidden=false; }
    if(set.t==='fix'){ const co=li.querySelector('.corrected'); co.textContent='✓ '+it[2]; co.hidden=false; }
    const tried=[...li.querySelectorAll('.blank')].some(x=>x.value.trim());
    if(!reveal && tried && results[i]===null) tick();
    if(!reveal && tried && !rowOk) addErr(ekey(i), set.t==='fix'?'fix':'fill', set.t==='fix'?{p:it[0],a:it[1],c:it[2]}:{p:it[0],a:it[1],e:it[2]||''}, src);
    results[i]= reveal?false:rowOk;
    if(results.every(r=>r!==null) && !reveal) record(results.filter(Boolean).length,results.length);
    return rowOk;
  }
  sec.querySelector('[data-a="check"]').onclick=()=>{ set.items.forEach((_,i)=>checkRow(i)); };
  sec.querySelector('[data-a="show"]').onclick=()=>{ set.items.forEach((_,i)=>{ if(results[i]!==true) checkRow(i,true); }); };
}

let samplePromise=null;
function getSample(){
  if(!samplePromise) samplePromise = (async()=>{ try{ return (window.claude&&window.claude.use) ? await window.claude.use('sample') : null; }catch(e){ return null; } })();

}
const ERR={not_granted:'Claude is not allowed on this page yet. Allow it in the page permissions and try again.',sampling_disabled:'Claude is not available for this account.',rate_limited:'Too many requests in a row. Wait a few minutes and try again.',session_expired:'Your session has expired: sign in to Claude again.',refused:'The request was refused. Try rewording the text.',invalid_json:'The answer came back in an unexpected format. Try again.'};
const errMsg=e=>ERR[e&&e.code]||'The request could not be completed. Try again in a moment.';

async function generate(u){
  const btn=$('#genbtn'), msg=$('#genmsg');
  btn.disabled=true; msg.textContent='Writing the sentences…';
  const sample=await getSample();
  if(!sample){ msg.textContent='Generating exercises only works with this page open inside Claude.'; btn.disabled=false; return; }
  const prompt=`You are an expert English teacher. Write 6 NEW and varied gap-fill exercises on: ${u.focus}. Level ${u.lvl}.
The student is a Brazilian native speaker of Portuguese who also speaks Spanish fluently: at least 3 sentences must target typical mistakes of Portuguese/Spanish speakers on this topic.
Rules: natural, modern English (the kind heard in films and series or read in novels), ${u.band===0?'6-12 words, simple A2 vocabulary':'8-20 words'}; exactly ONE gap written "___"; after the sentence, in brackets, a hint (e.g. the base verb). "risposte" lists every acceptable correct answer (lower case, no punctuation; include contracted and full forms). "spiegazione" in ${aiLang(u)==='pt'?'Portuguese':'simple English'}, max 20 words.
Answer only with a JSON array: [{"frase":"If I ___ you, I'd take the job. (be)","risposte":["were","was"],"spiegazione":"${aiLang(u)==='pt'?'Condicional tipo 2: if + passado.':'Second conditional: if + past simple.'}"}]`;
  try{
    const data=await sample.json(prompt,{cache:false});
    const items=(Array.isArray(data)?data:[]).filter(x=>x&&typeof x.frase==='string'&&(x.frase.match(/___/g)||[]).length===1&&Array.isArray(x.risposte)&&x.risposte.length)
      .map(x=>[x.frase,x.risposte.map(String),x.spiegazione?String(x.spiegazione):'']);
    if(!items.length) throw {code:'invalid_json'};
    S.gen[u.id]=(S.gen[u.id]||[]).concat([items]).slice(-5); save();
    addGenSet(u,items,S.gen[u.id].length-1);
    msg.textContent='Done: the new set is below.';
  }catch(e){ msg.textContent=errMsg(e); }
  btn.disabled=false;
}

/* ---------- escrita ---------- */
function md(t){
  const lines=esc(t).split('\n'); let out='', list=null;
  const inline=s=>s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/~~([^~]+)~~/g,'<del>$1</del>').replace(/(^|\s)_([^_]+)_/g,'$1<i>$2</i>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>');
  const close=()=>{ if(list){ out+=`</${list}>`; list=null; } };
  lines.forEach(l=>{
    let m;
    if((m=l.match(/^#{1,4}\s+(.*)/))){ close(); out+=`<h4>${inline(m[1])}</h4>`; }
    else if((m=l.match(/^\s*[-*•]\s+(.*)/))){ if(list!=='ul'){close(); out+='<ul>'; list='ul';} out+=`<li>${inline(m[1])}</li>`; }
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=='ol'){close(); out+='<ol>'; list='ol';} out+=`<li>${inline(m[1])}</li>`; }
    else if(l.trim()===''){ close(); }
    else { close(); out+=`<p>${inline(l)}</p>`; }
  });
  close(); return out;
}
function aiLang(u){ if(S.aiLang==='pt'||S.aiLang==='en') return S.aiLang; return (u&&u.band===0)?'pt':'en'; }
function corrPrompt(u,text){

Grammar focus of the unit: ${u.focus}.
Task: ${u.write.task}
`;
  const body = aiLang(u)==='pt' ? `
Answer IN PORTUGUESE (examples in English), with exactly these markdown sections:
## Avaliação geral
Nível CEFR estimado do texto e uma nota de 0 a 5 em cada critério do Cambridge (Content, Communicative achievement, Organisation, Language), 2-3 frases sobre pontos fortes e fracos, e se a tarefa e as estruturas da unidade foram usadas.
## Erros
Lista com cada erro no formato: ~~errado~~ → **certo**: explicação curta. Marque [PT] ou [ES] quando for interferência dessas línguas. Agrupe por tipo (gramática, vocabulário, ortografia, pontuação).
## Texto corrigido

Answer IN ENGLISH, in clear sentences suited to level ${lvl} (if an explanation is hard, you may add a Portuguese word in brackets), with exactly these markdown sections:

Estimated CEFR level, a 0-5 mark for each Cambridge criterion (Content, Communicative achievement, Organisation, Language), 2-3 sentences on strengths and weaknesses, and whether the task and the unit's structures were used.

3 more natural expressions, collocations or phrasal verbs, with the original passage and the improved version.
## Your personal exercise
3 gap-fill sentences based on her mistakes (with ___) and the answers at the end.
`;
  return head+body+`
STUDENT'S TEXT:
"""
${text}
"""`;

const canon=s=>norm(s).replace(/[.,!?;:«»"—–-]/g,' ').replace(/\s+/g,' ').trim();
function shuffleTokens(toks){ let s; let n=0; do{ s=shuffle(toks); n++; }while(n<8 && s.join(' ')===toks.join(' ')); return s; }
function makeOrder(box,item){
  const sentence=item[0], alts=item[1]||[];
  const toks=sentence.split(' ');
  box.innerHTML=`<div class="build" aria-label="your sentence"><span class="ph">Tap the words in the right order</span></div><div class="pool"></div><div class="fb"></div>`;
  const build=box.querySelector('.build'), pool=box.querySelector('.pool');
  shuffleTokens(toks).forEach(t=>{ const b=document.createElement('button'); b.className='tok'; b.type='button'; b.textContent=t; pool.appendChild(b); });
  const ph=build.querySelector('.ph');
  box.addEventListener('click',e=>{
    const b=e.target.closest('.tok'); if(!b||box.dataset.locked) return;
    (b.parentElement===pool?build:pool).appendChild(b);
    ph.hidden=build.querySelectorAll('.tok').length>0;
  });
  return {
    check(){
      const built=[...build.querySelectorAll('.tok')].map(x=>x.textContent).join(' ');
      const fb=box.querySelector('.fb');
      if(pool.children.length){ fb.innerHTML='<span class="mark no">some words are missing</span>'; return false; }
      const ok=[sentence,...alts].some(a=>canon(a)===canon(built));
      fb.innerHTML= ok?'<span class="mark ok">✓ perfect</span>':`<span class="mark no">✗</span> <span class="corrected">${esc(sentence)}</span>`;
      build.classList.toggle('ok',ok); build.classList.toggle('no',!ok);
      return ok;
    },
    incomplete(){ return pool.children.length>0; },
    reveal(){ box.dataset.locked='1'; box.querySelector('.fb').innerHTML=`<span class="corrected">${esc(sentence)}</span>`; }
  };
}
function orderList(ol,items,sec,record,ekey,src){

  sec.querySelector('[data-a="check"]').onclick=()=>{ const r=ctrls.map((c,i)=>{ const ok=c.check(); const complete=!c.incomplete(); if(complete&&!done[i]){ done[i]=true; tick(); } if(complete&&!ok&&ekey) addErr(ekey(i),'order',{s:items[i][0],al:items[i][1]||[]},src); return ok; }); record(r.filter(Boolean).length,r.length); };

/* ---------- utilità ---------- */
function hashStr(t){ let h=5381; t=String(t); for(let i=0;i<t.length;i++) h=((h<<5)+h+t.charCodeAt(i))|0; return (h>>>0).toString(36); }
let toastT;
function toast(msg){ const t=$('#toast'); if(!t) return; t.innerHTML=msg; t.hidden=false; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>{ t.hidden=true; },300); },3200); }

/* ---------- ritmo quotidiano ---------- */
const dayKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=n=>{ const d=new Date(); d.setDate(d.getDate()+n); return dayKey(d); };
const todayN=()=>S.days[dayKey()]||0;
function tick(n=1){
  const k=dayKey(); S.days[k]=(S.days[k]||0)+n; save();
  updRhythm();
}

function streaks(){
  const met=k=>(S.days[k]||0)>0;
  let cur=0; const d=new Date(); if(!met(dayKey(d))) d.setDate(d.getDate()-1);
  while(met(dayKey(d))){ cur++; d.setDate(d.getDate()-1); }
  const keys=Object.keys(S.days).filter(met).sort(); let best=0,run=0,prev=null;
  keys.forEach(k=>{ if(prev){ const p=new Date(prev+'T12:00:00'); p.setDate(p.getDate()+1); run= dayKey(p)===k? run+1 : 1; } else run=1; best=Math.max(best,run); prev=k; });
  return {cur, best:Math.max(best,cur), total:keys.length};
}

function todaySess(){
  const p=planStatus(); if(p.nextIdx<0) return null;
  const i = p.todayIdx>=0 ? p.todayIdx : p.nextIdx; const s=p.ss[i];
  const n=s.tasks.filter((_,j)=>taskDone(s,j)).length;
  return {s,n,tot:s.tasks.length,isToday:p.todayIdx===i,late:p.late};
}
function rhythmText(){
  const t=todaySess(), st=streaks();
  if(!t) return {top:'Plan complete!',sub:'',pct:100,mini:'✓',met:true};
  const short=t.s.label.replace(/ of \d+$/,'');
  const met=t.n===t.tot;
  return {top:met&&t.isToday?'Today ✓':(t.isToday?'Today':'Next'), sub:`${short} · ${t.n} of ${t.tot} tasks`, pct:Math.round(100*t.n/t.tot), mini:met&&t.isToday?'✓':`${t.n}/${t.tot}`, met:met&&t.isToday, streak:st.cur};
}

function heatmap(){
  const end=new Date(); const start=new Date(); start.setDate(start.getDate()-7*17+1);
  while(start.getDay()!==1) start.setDate(start.getDate()-1);
  let cells=''; const d=new Date(start); const months=[];
  let col=0;
  while(d<=end){
    if(d.getDay()===1){ col++; if(d.getDate()<=7) months.push([col,d.toLocaleDateString('en-GB',{month:'short'})]); }
    const k=dayKey(d), n=S.days[k]||0, r=n/S.goal;
    const lv = n===0?0 : r<.34?1 : r<.67?2 : r<1?3 : 4;
    cells+=`<i class="hm l${lv}" style="grid-column:${col};grid-row:${((d.getDay()+6)%7)+1}" title="${d.toLocaleDateString('en-GB',{day:'numeric',month:'long'})}: ${n} points"></i>`;
    d.setDate(d.getDate()+1);
  }
  return `<div class="hmwrap"><div class="hmmonths" style="grid-template-columns:repeat(${col},14px)">${months.map(([c,m])=>`<span style="grid-column:${c}">${m}</span>`).join('')}</div><div class="hmgrid" style="grid-template-columns:repeat(${col},14px)">${cells}</div>
   <div class="hmleg"><span>less</span><i class="hm l0"></i><i class="hm l1"></i><i class="hm l2"></i><i class="hm l3"></i><i class="hm l4"></i><span>goal reached</span></div></div>`;
}

const INT=[1,3,7,15];
const BOXLAB=['in 1 day','in 3 days','in 7 days','in 15 days'];
function addErr(key,k,d,src){
  if(!key) return;
  const e=S.err[key];
  S.err[key]={k,d,src:src||(e&&e.src)||'',b:0,due:addDays(1),u:Date.now(),w:((e&&e.w)||0)+1};
  const ks=Object.keys(S.err); if(ks.length>600) ks.sort((a,b)=>S.err[a].u-S.err[b].u).slice(0,ks.length-600).forEach(x=>delErr(x));
  save(); refreshErrBadge();
}
function delErr(key){ if(!S.err[key]) return; delete S.err[key]; S.errDel[key]=Date.now(); }
function removeErr(key){ if(key&&S.err[key]){ delErr(key); save(); refreshErrBadge(); } }
function errDue(){ const t=dayKey(); return Object.keys(S.err).filter(k=>S.err[k].due<=t); }
function refreshErrBadge(){ const r=route(); if(r.type!=='unit') return; renderNav(r); }
function reviewResult(key,ok){
  const e=S.err[key]; if(!e) return;
  if(ok){ if(e.b>=3){ delErr(key); S.mastered=(S.mastered||0)+1; } else { e.b++; e.due=addDays(INT[e.b]); e.u=Date.now(); } }
  else { e.b=0; e.due=addDays(1); e.u=Date.now(); e.w=(e.w||0)+1; }
  save();
}
function errLabel(e){
  const d=e.d;
  switch(e.k){
    case 'fill': case 'fix': return d.p.replace(/[{}]/g,'');
    case 'mc': return d.q;
    case 'order': return d.s;
    case 'verb': return `Irregular verb: ${d.v}`;
    case 'lab': return d.q;
    case 'falso': return `False friend: ${d.w}`;
    case 'dict': return `Dictation: ${d.s}`;
    case 'myvoc': { const w=S.myvoc[d.k]; return w?`My words: ${w.it}`:'My words'; }
    case 'vocab': { const w=LESSICO[d.t]&&LESSICO[d.t].w[d.i]; return w?`Vocabulary: ${w[0]}`:'Vocabulary'; }
  }
  return '';
}

function startReview(keys){
  rvQueue=shuffle(keys); rvPos=0; rvOk=0;
  const c=$('#rvcard'); c.hidden=false; c.scrollIntoView({block:'start',behavior:'smooth'});
  nextReview();
}
function nextReview(){
  const c=$('#rvcard');
  if(rvPos>=rvQueue.length){
    c.innerHTML=`<div class="drill"><div class="pen" style="font-size:40px">Done!</div><p class="lead" style="margin:10px auto">${rvOk} right out of ${rvQueue.length}. Right answers move up a box; wrong ones come back tomorrow.</p><div class="btnrow" style="justify-content:center"><button class="btn primary" id="rvback">Back to the notebook</button></div></div>`;
    $('#rvback').onclick=()=>{ renderNav(route()); renderRipasso(); };
    return;
  }
  const key=rvQueue[rvPos], e=S.err[key];
  if(!e){ rvPos++; return nextReview(); }
  c.innerHTML=`<div class="card-h"><span class="lab">${esc(e.src)} · box ${e.b+1}</span><span class="note">${rvPos+1} / ${rvQueue.length}</span></div><div id="rvbody"></div><div class="fb" id="rvfb"></div><div class="btnrow" style="margin-top:14px"><button class="btn primary" id="rvcheck">Check</button><button class="btn" id="rvnext" hidden>Next →</button></div>`;
  let answered=false;
  const finish=(ok,html)=>{
    if(answered) return; answered=true;
    reviewResult(key,ok); tick(); if(ok) rvOk++;
    $('#rvfb').innerHTML=(ok?'<span class="mark ok">Right! ✓</span>':'<span class="mark no">Not yet…</span>')+(html||'');
    $('#rvcheck').hidden=true; const nx=$('#rvnext'); nx.hidden=false; nx.focus();
  };
  $('#rvnext').onclick=()=>{ rvPos++; nextReview(); };
  reviewCard($('#rvbody'),e,finish);
}
function reviewCard(box,e,finish){
  if(reviewExtra(box,e,finish)) return;
  const d=e.d, chk=$('#rvcheck');
  const enterTo=(el,fn)=>el.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&!ev.shiftKey){ ev.preventDefault(); if(!$('#rvnext').hidden) $('#rvnext').click(); else fn(); } });
  if(e.k==='fill'){
    const multi=Array.isArray(d.a[0]); const answers=multi?d.a:[d.a];
    let txt=d.p, hint=''; const m=txt.match(/\s*(\([^()]*\))\s*$/); if(m){ hint=m[1]; txt=txt.slice(0,m.index); }
    let bi=0; box.innerHTML=`<div class="sent rvsent">${esc(txt).replace(/___/g,()=>{ const a=answers[bi]||['']; const w=Math.max(4,...a.map(x=>x.length))+2; return `<input class="blank" data-b="${bi++}" style="width:${w}ch" autocomplete="off" autocapitalize="off" spellcheck="false">`; })}${hint?`<span class="hint">${esc(hint)}</span>`:''}</div>`;
    const ins=[...box.querySelectorAll('.blank')]; ins[0]&&ins[0].focus({preventScroll:true});
    const go=()=>{ let ok=true; ins.forEach(inp=>{ const r=judge(inp.value,answers[+inp.dataset.b]); inp.classList.add(r); if(r==='no') ok=false; }); finish(ok, `<p class="corrected">${esc(answers.map(a=>a[0]).join(' · '))}</p>${d.e?`<p class="expl">${esc(d.e)}</p>`:''}`); };
    ins.forEach(i=>enterTo(i,go)); chk.onclick=go;
  } else if(e.k==='fix'){
    box.innerHTML=`<div class="sent rvsent">${esc(d.p).replace(/\{([^}]*)\}/,'<span class="err">$1</span>')}</div><div class="fixline">Correction: <input class="blank" style="width:${Math.max(12,...d.a.map(x=>x.length))+2}ch" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`;
    const inp=box.querySelector('.blank'); inp.focus({preventScroll:true});
    const go=()=>{ const r=judge(inp.value,d.a); inp.classList.add(r); finish(r!=='no',`<p class="corrected">✓ ${esc(d.c)}</p>`); };
    enterTo(inp,go); chk.onclick=go;
  } else if(e.k==='mc' || e.k==='falso' || e.k==='vocab'){
    let q,o,c,ex='';
    if(e.k==='mc'){ q=d.q; o=d.o; c=d.c; ex=d.e; }
    else if(e.k==='falso'){ const f=FALSI.find(x=>x[0]===d.w)||FALSI[0]; o=shuffle([f[1],...shuffle(FALSI.filter(x=>x!==f)).slice(0,3).map(x=>x[1])]); q=`What does «${f[0]}» mean?`; c=o.indexOf(f[1]); ex=`Careful: ${f[2]}. E.g. ${f[3]}`; }
    else { const th=LESSICO[d.t], w=th.w[d.i]; o=shuffle([w[0],...shuffle(th.w.filter(x=>x!==w)).slice(0,3).map(x=>x[0])]); q=`How do you say «${w[1]}» in English?`; c=o.indexOf(w[0]); ex=w[2]; }
    box.innerHTML=`<div class="q rvsent">${esc(q)}</div><div class="opts">${o.map((x,j)=>`<button class="opt" data-j="${j}">${esc(x)}</button>`).join('')}</div>`;
    chk.hidden=true;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const j=+b.dataset.j; box.querySelectorAll('.opt').forEach((x,k)=>{ x.disabled=true; if(k===c) x.classList.add('ok'); }); if(j!==c) b.classList.add('no'); finish(j===c, ex?`<p class="expl">${esc(ex)}</p>`:''); });
  } else if(e.k==='order'){
    const ctl=makeOrder(box,[d.s,d.al||[]]); box.querySelector('.ordbox')||box.classList.add('ordbox');
    chk.onclick=()=>{ const ok=ctl.check(); if(ctl.incomplete()) return; finish(ok,''); };
  } else if(e.k==='verb'){
    const V=VERBI[d.v]||{p:'',pp:'',pt:''};
    box.innerHTML=`<div class="drill" style="padding:6px 0"><div class="verb" style="font-size:40px">to ${d.v}</div><div class="note">${esc(V.pt||'')}</div><div class="vpair"><label><span class="lab">past simple</span><input id="rvin" autocomplete="off" autocapitalize="off" spellcheck="false"></label><label><span class="lab">past participle</span><input id="rvin2" autocomplete="off" autocapitalize="off" spellcheck="false"></label></div></div>`;
    const inp=$('#rvin'), inp2=$('#rvin2'); inp.focus({preventScroll:true});
    inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); inp2.focus(); } });
    const go=()=>{ if(!inp.value.trim()) return; const ok=judge(inp.value,[V.p])!=='no'&&judge(inp2.value,[V.pp])!=='no'; finish(ok,`<p class="corrected">${esc(d.v)} · ${esc(V.p)} · ${esc(V.pp)}</p>`); };
    enterTo(inp2,go); chk.onclick=go;
  } else if(e.k==='lab'){
    box.innerHTML=`<span class="lab note">${esc(d.s)}</span><p class="labq">${esc(d.q)}</p><textarea class="labin" rows="2" id="rvin" spellcheck="false" autocapitalize="off"></textarea>`;
    const inp=$('#rvin'); inp.focus({preventScroll:true});
    const strip2=x=>canon(x).normalize('NFD').replace(/[̀-ͯ]/g,'');
    const go=()=>{ if(!inp.value.trim()) return; const ok=d.a.some(a=>strip2(a)===strip2(inp.value)); finish(ok,`<div class="sols"><span class="note">Answers:</span><ul>${d.a.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>${d.n?`<p class="expl">${esc(d.n)}</p>`:''}`); };
    enterTo(inp,go); chk.onclick=go;
  }
}

let testTimer=null, testState=null;
function stopTestTimer(){ if(testTimer){ clearInterval(testTimer); testTimer=null; } }

  $('#main').innerHTML=`<header class="uhead"><div class="eyebrow">Test · ${T.range?"Warm-up ":"units "}${tRange(T)} · level ${T.lvl}</div><h1 class="title">${T.title}</h1>
   <p class="subtitle">A test in the style of the Cambridge Reading and Use of English paper: reading, open cloze and grammar. 30 minutes, no hints, 20 points. Pass with 12; 17 or more is a pass «with distinction».</p></header>
   <div id="tbody"></div>`;
  if(testState&&testState.id===id&&testState.result) return showTestResult(T);

   <ul class="dots"><li><b>Part A · Reading</b>: a text and 5 questions (5 points).</li><li><b>Part B · Open cloze</b>: 8 gaps, one word each (8 points). Spelling counts.</li><li><b>Part C · Grammar and vocabulary</b>: 7 multiple-choice questions (7 points).</li></ul>
   <p>The clock starts when you press «Start». When time is up, the test hands itself in. Do not leave the page during the test or you will have to start again. Your mistakes go to the mistakes notebook.</p>

  $('#tstart').onclick=()=>startTest(T);
  const cb=$('#tcert'); if(cb) cb.onclick=()=>{ $('#certbox').innerHTML=certHTML(T,S.tests[id]); bindCert(T); };
}
function startTest(T){
  testState={id:T.id,end:Date.now()+30*60000,ans:{read:[],mc:[]},result:null};
  const R=T.reading;
  let bi=0;
  const cloze=esc(T.cloze.text).replace(/\[(\d)\]\s*(\([^)]*\))?/g,(m,n,h)=>`<span class="tblank"><sup>${n}</sup><input class="blank" data-c="${+n-1}" style="width:${Math.max(6,...T.cloze.a[+n-1].map(x=>x.length))+2}ch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="gap ${n}">${h?`<span class="hint">${h}</span>`:''}</span>`);
  $('#tbody').innerHTML=`<div class="timer" id="timer"><span>Time left <b id="tleft">30:00</b></span><button class="btn primary" id="tsend">Hand in</button></div>
   <section class="card"><div class="card-h"><div><span class="lab">Part A · 5 points</span><h3>Reading: ${esc(R.title)}</h3></div></div><article class="reading" style="font-size:17px">${R.text}</article>
    <ol class="items">${R.q.map((q,i)=>`<li><div><div class="q">${esc(q[0])}</div><div class="opts" data-g="read" data-i="${i}">${q[1].map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join('')}</div></div></li>`).join('')}</ol></section>
   <section class="card"><div class="card-h"><div><span class="lab">Part B · 8 points</span><h3>Open cloze: ${esc(T.cloze.title)}</h3></div></div><p class="sent cloze">${cloze}</p></section>
   <section class="card"><div class="card-h"><div><span class="lab">Part C · 7 points</span><h3>Grammar and vocabulary</h3></div></div>
    <ol class="items">${T.mc.map((q,i)=>`<li><div><div class="q">${esc(q[0])}</div><div class="opts" data-g="mc" data-i="${i}">${q[1].map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join('')}</div></div></li>`).join('')}</ol></section>
   <div class="btnrow" style="justify-content:flex-end"><button class="btn primary" id="tsend2">Hand in the test</button></div>`;
  $('#tbody').querySelectorAll('.opts').forEach(g=>g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ g.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); testState.ans[g.dataset.g][+g.dataset.i]=+b.dataset.j; }));
  $('#tsend').onclick=$('#tsend2').onclick=()=>gradeTest(T);
  stopTestTimer();
  const upd=()=>{ const left=Math.max(0,testState.end-Date.now()); const m=Math.floor(left/60000), s=Math.floor(left%60000/1000); const el=$('#tleft'); if(!el){ stopTestTimer(); return; } el.textContent=`${m}:${String(s).padStart(2,'0')}`; $('#timer').classList.toggle('low',left<5*60000); if(left<=0){ stopTestTimer(); gradeTest(T); } };
  upd(); testTimer=setInterval(upd,1000);
  window.scrollTo(0,0);
}
function gradeTest(T){
  if(!testState||testState.result) return;
  stopTestTimer();
  const src=`${T.title}`;
  const read=T.reading.q.map((q,i)=>{ const ok=testState.ans.read[i]===q[2]; if(!ok) addErr(`t${T.id}-r-${i}`,'mc',{q:q[0],o:q[1],c:q[2],e:''},src+' · reading'); return ok; });
  const clozeVals=[...$('#tbody').querySelectorAll('[data-c]')].sort((a,b)=>a.dataset.c-b.dataset.c).map(x=>x.value);
  const cloze=T.cloze.a.map((a,i)=>{ const ok=judge(clozeVals[i]||'',a)==='ok'; if(!ok) addErr(`t${T.id}-c-${i}`,'fill',{p:clozeSentence(T,i),a:a,e:''},src+' · open cloze'); return ok; });
  const mc=T.mc.map((q,i)=>{ const ok=testState.ans.mc[i]===q[2]; if(!ok) addErr(`t${T.id}-m-${i}`,'mc',{q:q[0],o:q[1],c:q[2],e:''},src+' · grammar'); return ok; });
  const score=[...read,...cloze,...mc].filter(Boolean).length;
  const passed=score>=12;
  const prev=S.tests[T.id]||{};
  S.tests[T.id]={best:Math.max(prev.best||0,score),last:score,date:Date.now(),passed:prev.passed||passed,pdate:prev.passed?prev.pdate:(passed?Date.now():null),dist:(prev.dist||score>=17)};
  tick(20);
  save();
  testState.result={score,read,cloze,mc,clozeVals,passed};
  renderNav(route());
  showTestResult(T);
}
function clozeSentence(T,i){
  const plain=T.cloze.text.replace(/\[(\d)\]\s*(\([^)]*\))?/g,(m,n,h)=>+n-1===i?`___ ${h||''}`:T.cloze.a[+n-1][0]);
  const parts=plain.split(/(?<=[.!?»])\s+/); const p=parts.find(x=>x.includes('___'))||plain;
  const hm=p.match(/___ (\([^)]*\))/); return (hm? p.replace(hm[0],'___')+' '+hm[1] : p).trim();
}

let syncSt='local', dbRefs=null, pushing=false, pushAgain=false, pushT=null, lastPush=['',''];
function syncText(){ return {local:'○ Progress saved on this device only',sync:'◌ Syncing…',ok:'● Progress synced to your account',err:'○ Sync failed: trying again at the next save',full:'○ Storage full: progress stays on this device'}[syncSt]; }
function setSync(st){ syncSt=st; const el=$('#syncline'); if(el){ el.textContent=syncText(); el.className='syncline '+st; } }
function splitState(){ const o=JSON.parse(JSON.stringify(S)); const texts={write:o.write,corr:o.corr,gen:o.gen,examGen:o.examGen,wexam:o.wexam}; delete o.write; delete o.corr; delete o.gen; delete o.examGen; delete o.wexam; return [JSON.stringify(o),JSON.stringify(texts)]; }
function schedulePush(){ if(!dbRefs) return; clearTimeout(pushT); pushT=setTimeout(push,2500); }
async function push(){
  if(!dbRefs) return; if(pushing){ pushAgain=true; return; }
  pushing=true;
  try{
    const [c,t]=splitState();
    if(c!==lastPush[0]){ await dbRefs.core.set({json:c,at:S.at||0}); lastPush[0]=c; }
    if(t!==lastPush[1]){ await dbRefs.texts.set({json:t,at:S.at||0}); lastPush[1]=t; }
    setSync('ok');
  }catch(e){ setSync(e&&e.code==='quota_exceeded'?'full':'err'); }
  pushing=false;
  if(pushAgain){ pushAgain=false; push(); }
}
function mergeState(a,b){
  const [n,o]=(a.at||0)>=(b.at||0)?[a,b]:[b,a];
  const r=JSON.parse(JSON.stringify(n)), O=JSON.parse(JSON.stringify(o));
  ['ex','read','corr','gen','lesson','voc','tab','cult','spk','myvoc','orale','wpm','asc','exam','examGen','plan','books','wexam','vsr'].forEach(f=>{ r[f]=Object.assign({},O[f]||{},r[f]||{}); });
  r.write=Object.assign({},O.write||{},r.write||{});
  Object.keys(O.write||{}).forEach(k=>{ if(O.write[k]&&O.write[k].done&&r.write[k]) r.write[k].done=true; });
  r.days=Object.assign({},O.days||{}); Object.entries(n.days||{}).forEach(([k,v])=>{ r.days[k]=Math.max(v,r.days[k]||0); });
  r.errDel=Object.assign({},O.errDel||{}); Object.entries(n.errDel||{}).forEach(([k,v])=>{ r.errDel[k]=Math.max(v,r.errDel[k]||0); });
  r.err=Object.assign({},O.err||{}); Object.entries(n.err||{}).forEach(([k,v])=>{ if(!r.err[k]||v.u>=r.err[k].u) r.err[k]=v; });
  Object.keys(r.err).forEach(k=>{ if(r.errDel[k]&&r.err[k].u<=r.errDel[k]) delete r.err[k]; });
  const cut=Date.now()-60*864e5; Object.keys(r.errDel).forEach(k=>{ if(r.errDel[k]<cut) delete r.errDel[k]; });
  r.log=Object.assign({},O.log||{}); Object.entries(n.log||{}).forEach(([k,v])=>{ if(!r.log[k]||v.length>=r.log[k].length) r.log[k]=v; });
  r.mastered=Math.max(n.mastered||0,o.mastered||0);
  ['verbi','falsi'].forEach(f=>{ r[f]=r[f]||{}; const x=O[f]||{}; ['ok','tot','best'].forEach(z=>{ r[f][z]=Math.max(r[f][z]||0,x[z]||0); }); });
  r.lab=r.lab||{}; Object.keys(O.lab||{}).forEach(m=>{ r.lab[m]=r.lab[m]||{ok:0,tot:0}; r.lab[m].ok=Math.max(r.lab[m].ok,O.lab[m].ok||0); r.lab[m].tot=Math.max(r.lab[m].tot,O.lab[m].tot||0); });
  r.tests=Object.assign({},O.tests||{}); Object.entries(n.tests||{}).forEach(([k,v])=>{ const p=r.tests[k]; r.tests[k]=!p?v:{...v,best:Math.max(v.best||0,p.best||0),passed:!!(v.passed||p.passed),pdate:v.pdate||p.pdate,dist:!!(v.dist||p.dist)}; });
  r.plan=Object.assign({},(O.plan||{}),(n.plan||{})); r.plan.tick=Object.assign({},(O.plan&&O.plan.tick)||{},(n.plan&&n.plan.tick)||{});
  r.vsr=Object.assign({},O.vsr||{}); Object.entries(n.vsr||{}).forEach(([k,v])=>{ if(!r.vsr[k]||(v.u||0)>=(r.vsr[k].u||0)) r.vsr[k]=v; });
  r.name=n.name||o.name; r.at=Math.max(a.at||0,b.at||0);
  return r;
}
async function pullMerge(){
  const [a,b]=await Promise.all([dbRefs.core.get(),dbRefs.texts.get()]);
  if(a.exists){
    let remote=null;
    try{ remote=JSON.parse(a.data().json); if(b.exists) Object.assign(remote,JSON.parse(b.data().json)); }catch(e){ remote=null; }
    if(remote){
      const before=JSON.stringify(S);
      const merged=mergeState(S,remote);
      Object.keys(S).forEach(k=>delete S[k]); Object.assign(S,merged); ensureDefaults();
      try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
      if(JSON.stringify(S)!==before){ const r=route(); renderNav(r); if(r.type==='home') renderHome(); else if(r.type==='ripasso') renderRipasso(); }
    }
  }
  await push();
}
async function initSync(){
  if(!window.claude||!window.claude.use){ setSync('local'); return; }
  setSync('sync');
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const uid=user? await user.id() : null;
    if(!db||!uid){ setSync('local'); return; }
    const col=db.collection('data/users/'+uid);
    dbRefs={core:col.doc('english'),texts:col.doc('english-texts')};
    await pullMerge();
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && dbRefs) pullMerge().catch(()=>{}); });
  }catch(e){ dbRefs=null; setSync('local'); }
}

/* ---------- ascolta (sintesi vocale del browser) ---------- */
const canSpeak = (()=>{ try{ return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined'; }catch(e){ return false; } })();
let speakingId=null;
function speakBtnHTML(id){ return canSpeak?`<button class="btn speak" id="${id}" type="button" aria-pressed="false">▶ Listen</button>`:''; }
function textOf(el,skip){ if(!el) return ''; const c=el.cloneNode(true); c.querySelectorAll(skip||'.speak').forEach(x=>x.remove()); c.querySelectorAll('p,li,h2,h3').forEach(x=>x.append('. ')); return c.textContent.replace(/\s+/g,' ').replace(/(\.\s*){2,}/g,'. ').trim(); }
const accLang=()=>S.accent==='GB'?'en-GB':'en-US';
function enVoices(){ try{ const re=S.accent==='GB'?/^en[-_]GB/i:/^en[-_]US/i; const vs=speechSynthesis.getVoices().filter(v=>re.test(v.lang)); const first=itVoice(); return first?[first,...vs.filter(v=>v!==first)]:vs; }catch(e){ return []; } }
function itVoice(){ try{ const vs=speechSynthesis.getVoices(); const re=S.accent==='GB'?/^en[-_]GB/i:/^en[-_]US/i; const good=v=>/natural|neural|premium|enhanced|google|samantha|daniel|serena|ava|zoe|aria|jenny|libby|sonia|ryan/i.test(v.name); const loc=vs.filter(v=>re.test(v.lang)); return loc.find(good)||loc[0]||vs.find(v=>/^en/i.test(v.lang))||null; }catch(e){ return null; } }
function stopSpeak(){ try{ if(canSpeak) speechSynthesis.cancel(); }catch(e){} if(speakingId){ const b=document.getElementById(speakingId); if(b){ b.textContent=b.dataset.label||'▶ Listen'; b.setAttribute('aria-pressed','false'); } } speakingId=null; }
function speak(text,id,rate){
  if(!canSpeak||!text) return;
  stopSpeak();
  try{
    const parts=text.match(/[^.!?»]+[.!?»]*/g)||[text];
    const v=itVoice();
    speakingId=id||null;
    parts.forEach((p,i)=>{ const u=new SpeechSynthesisUtterance(p.trim()); u.lang=accLang(); if(v) u.voice=v; u.rate=rate||S.rate||0.95; if(i===parts.length-1) u.onend=()=>{ if(speakingId===id) stopSpeak(); }; speechSynthesis.speak(u); });
    if(id){ const b=document.getElementById(id); if(b){ b.textContent='■ Stop'; b.setAttribute('aria-pressed','true'); } }
  }catch(e){ stopSpeak(); }
}
function bindSpeak(id,getText){ const b=document.getElementById(id); if(!b) return; b.onclick=()=>{ if(speakingId===id) stopSpeak(); else speak(getText(),id); }; }

const LVLS=['A1','A2','B1','B2','C1'];
function rateSel(){ const r=S.rate||0.95, a=S.accent==='GB'?'GB':'US'; return `<div class="rate" role="group" aria-label="Voice"><span class="note">Voice:</span>${[[0.7,'slow'],[0.95,'normal'],[1.15,'fast']].map(([v,l])=>`<button type="button" data-rate="${v}" aria-pressed="${Math.abs(r-v)<.01}">${l}</button>`).join('')}<span class="note" style="margin-left:6px">Accent:</span>${[['US','American'],['GB','British']].map(([v,l])=>`<button type="button" data-acc="${v}" aria-pressed="${a===v}">${l}</button>`).join('')}</div>`; }
function bindRate(root){ (root||document).querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{ S.rate=+b.dataset.rate; save(); document.querySelectorAll('[data-rate]').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.rate===S.rate)); });
  (root||document).querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{ S.accent=b.dataset.acc; save(); document.querySelectorAll('[data-acc]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.acc===S.accent)); speakSeq([{text:S.accent==='GB'?'Right, this is the British voice.':'Okay, this is the American voice.'}]); }); }
function voiceNote(){
  if(!canSpeak) return `<p class="callout small">This browser has no speech synthesis, so the listening exercises show the text instead. Try another browser or your phone.</p>`;
  return `<p class="note voicenote">The voice is the one installed on your device. For a more natural voice, install an «enhanced» or «natural» English voice (US and UK) in your system's speech or accessibility settings and reload the page. Real films are faster: use «fast» when «normal» feels easy.</p>`;
}
function speakSeq(parts,id,opts){
  opts=opts||{};
  if(!canSpeak||!parts.length) return false;
  stopSpeak();
  try{
    const v=itVoice(), key=id||'_seq'; speakingId=key;
    parts.forEach((p,i)=>{
      const u=new SpeechSynthesisUtterance(p.text); u.lang=accLang(); const vv=(p.vi!=null&&enVoices()[p.vi])||v; if(vv) u.voice=vv; u.rate=opts.rate||S.rate||0.95; u.pitch=p.pitch||1;
      if(p.onstart) u.onstart=p.onstart;
      if(i===parts.length-1) u.onend=()=>{ if(speakingId===key){ stopSpeak(); opts.onend&&opts.onend(); } };
      speechSynthesis.speak(u);
    });
    if(id){ const b=document.getElementById(id); if(b){ b.dataset.label=b.dataset.label||b.textContent; b.textContent='■ Stop'; b.setAttribute('aria-pressed','true'); } }
    return true;
  }catch(e){ stopSpeak(); return false; }
}
const plain=t=>String(t).replace(/\[\[([^|\]]+)\|[^\]]+\]\]/g,'$1');
function sentencesOf(raw){ return (plain(raw).replace(/\n+/g,' ').match(/[^.!?…]+[.!?…»"]*\s*/g)||[]).map(s=>s.trim()).filter(s=>s.length>1); }
function wordsOf(t){ return plain(t).split(/\s+/).filter(w=>/[a-z]/i.test(w)).length; }

/* blocco «leggi ad alta voce»: frasi cliccabili, shadowing, cronometro */
function readAloudBlock(raw,key,{withTitle}={}){
  const paras=String(raw).split(/\n\s*\n/);
  let si=0;
  const html=paras.map(p=>{ const lines=p.split('\n'); return `<p>${lines.map(line=>{ const ss=(line.match(/[^.!?…]+[.!?…»"]*\s*/g)||[line]).filter(x=>x.trim()); return ss.map(s=>`<span class="snt" data-s="${si++}" tabindex="0" role="button">${gloss(esc(s.trim()).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'[[$1|$2]]'))}</span>`).join(' '); }).join('<br>')}</p>`; }).join('');
  return `<div class="ra" data-key="${esc(key)}">
    <div class="btnrow ractl">${canSpeak?`<button class="btn" type="button" data-act="all" id="ra-all-${esc(key)}">▶ Listen to it all</button><button class="btn" type="button" data-act="shadow" id="ra-sh-${esc(key)}">⟲ Shadowing</button>`:''}<button class="btn" type="button" data-act="timer">⏱ Time your reading</button>${rateSel()}</div>
    <p class="note">${canSpeak?'Tap a sentence to hear it. In <b>shadowing</b> the voice reads a sentence, then pauses: say it aloud, copying the rhythm and the linking between words.':''} The timer measures your reading in words per minute.</p>
    <div class="ratext reading">${html}</div>
    <div class="ratimer" hidden><b class="big" data-t>0:00</b><button class="btn primary" type="button" data-act="stop">I'm done</button></div>
    <div class="rawpm"></div></div>`;
}
function bindReadAloud(root,raw,key){
  const box=root.querySelector(`.ra[data-key="${key}"]`); if(!box) return;
  bindRate(box);
  const spans=[...box.querySelectorAll('.snt')], texts=spans.map(s=>s.textContent.trim());
  const clear=()=>spans.forEach(s=>s.classList.remove('on'));
  spans.forEach((s,i)=>{ const go=()=>{ clear(); s.classList.add('on'); speakSeq([{text:texts[i]}],null,{onend:clear}); }; s.onclick=go; s.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } }; });
  const all=box.querySelector('[data-act="all"]'); if(all) all.onclick=()=>{ if(speakingId===all.id){ stopSpeak(); clear(); return; } speakSeq(texts.map((t,i)=>({text:t,onstart:()=>{ clear(); spans[i].classList.add('on'); }})),all.id,{onend:clear}); };
  const sh=box.querySelector('[data-act="shadow"]');
  if(sh){ let tmr=null, active=false;
    const end=()=>{ active=false; clearTimeout(tmr); clear(); sh.textContent='⟲ Shadowing'; sh.setAttribute('aria-pressed','false'); };
    const step=i=>{ if(!active) return; if(i>=texts.length){ end(); tick(5); toast('<span class="pen">Brilliant!</span> Shadowing complete.'); return; }
      clear(); spans[i].classList.add('on'); spans[i].scrollIntoView({block:'nearest',behavior:'smooth'});
      speakSeq([{text:texts[i]}],null,{onend:()=>{ if(!active) return; spans[i].classList.add('you'); const wait=Math.max(1600,wordsOf(texts[i])*620/(S.rate||0.9)); tmr=setTimeout(()=>{ spans[i].classList.remove('you'); step(i+1); },wait); }});
      sh.textContent='■ Stop shadowing'; sh.setAttribute('aria-pressed','true'); active=true; };
    sh.onclick=()=>{ if(active){ stopSpeak(); end(); } else { active=true; step(0); } };
  }
  let t0=0, iv=null; const tb=box.querySelector('.ratimer'), tt=box.querySelector('[data-t]'), out=box.querySelector('.rawpm');
  const showWpm=()=>{ const h=(S.wpm[key]||[]); if(!h.length){ out.innerHTML=''; return; } const last=h[h.length-1], best=Math.max(...h.map(x=>x.w)); out.innerHTML=`<p class="wpm"><b>${last.w}</b> words per minute · record <b>${best}</b> · ${h.length} ${h.length===1?'reading':'readings'} <span class="note">· native speakers read aloud at about 150–160 words per minute, and talk in films at 160–200</span></p>`; };
  showWpm();
  box.querySelector('[data-act="timer"]').onclick=()=>{ stopSpeak(); tb.hidden=false; t0=Date.now(); clearInterval(iv); iv=setInterval(()=>{ const s=Math.floor((Date.now()-t0)/1000); tt.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; if(!document.body.contains(tt)) clearInterval(iv); },500); tb.scrollIntoView({block:'nearest'}); };
  box.querySelector('[data-act="stop"]').onclick=()=>{ clearInterval(iv); tb.hidden=true; const min=(Date.now()-t0)/60000; if(min<0.08) return; const w=Math.round(wordsOf(raw)/min); S.wpm[key]=(S.wpm[key]||[]).concat([{w,d:Date.now()}]).slice(-15); tick(Math.max(3,Math.round(min*2))); save(); showWpm(); };
}

function lcsMatch(a,b){ const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0)); for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]); const hit=new Array(n).fill(false); let i=0,j=0; while(i<n&&j<m){ if(a[i]===b[j]){ hit[i]=true; i++; j++; } else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; } return hit; }
function dictCheck(target,input){
  const tw=target.split(/\s+/), key=w=>canon(w), loose=w=>canon(w).replace(/[^a-z0-9]/g,'');
  const iw=input.split(/\s+/).map(canon).filter(Boolean);
  const exact=lcsMatch(tw.map(key),iw), soft=lcsMatch(tw.map(loose),iw.map(loose));
  const html=tw.map((w,i)=>exact[i]?`<span class="dw ok">${esc(w)}</span>`:soft[i]?`<span class="dw acc">${esc(w)}</span>`:`<span class="dw no">${esc(w)}</span>`).join(' ');
  const ok=exact.every(Boolean)&&iw.length===tw.length, acc=!ok&&soft.every(Boolean)&&iw.length===tw.length;
  return {ok,acc,html,miss:tw.length-soft.filter(Boolean).length};
}
function dictCard(box,sentence,src,onDone){
  let plays=0;
  box.innerHTML=`<div class="dict"><div class="btnrow">${canSpeak?`<button class="btn primary" type="button" data-d="play">▶ Listen</button><button class="btn" type="button" data-d="slow">▶ Slower</button>`:`<span class="note">No voice: read the sentence for three seconds, then write it from memory.</span><button class="btn" type="button" data-d="peek">Show for 3 seconds</button>`}<span class="note" data-d="cnt"></span></div>
    <div class="peek" hidden></div>
    <textarea class="labin" rows="2" spellcheck="false" autocapitalize="off" placeholder="Write what you hear…"></textarea>
    <div class="btnrow" style="margin-top:8px"><button class="btn" type="button" data-d="check">Check</button></div><div class="fb dres"></div></div>`;
  const ta=box.querySelector('textarea'), cnt=box.querySelector('[data-d="cnt"]');
  const play=r=>{ plays++; cnt.textContent=`played ${plays} ${plays===1?'time':'times'}`; speakSeq([{text:sentence}],null,{rate:r}); ta.focus({preventScroll:true}); };
  const pb=box.querySelector('[data-d="play"]'); if(pb) pb.onclick=()=>play();
  const sb=box.querySelector('[data-d="slow"]'); if(sb) sb.onclick=()=>play(0.6);
  const pk=box.querySelector('[data-d="peek"]'); if(pk) pk.onclick=()=>{ const p=box.querySelector('.peek'); p.textContent=sentence; p.hidden=false; setTimeout(()=>{ p.hidden=true; },3000); };
  let done=false;
  const check=()=>{ if(done||!ta.value.trim()) return; done=true; const r=dictCheck(sentence,ta.value);
    box.querySelector('.dres').innerHTML=`<div class="dline">${r.html}</div>${r.ok?'<span class="mark ok">Perfect! ✓</span>':r.acc?'<span class="mark acc">Almost: check the spelling.</span>':`<span class="mark no">${r.miss?`${r.miss} ${r.miss===1?'word':'words'} to check`:'check the sentence'}</span>`}`;
    tick(); if(!r.ok&&!r.acc) addErr('dict-'+hashStr(sentence),'dict',{s:sentence},src); onDone&&onDone(r.ok||r.acc); };
  box.querySelector('[data-d="check"]').onclick=check;
  ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); check(); } });
  return {play};
}

  bindRate(ab);
  ab.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ numType=b.dataset.t; numDrill(ab); });
  const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

  const next=()=>{
    let say,ans,show;
    if(numType==='numeri'){ const pick=R(0,3); const n=pick===0?[13,30,14,40,15,50,16,60,17,70,18,80,19,90][R(0,13)]:pick===1?R(0,100):pick===2?R(100,9999):R(10000,999999); say=String(n); ans=String(n); show=n.toLocaleString('en-GB'); }
    else if(numType==='prezzi'){ const e=R(1,199), c=[0,5,10,20,25,40,50,75,90,95,99][R(0,10)]; const cur=S.accent==='GB'?['pounds','p','£']:['dollars','cents','$']; say=c?(Math.random()<.5?`${e} ${cur[0]} and ${c} ${cur[1]}`:`${e} ${c}`):`${e} ${cur[0]}`; ans=(e+c/100).toFixed(2); show=`${cur[2]}${ans}`; }
    else if(numType==='orari'){ const h=R(1,12), m=[0,5,10,15,20,25,30,35,40,45,50,55][R(0,11)]; const nh=W[h%12+1]||W[1]; const mn=m=>({5:'five',10:'ten',15:'quarter',20:'twenty',25:'twenty-five',30:'half'})[m];
      if(Math.random()<.5){ say = m===0?`${W[h]} o'clock`: m<=30?`${mn(m)} past ${W[h]}`:`${mn(60-m)} to ${nh}`; }
      else { say = m===0?`${W[h]} o'clock`:`${W[h]} ${m<10?'oh '+m:m}`; }
      say='It\'s '+say+'.'; ans=`${h}:${String(m).padStart(2,'0')}`; show=ans; }
    else if(numType==='anni'){ const y=R(1800,2030); say=`in ${y}`; ans=String(y); show=String(y); }
    else { const d=()=>R(0,9); const p=[0,d(),d(),d(),' ',d(),d(),d(),' ',d(),d(),d(),d()]; show=p.join(''); ans=show.replace(/\s/g,''); say=show.split(' ').map(g=>g.split('').map(x=>x==='0'?'oh':x).join(' ')).join(', '); }
    const c=$('#ncard'); c.innerHTML=`${canSpeak?'<button class="btn primary" id="nplay" type="button">▶ Listen</button>':`<div class="verb">${esc(say)}</div>`}<div style="margin-top:14px"><input id="nin" inputmode="decimal" autocomplete="off" aria-label="answer"></div><div class="fb" id="nfb"></div><div class="btnrow" style="justify-content:center"><button class="btn" id="nnext" type="button">Next →</button></div>`;
    const inp=$('#nin'); let done=false;
    const play=()=>speakSeq([{text:say}]); const pb=$('#nplay'); if(pb){ pb.onclick=play; setTimeout(play,250); }
    const normN=v=>{ v=String(v).replace(/[$£€\s]/g,'').replace(/,/g,numType==='prezzi'?'.':''); if(numType==='orari'){ const m=v.match(/^(\d{1,2})[:.h]?(\d{2})?$/); return m?`${(+m[1]%12)||12}:${m[2]||'00'}`:v; } if(numType==='prezzi'){ const f=parseFloat(v); return isNaN(f)?v:f.toFixed(2); } return v.replace(/\D/g,''); };
    const check=()=>{ if(done) { next(); return; } if(!inp.value.trim()) return; done=true; const ok=normN(inp.value)===ans; tick(); $('#nfb').innerHTML=(ok?'<span class="mark ok">Right! ✓</span>':`<span class="mark no">${esc(show)}</span>`)+`<p class="note">«${esc(say)}»</p>`; inp.style.color=ok?'var(--verde)':'var(--rosso)'; };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } }); inp.focus({preventScroll:true});
    $('#nnext').onclick=next;
  };
  next();
}

function chatPick(pb){

const LVLHINT={A2:'short simple sentences, present and past simple, everyday words',B1:'natural sentences, the main tenses, some common phrasal verbs',B2:'natural, varied English with phrasal verbs and idioms, normal speed',C1:'rich, idiomatic, nuanced English, as in a film or a meeting'};
function chatRules(sc){ const lang=aiLang({band:/A2/.test(sc.lvl)?0:1})==='pt'?'Portuguese':'simple English';
  return `You are ${sc.role}. You are having a practice conversation with a Brazilian student (she also speaks Spanish) at level ${sc.lvl}. She studied English for years but has always been shy about speaking, so be warm, patient and encouraging; never lecture. Goal of the conversation: ${sc.goal}.
Rules: always stay in character; use English suited to level ${sc.lvl} (${LVLHINT[sc.lvl]||LVLHINT.B1}), with natural spoken features (contractions, fillers like "well" or "I mean"); answer in 1-3 short sentences and almost always ask a question to keep the conversation going; if she writes in Portuguese or Spanish, answer in English and give her the English words. Correct only real mistakes, not style.

async function chatSend(text){
  const sample=await getSample();

  if(text){ chat.msgs.push({who:'me',text}); chat.turns.push({role:'user',content:`Student's message: «${text}»\n(Answer only with the requested JSON.)`}); $('#cin').value=''; tick(2); }
  chat.msgs.push({who:'sys',text:'…'}); drawChat();
  const btn=$('#csend'); if(btn) btn.disabled=true;
  try{
    const turns=[{role:'user',content:chatRules(chat.sc)+'\n\nYou start the conversation, setting the scene naturally.'}].concat(chat.turns);
    const r=await sample.json(turns,{cache:false});
    chat.msgs.pop();
    const reply=String((r&&r.risposta)||'…');
    chat.turns.push({role:'assistant',content:JSON.stringify(r)});
    if(text && r && r.correzione && canon(r.correzione)!==canon(text)){ const me=[...chat.msgs].reverse().find(m=>m.who==='me'); if(me){ me.corr=String(r.correzione); me.nota=String(r.nota||''); } addErr('chat-'+hashStr(text),'lab',{q:text,s:'Correct the sentence (conversation)',a:[String(r.correzione)],n:String(r.nota||'')},'Conversation · '+chat.sc.t); }
    chat.msgs.push({who:'ai',text:reply}); drawChat();

    if(S.autoSpeak!==false) speakSeq([{text:reply}]);

  if(btn) btn.disabled=false;
}

/* ---------- BOOKS ---------- */
function bookPhase(b){ const ss=buildPlan().filter(s=>s.band===b); return ss; }
function bookTarget(bi,sessIdx){ // chapter to reach by the end of this session
  const B=BOOKS[bi], ss=bookPhase(B.band), pos=ss.findIndex(s=>s.idx===sessIdx); if(pos<0) return null;
  return Math.min(B.ch, Math.ceil(B.ch*(pos+1)/ss.length));
}
function bookLine(s){
  const bi=BOOKS.findIndex(B=>B.band===s.band); if(bi<0) return '';
  const B=BOOKS[bi], to=bookTarget(bi,s.idx), ss=bookPhase(B.band), pos=ss.findIndex(x=>x.idx===s.idx);
  const from = pos>0 ? Math.min(B.ch, bookTarget(bi,ss[pos-1].idx)+1) : 1;
  const read=(S.books&&S.books[bi])||0;
  const what = from>to ? `continue chapter ${to}` : from===to ? `chapter ${to}` : `chapters ${from}–${to}`;
  const ok=read>=to;
  return `<div class="pbook ${ok?'on':''}"><span class="pbi">❧</span><div><b>Your book (optional, 10–15 min):</b> <i>${esc(B.title)}</i>, ${what}${ok?' · ✓ you are there':''}</div><a class="btn ghost" href="#books-${bi}">Open →</a></div>`;
}
function bookStatus(bi){
  const B=BOOKS[bi], p=planStatus(), ss=bookPhase(B.band), today=p.today;
  const past=ss.filter(s=>p.dates[s.idx]<=today); const target=past.length?bookTarget(bi,past[past.length-1].idx):0;
  const read=(S.books&&S.books[bi])||0;
  const start=p.dates[ss[0].idx], end=p.dates[ss[ss.length-1].idx];
  return {B,read,target,start,end,started:start<=today};
}
function homeBooks(){

/* ---------- SPACED VOCABULARY REVIEW ---------- */
const VGAP=[1,3,7,15];
function vsr(){ S.vsr=S.vsr||{}; return S.vsr; }
function vKeyLex(t,i){ return 'lex:'+hashStr(LESSICO[t].w[i][0]); }
function vWord(k){
  if(k.startsWith('my:')){ const w=S.myvoc[k.slice(3)]; return w?{en:w.it,pt:w.pt,ex:w.ex||'',src:'My words'}:null; }
  if(k.startsWith('lex:')){ for(let t=0;t<LESSICO.length;t++){ const i=LESSICO[t].w.findIndex(w=>'lex:'+hashStr(w[0])===k); if(i>=0){ const w=LESSICO[t].w[i]; return {en:w[0],pt:w[1],ex:w[2],src:LESSICO[t].t,t,i}; } } }
  return null;
}
function vAdd(k,box){ const V=vsr(); if(V[k]&&!V[k].m) return; const b=box||0; V[k]={b,due:addDays(VGAP[b]),u:Date.now()}; save(); }
function vDue(){ const t=dayKey(), V=vsr(); return Object.keys(V).filter(k=>!V[k].m&&V[k].due<=t&&vWord(k)); }
function vStats(){ const V=vsr(), ks=Object.keys(V).filter(k=>vWord(k)); return {all:ks.filter(k=>!V[k].m).length, mastered:ks.filter(k=>V[k].m).length, due:vDue().length}; }
function vAnswer(k,ok){
  const V=vsr(), e=V[k]; if(!e) return;
  if(ok){ e.b++; if(e.b>=VGAP.length){ e.m=dayKey(); } else e.due=addDays(VGAP[e.b]); }
  else { e.b=0; e.due=addDays(1); }
  e.u=Date.now(); save();
}
let vQueue=null, vPos=0, vOk=0;
function renderWords(){
  const st=vStats(), V=vsr();
  const boxes=[0,0,0,0]; Object.keys(V).forEach(k=>{ if(!V[k].m&&vWord(k)) boxes[Math.min(3,V[k].b)]++; });

   <p class="subtitle">Words come back after 1, 3, 7 and 15 days. You see the Portuguese and type the English. Right: the word moves to the next box. Wrong: it comes back tomorrow. After the 15-day box, it is yours.</p></header>
   <div class="rgrid">
    <div class="card ${st.due?'due':''}"><span class="lab">Due today</span><b class="big">${st.due}</b><button class="btn ${st.due?'primary':''}" id="vgo" type="button" ${st.due?'':'disabled'}>Review now</button></div>
    <div class="card"><span class="lab">In review</span><b class="big">${st.all}</b><span class="note">words being learnt</span></div>

   </div>
   <div class="boxes">${boxes.map((n,i)=>`<div class="box"><span class="lab">Box ${i+1}</span><b>${n}</b><span class="note">back in ${VGAP[i]} ${VGAP[i]===1?'day':'days'}</span></div>`).join('')}</div>
   <section class="card" id="vcard" hidden></section>
   <section class="card"><div class="card-h"><div><span class="lab">Add words</span><h3>Where the words come from</h3></div></div>
    <ul class="dots"><li>Every word you add to <a href="#beyond">My words</a> enters automatically (back tomorrow).</li><li>In <a href="#vocabulary">Vocabulary by topic</a>, the cards you answer enter by themselves: «Review» comes back tomorrow, «I know it» in 3 days.</li><li>Or add a whole topic at once:</li></ul>
    <div class="chipsel" id="vtopics">${LESSICO.map((T,t)=>{ const n=T.w.filter((_,i)=>V[vKeyLex(t,i)]).length; return `<button type="button" data-t="${t}" aria-pressed="${n===T.w.length}">${esc(T.t)} · ${n}/${T.w.length}</button>`; }).join('')}</div></section>`;
  $('#vtopics').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ const t=+b.dataset.t; LESSICO[t].w.forEach((_,i)=>vAdd(vKeyLex(t,i),0)); toast(`<span class="pen">Added:</span> ${esc(LESSICO[t].t)}. The first words come back tomorrow.`); renderWords(); renderNav(route()); });

function vShow(){

  const inp=$('#vin'); inp.focus({preventScroll:true}); let done=false;

    inp.style.color=ok?'var(--verde)':'var(--rosso)'; $('#vchk').hidden=true; $('#vnext').hidden=false; if(canSpeak) speakSeq([{text:w.en}]); };
